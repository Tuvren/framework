# KRT-BL003: registry publication with npm provenance.
#
# Provenance requires a CI OIDC context (`id-token: write`), which is why the
# real publish lives here and not in a local command — see
# tools/scripts/publish-registry.ts, which refuses `--publish` outside CI.
#
# Operator flow:
#   1. Land the release commit (versions computed by `bun run release`,
#      release gate green).
#   2. Authentication is npm trusted publishing (OIDC); there is no token or
#      repository secret. Every published package must have a trusted publisher
#      on npmjs.com (Settings → Trusted publishing → GitHub Actions) set to
#      organization `Tuvren`, repository `framework`, workflow filename
#      `release.yml` (case-sensitive, extension included), no environment, and
#      "Allow npm publish" checked. npm matches on that filename, so renaming
#      this file breaks publishing until each package is reconfigured, and a
#      saved connection cannot be edited — delete and re-add it. npm's
#      January 2027 change ends direct publishing with 2FA-bypass tokens
#      (github.blog changelog 2026-07-08), which is why no token is used. A
#      package added to the published set needs its trusted publisher
#      configured before its first release; publishing needs npm 11.5.1+ and
#      Node 22.14+, and the devenv toolchain provides both.
#   3. Trigger this workflow (workflow_dispatch). Leave `dry_run: true` for a
#      full rehearsal; set it to `false` for the real publish.
#   4. After a real publish, run the acceptance check locally:
#      `bun tools/scripts/publish-registry.ts --verify-consumer <version>`.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse only (npm publish --dry-run); no registry mutation"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Two dispatched publishes must never interleave: npm's duplicate-version
# rejection is the only other guard against a torn release.
concurrency:
  group: registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish curated package set (${{ inputs.dry_run && 'dry run' || 'REAL' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same toolchain-parity approach as ci.yml: the publishable set includes
      # @tuvren/kernel-grpc-client, whose build regenerates the gitignored
      # kernel-interop bindings (buf + protoc-gen-es, both devenv-provided).
      # Running inside `devenv shell` publishes with exactly the toolchain the
      # local `bun run verify` release gate was proven against, instead of
      # hand-mirroring individual tools onto the runner.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install devenv
        run: |
          nix profile install github:NixOS/nixpkgs/1c0fc59a961424afd95e00966e6b6021b65ef605#devenv
          devenv version | grep -F "devenv 2.1.2"

      # No npm auth step on purpose: the devenv-provided npm exchanges the job's
      # OIDC token (`id-token: write`) with the registry for a short-lived
      # publish credential. actions/setup-node with `registry-url` must not be
      # added back — it exports a placeholder NODE_AUTH_TOKEN and writes an
      # .npmrc auth stanza that npm would use instead of the OIDC exchange.
      - name: Build, preflight, publish
        run: |
          devenv shell -- bash -c '
            set -euo pipefail
            bun install --frozen-lockfile
            bun tools/scripts/publish-registry.ts --build
            bun tools/scripts/publish-registry.ts --preflight
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              bun tools/scripts/publish-registry.ts --dry-run
            else
              bun tools/scripts/publish-registry.ts --publish
            fi
          '
