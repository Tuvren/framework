version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # A dependency joins the first group it matches, so the toolchain groups
    # come before the catch-all group. Each toolchain group gets its own PR
    # because its bumps can change lint, formatting, task-graph or runtime
    # behavior across the whole repository.
    groups:
      biome-toolchain:
        patterns:
          - "@biomejs/*"
        update-types:
          - minor
          - patch
      oxc-toolchain:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "ultracite"
          - "@oxlint/*"
          - "@oxfmt/*"
          - "@oxlint-tsgolint/*"
        update-types:
          - minor
          - patch
      nx-toolchain:
        patterns:
          - "nx"
          - "@nx/*"
        update-types:
          - minor
          - patch
      bun-toolchain:
        patterns:
          - "@types/bun"
          - "bun-types"
          - "bun"
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # ultracite-biome is an npm alias holding the Biome preset at exactly
      # 7.4.2 for the lint ratchet (ADR-0070). It is removed with Biome after
      # the last directory switches, so Dependabot must not move it.
      - dependency-name: "ultracite-biome"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
