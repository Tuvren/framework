version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # A dependency joins the first group it matches, so the toolchain groups
    # come before the catch-all group. Each toolchain group gets its own PR
    # because its bumps can change lint, formatting, task-graph or runtime
    # behavior across the whole repository.
    groups:
      biome-toolchain:
        patterns:
          - "@biomejs/*"
          - "ultracite"
        update-types:
          - minor
          - patch
      nx-toolchain:
        patterns:
          - "nx"
          - "@nx/*"
        update-types:
          - minor
          - patch
      bun-toolchain:
        patterns:
          - "@types/bun"
          - "bun-types"
          - "bun"
        update-types:
          - minor
          - patch
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # ultracite 7.12 turns on new preset lint rules (about 2960 violations,
      # PR #127). The lint/format toolchain is being replaced (Biome to OXC) in a
      # planned epic, so ultracite stays at 7.4.x until that work lands.
      - dependency-name: "ultracite"
        versions:
          - ">7.4.2"
      # @copilotkit/aimock 1.43.0 ships a regular expression that Bun 1.3.10 cannot
      # parse (import fails with "range out of order in character class"), so it
      # needs the Bun 1.4 upgrade (EPIC-BO); it also changes recorded request body
      # types and needs the isChatCompletionBody guard in the host-repl test helpers.
      # Hold it at the current pin until that epic lands, then remove this entry.
      - dependency-name: "@copilotkit/aimock"
        versions:
          - ">1.15.1"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
