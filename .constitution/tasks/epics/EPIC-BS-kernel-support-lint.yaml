  - id: KRT-BS001
    title: Apply safe fixes and preserve types per directory
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in:
        - typescript/kernel/grpc-client
        - typescript/kernel/testkit
        - typescript/kernel/certification
        - typescript/kernel/certification-sqlite
        - typescript/kernel/certification-postgres
        - ".changeset/toolchain-bs-kernel-support-lint.md"
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Run safe --fix one project at a time and immediately typecheck that project. Repair the 19 measured autofix failure classes, including required undefined arguments and readonly array to Set rewrites. Complete kernel support packages without touching the adapter directory, which has a separate project-resolution gate. Do not switch lint targets yet. Add or update .changeset/toolchain-bs-kernel-support-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/kernel-grpc-client. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project typechecks after each safe-fix batch, existing runtime assertions pass, and no signature or collection semantics change. Record changed files and the before/after diagnostic count per project. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BS002
    title: Migrate live suppressions and delete dead ones
    type: Chore
    effort: 3
    depends_on: [KRT-BS001]
    scope:
      in:
        - typescript/kernel/grpc-client
        - typescript/kernel/testkit
        - typescript/kernel/certification
        - typescript/kernel/certification-sqlite
        - typescript/kernel/certification-postgres
        - ".changeset/toolchain-bs-kernel-support-lint.md"
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a proposed native suppression lacks a fresh equivalent diagnostic, changes the original reason, removes a needed Biome directive before native admission, or introduces a Biome directive; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Treat the measured 144-directive inventory as an identification baseline, not a quota. Re-run live retained-Biome and Oxlint diagnostics across the owned paths. For every baseline identity and any drift discovered at execution, record its original reason, equivalent native rule, retained-checker disposition, and native-admission disposition. While Biome owns a path, preserve each needed original Biome directive and its reason. Remove a directive before admission only after a behavior-preserving code fix proves that the retained Biome diagnostic no longer fires. Do not add Biome directives. Record a native counterpart only when the equivalent native rule actually fires and the original reason remains valid. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Do not create suppressions to reproduce the historical 82-live/62-dead classification. Provide the per-directive disposition ledger for CB aggregation. Add or update .changeset/toolchain-bs-kernel-support-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/kernel-grpc-client. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert every baseline directive identity in the owned paths, plus any measured drift, has a ledger entry backed by live retained-Biome and Oxlint diagnostics. Each entry records the original reason, retained-checker disposition, and native-admission disposition. While Biome owns the path, prove each needed original directive remains and the full lint gate passes. Prove any early deletion follows a behavior-preserving code fix and a fresh retained-Biome run where the diagnostic no longer fires. Prove each planned native counterpart matches an actually firing equivalent rule and preserves the original reason. Add no Biome directive, manufacture no suppression to meet a historical count, and emit the ledger CB will aggregate. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
