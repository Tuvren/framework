      command: bun run verify
      expected: Exit 0; all 12 targets are native-clean with exact forwarding/cache profiles, 29 final legacy identities are reconciled, and the release gate passes.
    stop_conditions:
      - STOP if BY or CA is not merged, a target profile differs from the sealed overlay, a needed legacy comment is removed before admission, or a public contract changes; do not improvise.
      - STOP if the final authored diff exceeds 15000 raw changed lines, compact provenance and closeout exceed the 500-line reserve, or evidence is expanded instead of reused; do not improvise.
    description: After BY and CA, deliver the remaining frozen small-package files and sealed CA overlay. This carries the final-owned KRT-CA001 safe fixes, KRT-CA002 dispositions, KRT-CA003 ordering results, and the complete KRT-CA004 admission outcome. Keep the runtime-contract-shapes bridge and four retained-Biome-failing files with this final owner. Atomically reconcile and remove the 29 original admission identities on 27 paths, switch coverage, and require top-level forwardAllArgs false on all 12 lint targets. For certification, SDK, AG-UI, stream core/SSE/WS, OTel, testkit, and MCP client, set lint inputs to every literal root lint default plus ^production. Batteries-included certification, shared core, and telemetry semconv receive no target-local inputs. Preserve commands, cwd, parallel and all unrelated fields. Keep the whole KRT-CA004 evidence directory, the existing direct eight-package patch Changeset, public signatures, and source behavior. Add no lint policy, config override, build edge, compatibility shim, or generated edit. Feasibility measured 13210 raw changed lines from the declared dependency tree; reserve at most 500 additional lines for compact provenance and closeout, plus the declared direct Changeset where new. The resulting bounded total is 13710, leaving 1290 lines below the hard 15000-line review cap. These measurements prove the cut fits; estimated_diff_lines remains an independently planned forecast.
