tickets:
  - id: KRT-DM001
    title: Confirm the codegen-free validator and the single-transaction head rewind
    type: Spike
    effort: 3
    depends_on: []
    spike: SPK-KRT-DM001
    scope:
      in: [".constitution/spikes/SPK-KRT-DM001.md"]
    verification:
      command: bun run check
      expected: "Exit 0; the spike report's Recommendation and Downstream impact sections are filled and no source changed."
    stop_conditions:
      - "STOP if no interpreting validator covers drafts 7, 2019-09, and 2020-12 with local $ref resolution under node --disallow-code-generation-from-strings; report the gap for an owner ruling and don't improvise."
    description: "Recommend the validator wrapper package: an @tuvren/core subpath (the assumed recommendation), or per-package use with the details projection typed in @tuvren/core. Record the recommendation as a spec-patch milestone on ADR-0083. ADR-0083 decisions 1 and 4. Measure @cfworker/json-schema 4.1.1 against the schemas the runtime, ReAct runner, MCP client, and AI SDK bridge validate today, under node --disallow-code-generation-from-strings. Cover draft coverage, local and relative $ref, unknown keywords, format behavior, the details projection the new tool_input_validation_failed and tool_result_validation_failed results carry, and a small latency comparison against Ajv. Compare @hyperjump/json-schema as the fallback if the candidate fails. Separately, determine whether the existing kernel syscalls can return the branch head and the turn head to the stable head in one kernel transaction after run.complete(failed) reactively checkpoints staged work. If they can't, state the smallest kernel operation that would, for a Stage 3 ADR and kernel authority change. Inventory every production schema-compile site and where each would move to registration."
    acceptance:
      mode: gherkin
      evidence: |
        Feature: Validator and rewind spike

          Scenario: The validator recommendation is measured
            Given the spike work is complete
            When I read ".constitution/spikes/SPK-KRT-DM001.md"
            Then it records each schema family's result under the no-codegen flag for the candidate and, when needed, the fallback
            And it names one validator, its details projection, and the wrapper package recommendation for the ADR-0083 spec patch

          Scenario: The rewind mechanism is decided
            Given the spike work is complete
            When I read ".constitution/spikes/SPK-KRT-DM001.md"
            Then it states whether existing syscalls rewind both heads in one transaction
            And if they don't, it names the kernel operation a Stage 3 pass must record

          Scenario: No production code changed
            Given the spike is complete
            When I diff the working tree against the commit before the spike milestone
            Then no file under typescript/ changed
