    description: "If reports/compatibility conflicts on rebase, regenerate it with the project's evidence refresh rather than hand-merging. Add subsequentErrors as an additive optional field on the failed branch of ExecutionResult, and state it in framework specification section 7.1. The throwing approval() predicate survives registration checks and is the root-cause trigger. Keep a schema-compile trigger as a second case; KRT-DM004 later rewrites it to expect a tool_schema_invalid registration failure. ADR-0083 decision 5. When an execution fails hard, its result reports the first fatal error. A later finalization failure is attached as a secondary cause and never replaces it, and the event stream keeps both. Today publishProjectedError overwrites the remembered error for fatal and non-fatal errors alike, and settleResult reports the last one (runtime-core-events.ts:345-353, runtime-execution-handle.ts:338). Add engine checks, judged by the runner from observations through the framework adapter, for two triggers: an approval() predicate that throws and a tool whose schema can't compile. Each check observes that the result's error code and message are the trigger's own and that the backend's head-mismatch error does not appear as the result error. Bind new operations as observation-only bridges per guidelines 5.10, with no adapter-computed verdicts."
    acceptance:
      mode: contract_test
      evidence: "Engine plan checks assert, from observed results and events, that the result error is the trigger's error for both triggers before the registration check is introduced, and that any finalization failure appears only as a secondary cause. A runtime unit test covers a fatal error followed by a non-fatal error."
