decisions:
  - id: OD-23
    question: "@cfworker/json-schema 4.1.1, the assumed candidate, failed SPK-KRT-DM001. It accepted an invalid draft 2020-12 $dynamicRef case, accepted malformed schemas, and deferred unresolved-reference errors to validation time. Which interpreting JSON Schema validator replaces runtime Ajv?"
    blocks: [KRT-DM004, KRT-DM005, KRT-DM006]
    options:
      - name: "@hyperjump/json-schema 1.18.0 behind a @tuvren/core/schema-validation wrapper, prepared at registration"
        pros:
          - "Passed every sampled repository schema family and probe under --disallow-code-generation-from-strings, including the 2020-12 $dynamicRef case, and rejected malformed schemas and unresolved references at preparation."
          - "One wrapper and one details projection ({ instanceLocation, keywordLocation, keyword }) serve the runtime, ReAct runner, MCP client, and AI SDK bridge without a package cycle."
        cons:
          - "Preparation is asynchronous, so registration must become an async boundary for the built-in validator."
          - "It declares seven caret-ranged runtime dependencies (@hyperjump/json-pointer, json-schema-formats, @hyperjump/pact, @hyperjump/uri, content-type, just-curry-it, uuid) and a required peer, @hyperjump/browser ^1.1.0. Every @tuvren/core consumer would inherit them; @tuvren/core has no dependencies today, and ADR-0083 assumed a dependency-free library."
          - "Its shared schema registry and global format configuration need isolation, it reports an unresolved reference as a plain TypeError that the wrapper must map, its BASIC output format is documented as experimental, and validation measured about 16.6x Ajv's time."
      - name: "@cfworker/json-schema 4.1.1 hardened inside the same wrapper"
        pros:
          - "Synchronous and dependency-free, so @tuvren/core stays dependency-light; measured about 8x Ajv's time."
          - "It implements $recursiveRef and $recursiveAnchor; a draft 2019-09 recursive probe was rejected correctly."
        cons:
