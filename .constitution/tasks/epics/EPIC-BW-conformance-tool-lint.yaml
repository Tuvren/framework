    title: Apply safe fixes and preserve types per directory
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in: [tools/conformance, tools/scripts/conformance, tools/generators]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Run safe --fix one project at a time and immediately typecheck that project. Repair the 19 measured autofix failure classes, including required undefined arguments and readonly array to Set rewrites. Conformance tools measured 554 diagnostics and 2832 definition lines. Preserve shared grading and required evidence. Do not switch lint targets yet."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project typechecks after each safe-fix batch, existing runtime assertions pass, and no signature or collection semantics change. Record changed files and the before/after diagnostic count per project."
    flows: []
    certainty: settled
    status: planned
  - id: KRT-BW002
    title: Migrate live suppressions and delete dead ones
    type: Chore
    effort: 3
    depends_on: [KRT-BW001]
    scope:
      in: [tools/conformance, tools/scripts/conformance, tools/generators]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a suppression hides a new semantic failure instead of an equivalent measured diagnostic occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Treat the measured 144-directive inventory as an identification baseline, not a quota. Re-run live Oxlint diagnostics across the owned paths. For every baseline identity and any drift discovered at execution, record its original reason, equivalent rule, and per-directory disposition. Preserve the identity and reason only when the equivalent rule still fires; delete directives with no live equivalent. Do not create suppressions to reproduce the historical 82-live/62-dead classification. Provide the per-directive disposition for CB aggregation."
    acceptance:
      mode: contract_test
      evidence: Assert every baseline directive identity in the owned paths, plus any measured drift, has an evidence-backed per-directory disposition. Reproduce the equivalent Oxlint diagnostic before preserving a suppression and retain its original reason; prove deleted directives have no live equivalent. Check the owned paths have no biome-ignore comments, manufacture no suppression to meet a historical count, and emit the disposition evidence CB will aggregate.
    flows: []
    certainty: settled
    status: planned
  - id: KRT-BW003
    title: Reorder definitions without initialization regressions
    type: Chore
    effort: 8
    depends_on: [KRT-BW002]
    scope:
      in: [tools/conformance, tools/scripts/conformance, tools/generators]
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a runtime or conformance regression follows reordering; return the rule pair to the owner without overrides occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Convert func-style declarations and reorder no-use-before-define definitions in bounded reviewable module batches. Preserve exports, initialization order and observable execution. The merged kernel pilot is the prerequisite; apply its proven ordering method."
    acceptance:
      mode: contract_test
      evidence: "Assert module initialization, cyclic imports and conformance outcomes match the pre-reorder baseline. Run scoped tests, repository typecheck and bun run conformance on the same implementation. Preserve error and event ordering, not just lint success."
    flows: []
    certainty: settled
    status: planned
  - id: KRT-BW004
    title: Clear remaining rules and prove native-clean readiness
    type: Chore
    effort: 8
    depends_on: [KRT-BW003]
    scope:
      in:
        - tools/conformance
        - tools/scripts/conformance
        - tools/generators
        - tools/biome-coverage/bw.json
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if native-clean proof would require a synthetic or overlapping Nx project, remove retained Biome ownership before CB, or let the type-aware backend skip an installed enabled rule; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Clear remaining syntactic diagnostics, then prove native-clean readiness for BW's tools/conformance, tools/scripts/conformance, and tools/generators ownership with the complete effective shipped preset unchanged. Derive the owned code selection from Oxlint's actual --debug=files output and the owned JSON selection from the native source-integrity checker; Oxfmt ignores affect formatting only. Use the established native helpers without adding dependencies or repository-owned lint policy. Ensure type-aware lint can read prerequisite declarations while ordinary typecheck remains source-only. This cleanup region has no independent Nx project root: do not create a synthetic or overlapping project, do not activate a partial target, and do not remove tools/biome-coverage/bw.json. CB, after BU, BV, and BW complete, admits the whole tools root atomically and retires all three retained entries."
    acceptance:
      mode: contract_test
      evidence: "Assert the type-aware backend runs every installed, enabled, as-shipped type-aware rule over the complete owned code selection with complete equality of rules, options, severities, environment, globals, plugins, settings, and categories and with no local override or project-resolution error. Treat 55 type-aware rules in the measured 474-rule installed preset, alongside 419 non-type-aware rules, as pinned historical evidence rather than a future quota. Assert actual --debug=files and native JSON selections cover the owned files, source-integrity coverage remains independent of formatter ignores, scoped tests and the full lint gate pass, and tools/biome-coverage/bw.json remains unchanged under active Biome ownership pending CB's whole-tools admission."
