id: DR
name: "Close kernel.memory control gaps by rule"
kind: product
capabilities: [CAP-035, CAP-037, CAP-038]
depends_on: [DT]
priority: 5
scope:
  paths:
    - "spec/conformance/kernel"
    - "typescript/kernel/testkit"
    - "typescript/kernel/conformance-adapter"
    - "tools/conformance/meta-conformance"
    - "tools/conformance/harness/test"
    - "reports/compatibility"
  tech_spec_patchable: []
estimated_diff_lines: 17800
estimate_source: planned
# Estimate: 25 points at about 711 diff lines per point, rounded to 17,800 lines; includes checked-in generated evidence because diff_exclusions excludes lockfiles and snapshots, not generated evidence. This exceeds the 15,000-line review guide; measure at closeout and replan if necessary.
tickets:
  - id: KRT-DR001
    title: "Detect schema-roundtrip corruption across fixtures"
    type: Feature
    effort: 5
    depends_on: [KRT-DR006]
    scope:
      in:
        - "spec/conformance/kernel"
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "tools/conformance/meta-conformance"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if any fixture cannot expose the corruption; route that claim for a ruling rather than marking it detected."
    description: "Introduce one schema-roundtrip corruption mutant and designate the aggregate claim and its 17 fixture-specific claims in spec/conformance/kernel/kernel-memory-undetected.json. Keep the committed fixture expectations independent of the implementation. Run new kernel.memory controls on each claiming TypeScript backend. Record an explicit unsupported reason for every new mutant in the Rust diagnostic configuration until DS. STOP and route any new positive assertion Rust cannot pass to DS; it must not block publishing the TypeScript testkit."
    acceptance:
      mode: contract_test
      evidence: "The mutant activates and every designated schema-roundtrip claim has a detecting assertion; the unmutated checks pass and all 18 corresponding register entries are removed. SQLite and PostgreSQL each kill every applicable control added by this ticket with backend-matched activation and designated failures; their unmutated checks pass. The expanded inventory, including codec claims from DR006, is authoritative; no fixed total of 40 is assumed."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
