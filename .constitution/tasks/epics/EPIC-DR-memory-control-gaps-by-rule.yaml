    description: "Recompute the kernel.memory claim inventory and detector mapping after the rule-class mutants land. For any claim that could not be detected, route its precise evidence as an owner decision; an unexplained register entry is not closure. Do not close this ticket on a proposal: finish with an empty register or STOP for an owner ruling; after the ruling, remaining reasons name its closed OD id for the publish gate."
    acceptance:
