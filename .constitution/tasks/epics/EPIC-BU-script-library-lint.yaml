tickets:
  - id: KRT-BU001
    title: Apply safe fixes and preserve types per directory
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in: [tools/scripts/lib]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Run safe --fix one project at a time and immediately typecheck that project. Repair the 19 measured autofix failure classes, including required undefined arguments and readonly array to Set rewrites. This scope owns library helpers only; gate entrypoints are a separate concurrent epic. Do not switch lint targets yet."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project typechecks after each safe-fix batch, existing runtime assertions pass, and no signature or collection semantics change. Record changed files and the before/after diagnostic count per project."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BU002
    title: Migrate live suppressions and delete dead ones
    type: Chore
    effort: 3
    depends_on: [KRT-BU001]
    scope:
      in: [tools/scripts/lib]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a proposed native suppression lacks a fresh equivalent diagnostic, changes the original reason, removes a needed Biome directive before native admission, or introduces a Biome directive; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Treat the measured 144-directive inventory as an identification baseline, not a quota. Re-run live retained-Biome and Oxlint diagnostics across the owned paths. For every baseline identity and any drift discovered at execution, record its original reason, equivalent native rule, retained-checker disposition, and native-admission disposition. While Biome owns a path, preserve each needed original Biome directive and its reason. Remove a directive before admission only after a behavior-preserving code fix proves that the retained Biome diagnostic no longer fires. Do not add Biome directives. Record a native counterpart only when the equivalent native rule actually fires and the original reason remains valid. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Do not create suppressions to reproduce the historical 82-live/62-dead classification. Provide the per-directive disposition ledger for CB aggregation."
    acceptance:
      mode: contract_test
      evidence: Assert every baseline directive identity in the owned paths, plus any measured drift, has a ledger entry backed by live retained-Biome and Oxlint diagnostics. Each entry records the original reason, retained-checker disposition, and native-admission disposition. While Biome owns the path, prove each needed original directive remains and the full lint gate passes. Prove any early deletion follows a behavior-preserving code fix and a fresh retained-Biome run where the diagnostic no longer fires. Prove each planned native counterpart matches an actually firing equivalent rule and preserves the original reason. Add no Biome directive, manufacture no suppression to meet a historical count, and emit the ledger CB will aggregate.
    flows: []
    certainty: settled
    status: done
  - id: KRT-BU003
    title: Reorder definitions without initialization regressions
    type: Chore
    effort: 8
    depends_on: [KRT-BU002]
    scope:
      in: [tools/scripts/lib]
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a runtime or conformance regression follows reordering; return the rule pair to the owner without overrides occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Convert func-style declarations and reorder no-use-before-define definitions in bounded reviewable module batches. Preserve exports, initialization order and observable execution. The merged kernel pilot is the prerequisite; apply its proven ordering method."
    acceptance:
      mode: contract_test
      evidence: "Assert module initialization, cyclic imports and conformance outcomes match the pre-reorder baseline. Run scoped tests, repository typecheck and bun run conformance on the same implementation. Preserve error and event ordering, not just lint success."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BU004
    title: Clear remaining rules and prove native-clean readiness
    type: Chore
    effort: 8
    depends_on: [KRT-BU003]
    scope:
      in: [tools/scripts/lib, tools/biome-coverage/bu.json]
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if native-clean proof requires a synthetic or overlapping Nx project, removes a needed original Biome directive or retained coverage before CB, adds an unmeasured native counterpart, or lets the type-aware backend skip an installed enabled rule; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Clear remaining syntactic diagnostics, then prove native-clean readiness for BU's tools/scripts/lib ownership with the complete effective shipped preset unchanged. Derive the owned code selection from Oxlint's actual --debug=files output and the owned JSON selection from the native source-integrity checker; Oxfmt ignores affect formatting only. Use the established native helpers without adding dependencies or repository-owned lint policy. Ensure type-aware lint can read prerequisite declarations while ordinary typecheck remains source-only. Consume KRT-BU002's ledger and rerun retained-Biome and Oxlint diagnostics. Preserve every needed original Biome directive and its reason while Biome owns the region. A scoped native-clean proof can add a native counterpart only when the equivalent native rule actually fires and the original reason remains valid. Do not require zero biome-ignore comments before admission, and do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. This cleanup region has no independent Nx project root: do not create a synthetic or overlapping project, do not activate a partial target, and do not remove tools/biome-coverage/bu.json. CB, after BU, BV, and BW complete, admits the whole tools root atomically and retires all three retained entries."
    acceptance:
      mode: contract_test
      evidence: "Assert the type-aware backend runs every installed, enabled, as-shipped type-aware rule over the complete owned code selection with complete equality of rules, options, severities, environment, globals, plugins, settings, and categories and with no local override or project-resolution error. Treat 55 type-aware rules in the measured 474-rule installed preset, alongside 419 non-type-aware rules, as pinned historical evidence rather than a future quota. Reconcile KRT-BU002's ledger against fresh diagnostics. Prove every needed original Biome directive and reason remain while Biome owns the region, and prove each native counterpart matches an actually firing equivalent rule with the same reason. Assert actual --debug=files and native JSON selections cover the owned files, source-integrity coverage remains independent of formatter ignores, scoped tests and the full lint gate pass, and tools/biome-coverage/bu.json remains unchanged under active Biome ownership pending CB's whole-tools admission."
    flows: []
    certainty: settled
    status: done

