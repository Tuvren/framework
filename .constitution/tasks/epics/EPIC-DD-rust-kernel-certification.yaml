id: DD
name: Certify the Rust kernel on the kernel catalog
kind: product
capabilities: [CAP-035, CAP-036, CAP-037, CAP-038]
depends_on: [DC]
priority: 5
scope:
  paths:
    - rust/kernel
    - rust/kernel-conformance-adapter
    - rust/kernel-certification
    - spec/conformance/kernel
    - tools/conformance/meta-conformance
    - tools/conformance/certification
    - reports/compatibility
  tech_spec_patchable:
    - .constitution/tech-spec/contracts/kernel-identity-recipes.meta.yaml
estimated_diff_lines: 8000
estimate_source: planned
tickets:
  - id: KRT-DD002
    title: Bind the Rust kernel to the protocol syscalls and canonical diff order
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - rust/kernel
        - rust/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; the rewritten protocol plans pass against the Rust kernel adapter with no composite operations for those claims."
    stop_conditions:
      - "STOP if a protocol syscall has no public Rust kernel API; record it as an implementation finding; do not improvise."
    description: "ADR-0075, ADR-0078, and ADR-0080. Add the Rust observation encoding helpers ($bytes, safe integers, tagged records, duplicate-key rejection), claim kernel.syscall, and add syscall bindings that forward native results and errors unchanged beside the Rust adapter's protocol composites (including recovery-state, which echoes its fixture), which stay only for the legacy plans until DJ retires them, and make the Rust kernel return canonical changedPaths order. Triage every failure in this ticket's certification-triage.yaml."
    acceptance:
      mode: contract_test
      evidence: "Assert the protocol plans pass on the Rust kernel, recovery-state observations come from the kernel rather than the fixture, and the Rust adapter performs no comparison, sorting, or normalization for these operations."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - rust/kernel-grpc-service/src/lib.rs
          - rust/kernel-grpc-service/tests/interop_smoke.rs
        justification: "Aligning Rust kernel error codes with the catalog (the EPIC-DB turn_head_lateral_move follow-up the plan routed here) requires the gRPC service's status mapping to follow."
      - files:
          - reports/compatibility
        justification: "Generated Rust compatibility evidence is refreshed with bun run compatibility:evidence because verify:kernel and certification parity check its freshness."
    status: done
  - id: KRT-DD003
    title: Add a Rust test-only fault seam and clock injection
    type: Feature
    effort: 5
    depends_on: [KRT-DD002]
    scope:
      in:
        - rust/kernel
        - rust/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; armFault with mode throw and setClock work against the Rust kernel and produce activation evidence."
    stop_conditions:
      - "STOP if the seam would be reachable from the production gRPC service path; do not improvise."
    description: "ADR-0076 decision 7. Add a test-only fault seam to the Rust kernel at the storage-boundary points that its in-memory backend can express, and inject backend and worker clocks, both reachable only from the conformance adapter. Bind armFault (throw) and setClock."
    acceptance:
      mode: contract_test
      evidence: "Assert each supported point produces a typed fault and activation evidence, unsupported points report unsupported, and the gRPC service binary cannot reach the seam."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    deviations:
      - files:
          - reports/compatibility
        justification: "Generated Rust compatibility evidence is refreshed with bun run compatibility:evidence because verify:kernel and certification parity check its freshness."
    status: done
  - id: KRT-DD004
    title: Bind the remaining memory-profile families in Rust and triage
    type: Feature
    effort: 8
    depends_on: [KRT-DD003]
    scope:
      in:
        - rust/kernel
        - rust/kernel-conformance-adapter
        - rust/kernel-certification
        - spec/conformance/kernel/negative-controls.json
        - tools/conformance/meta-conformance
        - tools/conformance/certification
        - reports/compatibility
    verification:
      command: bun run conformance
      expected: "Exit 0; the syscall plans for isolation, reclamation, liveness, and in-process recovery pass or are triaged against the Rust kernel, and representative Rust mutants are killed."
    stop_conditions:
      - "STOP if certifying requires weakening a plan to make Rust pass; record the implementation or specification finding instead; do not improvise."
    description: "ADR-0075, ADR-0079, ADR-0081. Bind the isolation, reclamation, liveness, and in-process recovery syscalls in the Rust adapter, remove the tautological erasure and remaining composites from the syscall path, and reproduce representative mutants in Rust (wrong hash, drop staged, cross-scope resolve, reachable delete). The kernel.memory claim and certificate follow the writer race in the orchestration epic. Fix Rust implementation findings that are small and local; file the rest as issues with replay commands. Every finding is classified in this ticket's certification-triage.yaml, and a cross-implementation disagreement report compares TypeScript and Rust observations."
    acceptance:
      mode: contract_test
      evidence: "Assert the Rust syscall runs cover every memory-profile family, each failure has a triage entry, the Rust mutants are killed, and the TypeScript and Rust disagreement report is captured in the evidence manifest."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - spec/conformance/kernel/plans/kernel-scope-isolation-syscall.json
          - spec/conformance/kernel/plans/kernel-restart-recovery-syscall.json
        justification: "Review found the Rust lane hid legacy obligations behind a capability filter; the two syscall plans now gate on capabilities implementations truthfully claim, with operations, assertions, and claims unchanged."
      - files:
          - tools/conformance/harness/run.ts
          - tools/scripts/lib/conformance-contract.ts
        justification: "The harness records every selected or excluded check with a reason in the pinned selection shape so no obligation is dropped silently (ADR-0081)."
    status: done
closeout:
  tickets_completed:
    - KRT-DD002
    - KRT-DD003
    - KRT-DD004
  tickets_deferred: []
  points_completed: 18
  spec_patches: []
  changelog_entries:
    - directory: tasks
      type: added
      text: "EPIC-DD certified the Rust kernel on the kernel catalog: a lossless Rust syscall bridge, catalogued error codes, a feature-gated fault seam and clock injection unreachable from the gRPC service, atomic production syscalls, all four memory-profile syscall families passing (58 of 58), three native Rust mutants killed with the rest reported unsupported, and a kernel comparison tool showing no TypeScript-Rust disagreement beyond the sanctioned variation it encodes."
  candidate_terms: []
  routed_upstream:
    - stage: tech-spec
      item: "When a run completes, TypeScript sets currentStepIndex to the step sequence length and Rust leaves it unchanged, which changes run.recover lastCompletedStepId; the kernel specification does not decide which is correct."
    - stage: tech-spec
      item: "TypeScript rejects turn head rewrites that would orphan active runs or dependent turns (assertTurnHeadRewritePreservesDependents); Rust enforces only the descendant rule in the specification. Decide whether the dependents guard is normative."
    - stage: tech-spec
      item: "branch.setHead with an active run emits branch_has_active_run in Rust and kernel_runtime_branch_has_active_run in TypeScript, Go, and Dart, and the catalog lists neither for kernel.branch.setHead; add a canonical code."
    - stage: tech-spec
      item: "ADR-0078 requires explicit map nodes, but both the TypeScript and Rust adapter decoders accept untagged plain objects as maps; tighten the rule or the decoders fleet-wide."
  follow_ups:
    - "Sanctioned-variation rules (opaque cursors, fencing tokens, bootstrap bytes, archive branch ids, error prose) live in tools/conformance/meta-conformance/observation-comparison.ts; move them into per-operation authority metadata in the kernel catalog so tooling only applies them."
    - "Every public Rust kernel method relies on a hand-written transaction guard and rust/kernel/src/memory.rs exceeds 3,800 lines; route syscalls through one dispatch wrapper so atomicity and the fault seam are structural."
    - "Issue #205: kernel.edge-validation selects both the seven syscall edge checks Rust passes and deprecated composite checks it does not implement; claim it for Rust once EPIC-DJ retires the composites."
    - "The Rust negative-control control run uses adapter-syscall.json while the certification inventory names adapter.json; decide the certifying manifest before the kernel.memory certificate work in EPIC-DE."
    - "The Rust legacy lane still grades the tautological erasure probes and the fixture-echo recovery_state composite until EPIC-DJ."
    - "Ten kernel mutants have no Rust reproduction yet, and cross-scope resolve needs a shared-substrate construction seam in the Rust kernel."
    - "The Rust kernel-certification test target now runs harness, control, and mutant runs through cargo with 60-second timeouts; watch it for slowness on cold caches."
  code_decisions:
    - summary: "Rust kernel test controls (fault seam, clocks, mutants) live behind a conformance Cargo feature reached only from the conformance adapter; mutants are selected with --mutant-from-env plus TUVREN_KERNEL_MUTANT through a noncertifying manifest."
      kind: pattern
      paths:
        - rust/kernel/src/memory/conformance.rs
        - rust/kernel/src/testkit.rs
        - rust/kernel-conformance-adapter/adapter-mutant.json
      commit: "6180129"
    - summary: "Rust kernel syscalls run on a draft state that publishes only on success in production as well as conformance builds."
      kind: pattern
      paths:
        - rust/kernel/src/memory/transaction.rs
      commit: ab72b06
    - summary: "The Rust adapter routes syscalls through a routing! data table with record-field macros and opaque instance handles."
      kind: convention
      paths:
        - rust/kernel-conformance-adapter/src/host_syscalls.rs
      commit: fadec4e
    - summary: "tools/conformance/meta-conformance/disagreements.ts compares N implementations from adapter manifests, normalizes $map entries, pseudonymizes fencing tokens deterministically, and classifies differences as sanctioned (with citation), coverage, or disagreement."
      kind: pattern
      paths:
        - tools/conformance/meta-conformance/disagreements.ts
        - tools/conformance/meta-conformance/observation-comparison.ts
      commit: 4367a5b
    - summary: "Harness evidence records the selection inventory with an exclusion reason for every check not run."
      kind: contract_shape
      paths:
        - tools/conformance/harness/run.ts
      commit: 4367a5b
  settled: []
