estimated_diff_lines: 4500
estimate_source: planned
tickets:
  - id: KRT-BO001
    title: Copy memory backend buffers at both boundaries
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in:
        - typescript/kernel/backends/memory/src
        - ".changeset/toolchain-bo-bun-refresh.md"
    verification:
      command: "bun run nx run backend-memory:test"
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if unchanged tests fail or record encoding changes occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. Stored bytes remain owned by the backend. Reads and writes copy buffers so a cbor-x decoder cannot mutate stored records through dataView. Keep all backend tests unchanged. Add or update .changeset/toolchain-bo-bun-refresh.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert caller-buffer mutation after writing and mutation of a returned buffer cannot alter a later read. All 77 unchanged memory-backend tests pass, including the three Bun 1.4 regression cases. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
      supplementary: [live_probe]
      recipe: reference-host-memory-scenario
    flows: []
    certainty: settled
    status: done
    deviations:
      - files: [typescript/kernel/backends/memory/test/buffer-ownership.test.ts]
        justification: "Step-0 user ruling authorizes this exact new package-local regression file; all 77 pre-existing tests remain unchanged. The original ticket and epic list only src for memory code."
  - id: KRT-BO002
    title: Refresh devenv and migrate Weaver atomically
    type: Chore
    effort: 8
    depends_on: [KRT-BO001]
    scope:
      in:
        - devenv.nix
        - devenv.lock
        - spec/telemetry
        - tools/scripts/telemetry-codegen.ts
        - typescript/telemetry/semconv/src/lib/generated
        - rust/kernel/src/generated/tuvren_runtime_telemetry.rs
        - ".changeset/toolchain-bo-bun-refresh.md"
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if Weaver cannot read schema_url, PostgreSQL leaves major 17, or full verification fails occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. The nixpkgs refresh, registry_manifest.yaml to manifest.yaml rename, one schema_url, generator manifest reader, and regeneration of the four telemetry artifacts land in one code-only change. Keep pkgs.postgresql_17 explicit. Prove the refreshed tools through the full lane before aligning Bun; never land the manifest against Weaver 0.21.2. Assumption: The refreshed shared nixpkgs pin preserves all other generator and runtime checks. Add or update .changeset/toolchain-bo-bun-refresh.md as a patch changeset with direct coverage for the affected public packages: @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: runbook_probe
      evidence: "Apply the refreshed environment and run bun run codegen and bun run verify. Probe Weaver manifest resolution and PostgreSQL major 17. Expect stable second regeneration of semantic-conventions.md, otel-attributes.json, the TypeScript helper and Rust helper, and no semantic vocabulary drift. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - typescript/runtime/src/lib/runtime-core-recovery.ts
          - typescript/runtime/test/runtime-core-recovery-comparison.test.ts
          - typescript/sdk/tsconfig.json
          - typescript/sdk/test/module-resolution.test.ts
        justification: "User2026-09-30 authorized a separately reviewed bounded prerequisite and autonomous continuation. A2 records measured Bun1.4 incompatibilities: data-equivalent durable/live JSON prototypes and SDK paths overriding inherited source aliases. Exact changes restore existing behavior, preserve original assertions and public signatures, and add direct runtime/SDK patch coverage. No Biome/core/PostgreSQL source change."
  - id: KRT-BO003
    title: Align Bun and remove the upgrade hold
    type: Chore
    effort: 5
    depends_on: [KRT-BO002]
    scope:
      in: [devenv.nix, package.json, bun.lock, ".github/dependabot.yml"]
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the binary differs from packageManager or frozen installation changes the lockfile occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. Move the runtime to the latest available 1.4.x from the refreshed pin, at least 1.4.1. Align packageManager with the actual binary and remove the >=1.4.0 holds for bun, bun-types and @types/bun. Record any lockfile-format transition without unrelated dependency upgrades. Assumption: The selected 1.4.x binary and lockfile format preserve frozen workspace installs."
    acceptance:
      mode: contract_test
      evidence: "Assert installed Bun and packageManager match, frozen install is repeatable, the three upgrade holds are absent, and the unchanged memory backend suite and full verification pass on that binary."
    flows: []
    certainty: assumed
    status: done
  - id: KRT-BO004
    title: Measure isolation and credential-scoping behavior
    type: Chore
    effort: 8
    depends_on: [KRT-BO003]
    scope:
      in: [package.json, bun.lock, ".github/workflows"]
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if isolation changes semantics beyond runner configuration or credential scoping cannot be proven without publishing occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. Review all 204 test files for cross-file state against observed Bun 1.4 isolation behavior, including --isolate. Record whether it is the default instead of trusting conflicting notes. Check trustedDependencies and registry-credential scoping against manifests and CI, with bounded fixes only where observed behavior requires them. Assumption: Isolation defaults and scoped trust/auth behavior remain unmeasured on the installed 1.4.x."
    acceptance:
      mode: runbook_probe
      evidence: "Apply the installed Bun test help and compare ordinary and isolated test runs across the 204-file inventory. Probe dependency trust and registry auth without publishing or recording credentials. Expect equivalent test outcomes, authorized installation only, and no credential leakage."
    flows: []
    certainty: assumed
    status: done
  - id: KRT-BO005
    title: Settle the Bun stack pin separately
    type: Chore
    effort: 3
    depends_on: [KRT-BO004]
    scope:
      in: [".constitution/tech-spec/stack.yaml"]
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the preceding measurements do not establish the pins occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. In a spec-only commit, settle Bun from agreement among the actual devenv binary, lockfiles and packageManager. Record refreshed shared tool pins from the preceding evidence; do not combine this patch with code."
    acceptance:
      mode: invariant
      evidence: "Invariant: stack records equal the observed installed tools and repository pins. Checker: bun run verify with the preceding frozen-install and codegen evidence; constitution validation adds no pin discrepancy."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BO006
    title: Upgrade the aimock test double on the Bun 1.4 runtime
    type: Chore
    effort: 5
    depends_on: [KRT-BO004]
    scope:
      in:
        - typescript/host/repl/package.json
        - typescript/host/repl/test
        - bun.lock
        - ".github/dependabot.yml"
    verification:
      command: "bun run nx run host-repl:test"
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if an aimock test failure cannot be explained by the KRT-BO004 isolation review or needs a production source change occurs; do not improvise."
      - "STOP if the fix needs a cast, an any type, a suppression comment or a deleted assertion occurs; do not improvise."
    description: "Input from the closed Dependabot group pull request 130 and its hold. Move @copilotkit/aimock from 1.15.1 to the latest version on the Bun 1.4.x runtime and remove the aimock ignore entry from the Dependabot config. Measured facts: aimock 1.43.0 cannot be imported on Bun 1.3.10 (SyntaxError: Invalid regular expression: range out of order in character class at dist/files.js:521), so it needs this epic's runtime; the recorded request body type is now JournalBody, so the host-repl test helpers (hasSearchToolContinuation, hasApprovalToolContinuation, assertStructuredResponseFormat and their call sites in repl.aimock-matrix.test.ts and repl.aimock-openai.test.ts) must narrow it with aimock's exported isChatCompletionBody guard while keeping every assertion, including the json_schema response format check. A draft on Bun 1.4.2 typechecked but left seven host-repl tests failing (steering reported invalid_steering_state, approval reported invalid_stream_event, and PostgreSQL-dependent tests); explain each with the KRT-BO004 findings before changing tests, and do not weaken any assertion. host-repl is a private package, so no changeset is needed for its manifest change. Assumption: the failures are caused by isolation, runtime or service-availability differences and not by a defect in the host sources."
    acceptance:
      mode: contract_test
      evidence: "Assert the host-repl aimock suites import and run on the installed Bun 1.4.x, the JournalBody helpers reject non-chat bodies explicitly, every previously present assertion remains, the seven draft failures each have a recorded cause, and the Dependabot config no longer ignores aimock."
      supplementary: [live_probe]
      recipe: reference-host-memory-scenario
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [".constitution/tasks/epics/EPIC-BO-bun-refresh.yaml", ".constitution/evidence/KRT-BO006"]
        justification: "A4 adopts independent execution judgment for an assumed historical evidence premise. The original description and acceptance clause about seven draft failures remain verbatim. PR130 CI stopped at five JournalBody type errors; its exact recoverable snapshot and clean native Bun controls reproduce two SDK module-identity steering failures, two approval invalid_stream_event failures from the bundled OpenAI 3.0.118 parallel tool-start order, and two additional PostgreSQL setup failures when connection variables are removed. The observed maximum is six, never seven; the original draft, exact inputs and any seventh identity are unavailable. The operational acceptance is causal reproduction of every named category, exact observed counts and explicit disclosure of that limitation, plus unchanged current contract assertions. Native Bun declarations repeat the decisive provider comparison; current BO retains OpenAI 3.0.53 and passes 135 host tests in plain and isolated modes, 79 original assertions, six journal regressions, the full gate and live probe. Independent milestone review must agree with A4 before closure. No product scope, source semantics or public contract changed; future provider compatibility is routed upstream."
