      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if Weaver cannot read schema_url, PostgreSQL leaves major 17, or full verification fails occurs; do not improvise."
    description: "ADR-0074; regression evidence .constitution/evidence/KRT-BN001/. The nixpkgs refresh, registry_manifest.yaml to manifest.yaml rename, one schema_url, generator manifest reader, and regeneration of the four telemetry artifacts land in one code-only change. Keep pkgs.postgresql_17 explicit. Prove the refreshed tools through the full lane before aligning Bun; never land the manifest against Weaver 0.21.2. Assumption: The refreshed shared nixpkgs pin preserves all other generator and runtime checks. Add or update .changeset/toolchain-bo-bun-refresh.md as a patch changeset with direct coverage for the affected public packages: @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
