    scope:
      in:
        - rust/conformance-adapter/BUILD.bazel
        - rust/kernel-conformance-adapter/BUILD.bazel
        - rust/certification/BUILD.bazel
        - rust/kernel-certification/BUILD.bazel
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0071 and ADR-0073; SPK-KRT-OD007. Finish the remaining four crates so all six Rust workspace crates have build, test and lint targets. Keep certification wrappers distinct from the shared grading engine."
    acceptance:
