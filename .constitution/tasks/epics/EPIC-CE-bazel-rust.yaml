tickets:
  - id: KRT-CE001
    title: Port kernel and restore its missing unit-test target
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in: [rust/kernel/BUILD.bazel, tools/bazel/rust.bzl]
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0071 and ADR-0073; SPK-KRT-OD007. Use crate_universe over Cargo.lock for the kernel library and unit tests, with rustfmt and Clippy aspects. Restore the 27 kernel tests omitted by the standing Bazel island."
    acceptance:
      mode: contract_test
      evidence: "Assert all 27 kernel unit tests are selected by the Bazel test target and match Cargo on the same commit. A kernel source edit reruns the target, and unchanged inputs cache correctly."
    flows: []
    certainty: settled
    status: planned
  - id: KRT-CE002
    title: Port gRPC service and build-script generation
    type: Chore
    effort: 5
    depends_on: [KRT-CE001]
    scope:
      in: [rust/kernel-grpc-service/BUILD.bazel, tools/bazel/rust.bzl]
    verification:
      command: bun run interop-smoke
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0071 and ADR-0073; SPK-KRT-OD007. Run build.rs through cargo_build_script with declared proto inputs and pinned protoc. Preserve generated bindings and Cargo feature selection."
    acceptance:
      mode: contract_test
      evidence: "Assert Cargo and Bazel service outputs agree, build-script proto dependencies invalidate generation, and no action reads an in-tree target directory or host protoc."
    flows: []
    certainty: settled
    status: planned
