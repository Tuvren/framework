tickets:
  - id: KRT-CK001
    title: Port layer 4 packages and adapters
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in:
        - typescript/kernel/certification/BUILD.bazel
        - typescript/providers/certification/BUILD.bazel
        - typescript/tools/mcp-client/BUILD.bazel
        - typescript/conformance-adapter/BUILD.bazel
        - typescript/kernel/conformance-adapter/BUILD.bazel
        - typescript/providers/conformance-adapter/BUILD.bazel
        - ".changeset/toolchain-ck-bazel-ts-packages.md"
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a package needs in-tree state, undeclared inputs, or a source-only declaration build occurs; do not improvise."
    description: "ADR-0071 and ADR-0072; SPK-KRT-OD005. Declare ts_package build, typecheck, test and OXC lint targets for each scoped package. Inventory non-manifest source, fixture, smoke and typecheck inputs package by package; preserve build dist edges and check source edges. Keep every existing Nx project name as its target name. Production package layer 4: @tuvren/kernel-typescript-certification, @tuvren/providers-typescript-certification, @tuvren/mcp-client. Layering rule: compute complete topological layers from all TypeScript workspace dependencies and peerDependencies, resolving @tuvren/* names and workspace: ranges to their manifests. Prerequisite layers outside this epic must merge in earlier epics; the already-proven core, kernel/protocol and kernel/runtime targets belong to CD. CI completes remaining layers 0 to 2, CJ completes layer 3, and CK completes layers 4 to 5. Within each epic, tickets follow prerequisite layers; adapters follow their package prerequisites and certification wrappers follow their adapters. Workspace devDependencies remain declared source inputs for checks and tests, not declaration-build dist edges. Add or update .changeset/toolchain-ck-bazel-ts-packages.md as a patch changeset with direct coverage for the affected public packages: @tuvren/mcp-client. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project has equivalent build, test, typecheck and type-aware lint results on the same commit. Missing non-manifest inputs fail loudly. Removing in-tree dist and node_modules does not permit ancestor tool resolution or stale cache passes. Assert every production manifest edge resolves to an earlier epic or an earlier dependency layer inside this epic. Complete each layer before its consumers; no rollout package requires a future epic output. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: planned
