    depends_on: []
    scope:
      in:
        - tools/bazel/interop-codegen.bzl
        - spec/interop/proto
        - spec/conformance/kernel/fixtures
    verification:
      command: bun run interop-smoke
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0071 and ADR-0073; SPK-KRT-OD007. Create BUILD.bazel under spec/interop/proto as authorized by ADR-0073, with proto_library and rules_buf lint and breaking targets. Consume protobuf 33.4 with the prebuilt protoc configuration already registered."
    acceptance:
      mode: contract_test
      evidence: "Assert Buf lint and breaking outcomes match the existing interop governance gate, proto sources are declared, and changing a proto invalidates its consumers without host protoc."
    flows: []
    certainty: settled
    status: planned
  - id: KRT-CN002
    title: Check and update checked-in interop bindings
    type: Chore
    effort: 5
    depends_on: [KRT-CN001]
    scope:
      in:
        - tools/bazel/interop-codegen.bzl
        - tools/bazel/interop-codegen-runner.sh
        - spec/interop
        - typescript/kernel/grpc-client/src/lib/generated/kernel-interop
