        - reports/compatibility
        - tools/bazel/interop-codegen/BUILD.bazel
    verification:
      command: bun run codegen
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if generation needs a service lifecycle inside a hermetic action or changes required evidence semantics occurs; do not improvise."
    description: "ADR-0071 decision 9 and amended ADR-0027. Produce CDDL-derived validators, fixture/plan artifacts, compatibility schemas and API snapshots through actions plus diff tests and update targets. Separate service-exercised compatibility runs from deterministic freshness. Preserve intentionally red compatibility evidence and shared grading."
    acceptance:
      mode: contract_test
      evidence: "Assert missing declared sources, stale outputs and missing artifacts fail independently. Repeated generation is clean; intentional red evidence retains its classification and is never converted into a false pass."
    flows: []
    certainty: settled
    status: planned
