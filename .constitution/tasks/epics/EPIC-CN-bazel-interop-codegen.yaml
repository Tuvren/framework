    type: Chore
    effort: 8
    depends_on: [KRT-CN002]
    scope:
      in:
        - tools/bazel/interop-codegen.bzl
        - tools/bazel/interop-codegen-runner.sh
        - tools/scripts/conformance
        - tools/scripts/compatibility-report.ts
        - tools/scripts/api-freeze-gate.ts
        - tools/scripts/__snapshots__
        - spec/kernel
