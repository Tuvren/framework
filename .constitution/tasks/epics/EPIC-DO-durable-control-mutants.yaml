tickets:
  - id: KRT-DO001
    title: "Measure a non-atomic mutant and investigate the shared-writer race"
    type: Spike
    effort: 5
    depends_on: []
    spike: SPK-KRT-DO001
    scope:
      in:
        - ".constitution/spikes/SPK-KRT-DO001.md"
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0 for the applicable baseline and focused checks; the spike records the measured mutant results and any unresolved finding."
    stop_conditions:
      - "STOP if a required database is unavailable, the prototype cannot exercise the actual fault points, or a claim has no measurable detecting strategy; route the decision with evidence and do not invent a kill."
    description: "Build a disposable generic non-atomic RuntimeBackend mutant far enough to run the checkpoint controls on SQLite and PostgreSQL. Place it below the fault seam, forward capabilities unchanged, and capture one transaction clock when the backend provides one; preserve its absence otherwise. RuntimeBackendTx.now is optional in typescript/kernel/protocol/src/lib/kernel-types.ts. Record whether per-call commits satisfy the backend invariants and whether grouping a tree with its paths is necessary. Investigate why the PostgreSQL stale-head mutant activates in one writer while collect returns one result and one error, including barrier location and backend locking. The approach remains assumed until these runs; the checkpoint writes and SQLite validator are in typescript/kernel/runtime/src/lib/runtime-kernel-lineage.ts and typescript/kernel/backends/sqlite/src/lib/sqlite-transaction-validation.ts."
    acceptance:
      mode: contract_test
      evidence: "Record the prototype, commands, backend and process configuration, activation counts, fault receipts, recovery observations, and designated assertion outcomes for both SQLite and PostgreSQL. Record the shared-writer interleaving, both writer outcomes, the lock and barrier evidence, and a testable race-control recommendation or an explicit unresolved decision. Retain no prototype source in the spike output."
    flows: ["flow-authority-packet-driven-conformance", "flow-crash-mid-checkpoint-recovery"]
    certainty: assumed
    status: done
