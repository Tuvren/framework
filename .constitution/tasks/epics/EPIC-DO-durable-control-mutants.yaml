        - "typescript/kernel/conformance-adapter"
        - "spec/conformance/kernel/negative-controls.json"
        - "spec/conformance/kernel/profiles.json"
        - "spec/conformance/kernel/kernel-process-crash-undetected.json"
        - "tools/conformance/harness/test/durable-control-mutants.test.ts"
        - "spec/conformance/kernel/plans"
        - "tools/conformance/meta-conformance"
        - "tools/conformance/harness"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if either backend rejects the mutant before the designated fault or a claim cannot be detected; route a decision with the measured result rather than retaining an undetected claim."
      - "STOP if the test needs a ruling on recovery for a correct separately durable implementation; OD-21 remains proposed and must not be settled by the mutant."
    description: "Implement the non-atomic mutant chosen by the spike below the testkit fault seam. Designate the before_commit, after_turn_node_write_before_head, and after_head_move_before_staging_clear recovery assertions. Preserve the real SQLite and PostgreSQL substrate and use the spike measurements to choose safe write grouping. Use the existing OD-21 interim for their single-transaction baseline without ruling on separately durable ports. The designated kills depend on the rollback interim of still-proposed OD-21. DO007 re-checks the detecting assertions against the final ruling before durable-register closure."
    acceptance:
      mode: contract_test
      evidence: "On both backends each of the three claims has a designated assertion killed with mutant activation and matching fault receipt, and its unmutated baseline passes. The process-crash undetected register has no entries."
    flows: ["flow-crash-mid-checkpoint-recovery"]
    certainty: open
    status: done
    deviations:
      - files: [tools/scripts/verify-kernel.ts, tools/scripts/verify.ts]
        justification: "Both verify lanes list their durable harness test files by hand, so the new durable-control-mutants test must be added to each to run in bun run verify:kernel and bun run verify. The wave plan and its 2026-11-13 amendment authorized these two one-line additions outside the epic's owned paths."
