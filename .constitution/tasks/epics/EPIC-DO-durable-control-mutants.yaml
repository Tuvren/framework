id: DO
name: "Detect durable backend control gaps"
kind: product
capabilities: [CAP-035, CAP-037, CAP-038]
depends_on: [DF]
priority: 1
scope:
  paths:
    - "reports/compatibility"
    - "tools/conformance/harness"
    - ".constitution/spikes/SPK-KRT-DO001.md"
    - "typescript/kernel/testkit"
    - "typescript/kernel/backends/memory"
    - "typescript/kernel/conformance-adapter"
    - "spec/conformance/kernel/negative-controls.json"
    - "spec/conformance/kernel/profiles.json"
    - "spec/conformance/kernel/kernel-persistent-reopen-undetected.json"
    - "spec/conformance/kernel/kernel-process-crash-undetected.json"
    - "spec/conformance/kernel/kernel-shared-backend-undetected.json"
    - "tools/conformance/harness/test/durable-control-mutants.test.ts"
    - "reports/compatibility/evidence/certification-harness.kernel-typescript-sqlite-certification.json"
    - "reports/compatibility/evidence/certification-harness.kernel-typescript-postgres-certification.json"
    - ".changeset/durable-control-gaps.md"
    - "spec/conformance/kernel/plans"
    - "tools/conformance/meta-conformance"
  tech_spec_patchable: []
estimated_diff_lines: 15000
estimate_source: planned
tickets:
  - id: KRT-DO001
    title: "Measure a non-atomic mutant and investigate the shared-writer race"
    type: Spike
    effort: 5
    depends_on: []
    spike: SPK-KRT-DO001
    scope:
      in:
        - ".constitution/spikes/SPK-KRT-DO001.md"
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0 for the applicable baseline and focused checks; the spike records the measured mutant results and any unresolved finding."
    stop_conditions:
      - "STOP if a required database is unavailable, the prototype cannot exercise the actual fault points, or a claim has no measurable detecting strategy; route the decision with evidence and do not invent a kill."
    description: "Build a disposable generic non-atomic RuntimeBackend mutant far enough to run the checkpoint controls on SQLite and PostgreSQL. Place it below the fault seam, forward capabilities unchanged, and capture one transaction clock when the backend provides one; preserve its absence otherwise. RuntimeBackendTx.now is optional in typescript/kernel/protocol/src/lib/kernel-types.ts. Record whether per-call commits satisfy the backend invariants and whether grouping a tree with its paths is necessary. Investigate why the PostgreSQL stale-head mutant activates in one writer while collect returns one result and one error, including barrier location and backend locking. The approach remains assumed until these runs; the checkpoint writes and SQLite validator are in typescript/kernel/runtime/src/lib/runtime-kernel-lineage.ts and typescript/kernel/backends/sqlite/src/lib/sqlite-transaction-validation.ts."
    acceptance:
      mode: contract_test
      evidence: "Record the prototype, commands, backend and process configuration, activation counts, fault receipts, recovery observations, and designated assertion outcomes for both SQLite and PostgreSQL. Record the shared-writer interleaving, both writer outcomes, the lock and barrier evidence, and a testable race-control recommendation or an explicit unresolved decision. Retain no prototype source in the spike output."
    flows: ["flow-authority-packet-driven-conformance", "flow-crash-mid-checkpoint-recovery"]
    certainty: assumed
    status: planned
  - id: KRT-DO002
    title: "Detect non-atomic checkpoint commits"
    type: Feature
    effort: 3
    depends_on: [KRT-DO001]
    scope:
      in:
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "spec/conformance/kernel/negative-controls.json"
        - "spec/conformance/kernel/profiles.json"
        - "spec/conformance/kernel/kernel-process-crash-undetected.json"
        - "tools/conformance/harness/test/durable-control-mutants.test.ts"
        - "spec/conformance/kernel/plans"
        - "tools/conformance/meta-conformance"
        - "tools/conformance/harness"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if either backend rejects the mutant before the designated fault or a claim cannot be detected; route a decision with the measured result rather than retaining an undetected claim."
      - "STOP if the test needs a ruling on recovery for a correct separately durable implementation; OD-21 remains proposed and must not be settled by the mutant."
    description: "Implement the non-atomic mutant chosen by the spike below the testkit fault seam. Designate the before_commit, after_turn_node_write_before_head, and after_head_move_before_staging_clear recovery assertions. Preserve the real SQLite and PostgreSQL substrate and use the spike measurements to choose safe write grouping. Use the existing OD-21 interim for their single-transaction baseline without ruling on separately durable ports. The designated kills depend on the rollback interim of still-proposed OD-21. Re-check the non-atomic control acceptance against the final ruling before declaring closure."
    acceptance:
      mode: contract_test
      evidence: "On both backends each of the three claims has a designated assertion killed with mutant activation and matching fault receipt, and its unmutated baseline passes. The process-crash undetected register has no entries. The OD-21 ruling is closed and the three detecting assertions have been re-checked against it before durable-register closure."
    flows: ["flow-crash-mid-checkpoint-recovery"]
    certainty: assumed
    status: planned
  - id: KRT-DO003
    title: "Detect state lost across durable reopen"
    type: Feature
    effort: 3
    depends_on: [KRT-DO002]
    scope:
      in:
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "spec/conformance/kernel/negative-controls.json"
        - "spec/conformance/kernel/profiles.json"
        - "spec/conformance/kernel/kernel-persistent-reopen-undetected.json"
        - "tools/conformance/harness/test/durable-control-mutants.test.ts"
        - "spec/conformance/kernel/plans"
        - "tools/conformance/meta-conformance"
        - "tools/conformance/harness"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if a mutant cannot survive the real process boundary or no assertion detects a listed claim; route the evidence for a decision."
    description: "Add reopen mutants for committed state, checkpoint lineage, recovery head, and completed step. Apply them across a real close and fresh reopen of the same SQLite or PostgreSQL storage, using the claims in spec/conformance/kernel/kernel-persistent-reopen-undetected.json."
    acceptance:
      mode: contract_test
      evidence: "Each of the four claims is killed by a designated assertion with activation on both backends, the unmutated checks pass, and the persistent-reopen undetected register is empty."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
  - id: KRT-DO004
    title: "Detect expired-lease preemption defects"
    type: Feature
    effort: 2
    depends_on: [KRT-DO003]
    scope:
      in:
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "spec/conformance/kernel/negative-controls.json"
        - "spec/conformance/kernel/profiles.json"
        - "spec/conformance/kernel/kernel-shared-backend-undetected.json"
        - "tools/conformance/harness/test/durable-control-mutants.test.ts"
        - "spec/conformance/kernel/plans"
        - "tools/conformance/meta-conformance"
        - "tools/conformance/harness"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if the expired lease cannot be distinguished from a live lease on the measured backend clock; route the claim for a decision."
    description: "Add a shared-backend expired-lease mutant and designate the expired preemption assertions, keeping the live-lease and expired-lease cases distinct. Use the real PostgreSQL server clock and the existing worker-clock control in typescript/kernel/testkit/src/lib/kernel-mutants-clock.ts as a reference."
    acceptance:
      mode: contract_test
      evidence: "The expired-lease mutant activates and its designated kernel.syscall.clock_skew.expired assertion fails over PostgreSQL; the unmutated check passes and no existing control loses its designation."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
  - id: KRT-DO005
    title: "Detect the shared-writer race using the spike result"
    type: Feature
    effort: 3
    depends_on: [KRT-DO001]
    scope:
      in:
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "spec/conformance/kernel/negative-controls.json"
        - "spec/conformance/kernel/profiles.json"
        - "spec/conformance/kernel/kernel-shared-backend-undetected.json"
        - "tools/conformance/harness/test/durable-control-mutants.test.ts"
        - "spec/conformance/kernel/plans"
        - "tools/conformance/meta-conformance"
        - "tools/conformance/harness"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if the spike or implementation cannot make the violating race observable; route a decision and leave the profile uncertified."
    description: "Use the spike findings to build a cross-process stale-writer control over the shared PostgreSQL substrate. Preserve both barrier-entry receipts and record each process activation and collect outcome; do not claim that the barrier forces overlap inside the database lock."
    acceptance:
      mode: contract_test
      evidence: "The control demonstrably violates the shared-writer rule and a designated assertion for kernel.syscall.shared_writer.race fails; the unmutated two-process race passes and both entry receipts precede release."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
  - id: KRT-DO006
    title: "Move the memory fault control behind the testkit seam"
    type: Feature
    effort: 3
    depends_on: [KRT-DO005]
    scope:
      in:
        - "typescript/kernel/testkit"
        - "typescript/kernel/backends/memory"
        - "typescript/kernel/conformance-adapter"
        - ".changeset/durable-control-gaps.md"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if a production backend hook or a compatibility shim is required; route the design rather than adding it."
    description: "Remove the symbol-keyed fault control from publicly constructed memory backends and use the testkit transaction fault seam. The current public construction exposes the symbol in typescript/kernel/backends/memory/src/lib/memory-backend.ts; the existing testkit seam is typescript/kernel/testkit/src/lib/commit-fault-seam.ts."
    acceptance:
      mode: contract_test
      evidence: "Public memory construction has no symbol-keyed fault control; before-commit and after-commit activation and recovery checks still pass through the testkit seam."
    flows: ["flow-crash-mid-checkpoint-recovery"]
    certainty: assumed
    status: planned
  - id: KRT-DO007
    title: "Close the durable undetected registers"
    type: Chore
    effort: 2
    depends_on: [KRT-DO002, KRT-DO003, KRT-DO004, KRT-DO005, KRT-DO006]
    scope:
      in:
        - "spec/conformance/kernel/kernel-persistent-reopen-undetected.json"
        - "spec/conformance/kernel/kernel-process-crash-undetected.json"
        - "spec/conformance/kernel/kernel-shared-backend-undetected.json"
        - "reports/compatibility/evidence/certification-harness.kernel-typescript-sqlite-certification.json"
        - "reports/compatibility/evidence/certification-harness.kernel-typescript-postgres-certification.json"
        - "reports/compatibility"
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0 with the operator-provided PostgreSQL service; all three durable control inventories are complete."
    stop_conditions:
      - "STOP if any durable claim remains undetected or a control is invalid or survives; route the finding instead of weakening the bar."
      - "STOP while OD-21 is open; durable registers cannot be declared closed until the owner rules and DO002 acceptance is re-checked."
    description: "Run the full applicable durable control sets and retain the smallest evidence needed to prove each designation and each backend result. Do not clear a register entry merely because another backend or an unrelated assertion failed."
    acceptance:
      mode: contract_test
      evidence: "All three durable undetected registers are empty; SQLite and PostgreSQL each kill their applicable reopen and crash controls, and PostgreSQL kills every shared-backend control with matching activation and designated failures."
    flows: ["flow-multi-implementation-conformance-compatibility", "flow-crash-mid-checkpoint-recovery"]
    certainty: assumed
    status: planned
