scope:
  paths:
    - typescript/runtime
    - tools/scripts/lib/native-lint-routing.ts
    - tools/scripts/lib/biome-oxc-discovery.test.ts
    - tools/scripts/lib/native-lint-routing-argv.test.ts
    - tools/scripts/verify.ts
    - tools/biome-coverage/bt.json
    - ".changeset/toolchain-bt-runtime-lint.md"
  tech_spec_patchable: []
estimated_diff_lines: 14500
estimate_source: planned
tickets:
  - id: KRT-BT001
    title: Apply safe fixes and preserve types per directory
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in: [typescript/runtime, ".changeset/toolchain-bt-runtime-lint.md"]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Run safe --fix one project at a time and immediately typecheck that project. Repair the 19 measured autofix failure classes, including required undefined arguments and readonly array to Set rewrites. The spike measured 3782 diagnostics and 6585 definition lines here. Split reorder reviews within the ticket if needed, with no merged-epic budget exemption. Do not switch lint targets yet. Add or update .changeset/toolchain-bt-runtime-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/runtime. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project typechecks after each safe-fix batch, existing runtime assertions pass, and no signature or collection semantics change. Record changed files and the before/after diagnostic count per project. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BT002
    title: Migrate live suppressions and delete dead ones
    type: Chore
    effort: 3
    depends_on: [KRT-BT001]
    scope:
      in: [typescript/runtime, ".changeset/toolchain-bt-runtime-lint.md"]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a proposed native suppression lacks a fresh equivalent diagnostic, changes the original reason, removes a needed Biome directive before native admission, or introduces a Biome directive; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Treat the measured 144-directive inventory as an identification baseline, not a quota. Re-run live retained-Biome and Oxlint diagnostics across the owned paths. For every baseline identity and any drift discovered at execution, record its original reason, equivalent native rule, retained-checker disposition, and native-admission disposition. While Biome owns a path, preserve each needed original Biome directive and its reason. Remove a directive before admission only after a behavior-preserving code fix proves that the retained Biome diagnostic no longer fires. Do not add Biome directives. Record a native counterpart only when the equivalent native rule actually fires and the original reason remains valid. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Do not create suppressions to reproduce the historical 82-live/62-dead classification. Provide the per-directive disposition ledger for CB aggregation. Add or update .changeset/toolchain-bt-runtime-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/runtime. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert every baseline directive identity in the owned paths, plus any measured drift, has a ledger entry backed by live retained-Biome and Oxlint diagnostics. Each entry records the original reason, retained-checker disposition, and native-admission disposition. While Biome owns the path, prove each needed original directive remains and the full lint gate passes. Prove any early deletion follows a behavior-preserving code fix and a fresh retained-Biome run where the diagnostic no longer fires. Prove each planned native counterpart matches an actually firing equivalent rule and preserves the original reason. Add no Biome directive, manufacture no suppression to meet a historical count, and emit the ledger CB will aggregate. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BT003
    title: Reorder definitions without initialization regressions
    type: Chore
    effort: 8
    depends_on: [KRT-BT002]
    scope:
      in: [typescript/runtime, ".changeset/toolchain-bt-runtime-lint.md"]
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a runtime or conformance regression follows reordering; return the rule pair to the owner without overrides occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Convert func-style declarations and reorder no-use-before-define definitions in bounded reviewable module batches. Preserve exports, initialization order and observable execution. The merged kernel pilot is the prerequisite; apply its proven ordering method. Add or update .changeset/toolchain-bt-runtime-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/runtime. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert module initialization, cyclic imports and conformance outcomes match the pre-reorder baseline. Run scoped tests, repository typecheck and bun run conformance on the same implementation. Preserve error and event ordering, not just lint success. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-BT004
    title: Clear remaining rules and switch clean project targets
    type: Chore
    effort: 8
    depends_on: [KRT-BT003]
    scope:
      in:
        - typescript/runtime
        - tools/scripts/lib/native-lint-routing.ts
        - tools/scripts/lib/biome-oxc-discovery.test.ts
        - tools/scripts/lib/native-lint-routing-argv.test.ts
        - tools/scripts/verify.ts
        - tools/biome-coverage/bt.json
        - ".changeset/toolchain-bt-runtime-lint.md"
    verification:
      command: bun run verify
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a project isn't clean, type-aware lint skips a rule, or an admitted path loses a needed Biome directive before the same commit switches its lint target and coverage ownership; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Clear remaining syntactic diagnostics, then run type-aware lint with the complete effective shipped preset unchanged. For every migrated Nx project, use the active default nx:run-commands target with the workspace root as cwd and the exact project-root command pair, in order: bunx --bun oxlint --type-aware PROJECT_ROOT, then bun tools/scripts/json-check.ts PROJECT_ROOT. Set the one newly admitted BT target's top-level options.forwardAllArgs to the literal false so ordinary caller arguments cannot widen or alter either child command. This guarantee covers ordinary caller arguments only; an explicit executor override such as --forwardAllArgs=true is outside it. Extend the shared native-lint classifier to accept omitted forwarding configuration for legacy targets, accept only literal false when the top-level forwarding option is present, and reject true, malformed values, every nested forwarding key, configured args, __unparsed__, unknown options, interpolation, and extra flags. Command objects remain command-only. Preserve checker failure propagation and every other established routing rejection. Use bun tools/scripts/json-check.ts --json-only PROJECT_ROOT only for a JSON-only project whose fresh Git inventory, checked outside the cached Nx result, proves no code files. Reject alternate executors or configurations, partial, glob, or parent operands, extra options, forwarded, unknown, or no-op flags, empty selections, and duplicate checker ownership. Derive code coverage from Oxlint's actual --debug=files selection and JSON coverage from the native source-integrity selection; Oxfmt ignores affect formatting only. Where a project lint target declares inputs and thereby replaces target defaults, include the real native checker helper inputs explicitly. Use the established native helpers without adding dependencies or repository-owned lint policy. Ensure type-aware lint can read prerequisite declarations while ordinary typecheck remains source-only. Consume this epic's suppression-disposition ledger and rerun retained-Biome and Oxlint diagnostics on the admission commit. For each admitted path, remove its legacy Biome directives in the same commit that switches its lint target and coverage ownership. The ledger permits earlier removal while Biome owns the path only after a behavior-preserving code fix and fresh retained-Biome proof that the diagnostic is gone. At native admission, remove a legacy Biome directive with no native counterpart when fresh native proof shows that no equivalent diagnostic fires, and record that disposition. If the equivalent native rule fires, keep only a justified measured native counterpart with the original reason or fix the actual native issue. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Remove each admitted migrated path from tools/biome-coverage/bt.json, leave every other list unchanged, and keep Biome responsible for every path not yet natively admitted. Add no lint policy, configuration override, or dependency. Add or update .changeset/toolchain-bt-runtime-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/runtime. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert the type-aware backend runs every installed, enabled, as-shipped type-aware rule with complete equality of rules, options, severities, environment, globals, plugins, settings, and categories and with no local override or project-resolution error. Treat 55 type-aware rules in the measured 474-rule installed preset, alongside 419 non-type-aware rules, as pinned historical evidence rather than a future quota. Assert the admitted BT target has top-level options.forwardAllArgs: false, the exact canonical command shape, and workspace cwd; actual --debug=files and native JSON selections are complete and nonempty, source-integrity coverage remains independent of formatter ignores, fresh JSON-only code absence is checked outside cached results, and explicit project inputs name the checker helpers when they override defaults. Pin classifier regressions for the selected default configuration and both omitted legacy command forms. Against the real pinned Nx executor, prove literal false keeps child argv unchanged for ordinary --args, arguments after --, and an unknown scalar option; use omission as the negative child-argv control. Reject top-level true or malformed forwarding values and all nested forwarding keys, including nested true, while preserving the rejection of configured args, __unparsed__, unknown options, interpolation, and extra flags. Prove Oxlint and JSON checker failures still propagate unchanged. Do not claim protection against an explicit --forwardAllArgs=true executor override. For each admitted path, reconcile the ledger against fresh diagnostics and record whether the legacy directive has a measured native counterpart. When no equivalent native diagnostic fires, record the no-counterpart disposition. When one fires, preserve the original reason for the justified native counterpart or prove the actual native issue is fixed. Prove the same commit removes legacy Biome directives and switches lint coverage. No admitted path contains a biome-ignore comment after the commit. Paths outside this admission retain needed original directives and Biome coverage. Scoped tests and the full lint gate pass; admitted paths are absent from tools/biome-coverage/bt.json, while every remaining entry retains Biome lint coverage. Assert no lint policy or configuration override was introduced and the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
decisions:
  - id: OD-11
    question: Should KRT-BT004 convert internal runtime interface methods to function-valued properties when the shipped native preset requires it?
    blocks: [KRT-BT004]
    options:
      - name: Convert internal methods
        pros:
          - Clears the shipped method-signature-style rule without an override.
          - Produces the canonical strictFunctionTypes surface selected by the approved lint preset.
        cons:
          - Changes internal TypeScript assignability and requires full source and declaration verification.
      - name: Preserve method signatures and stop admission
        pros:
          - Preserves the current bivariant TypeScript method surface.
        cons:
          - Leaves the runtime project noncompliant with the unchanged shipped preset and blocks KRT-BT004.
    recommendation: Convert internal methods
    closure: ruling
    ruler: wave lead
    status: closed
    asked:
      date: 2026-10-18
      in: EPIC-BT
    ruling:
      ref: "EPIC-BT plan amendment A26, 2026-10-18"
      date: 2026-10-18
      summary: TypeChecker reachability found none of the 63 converted method signatures reachable from supported runtime, core, or SDK exports; ADR-0057 excludes the internal runtime shape from stable guarantees. Apply the required internal function-property convention with direct patch changeset coverage and reassess only if later cleanup changes supported exports or behavior.
      chosen: Convert internal methods
