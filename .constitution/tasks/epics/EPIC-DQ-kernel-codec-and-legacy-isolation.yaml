    - "50 of the 69 kernel.codec claims and kernel.scope-isolation.enumeration_is_scope_confined have no designated detector (OD-16 reasons in kernel-memory-undetected.json); KRT-DR004 owns the own-scope content and enumeration detectors, no epic plans the cross-scope enumeration detector or schema, turn-node and decode-rejection codec mutants."
