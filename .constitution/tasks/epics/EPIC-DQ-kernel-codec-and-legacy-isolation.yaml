        - "tools/conformance/adapter-protocol"
        - "tools/conformance/plan-compiler"
        - "tools/conformance/meta-conformance"
        - "tools/scripts/verify-kernel.ts"
        - "tools/scripts/verify.ts"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if the two scopes cannot share a substrate without a production hook or if either TypeScript control cannot be detected; route a decision."
      - "STOP if keying server-clock verification by process epoch changes the verdict of any promoted check; report the check instead of relaxing the rule."
    description: "Add syscall or catalogued codec assertions that kill accept-noncanonical-cbor and resolve-object-across-scopes without either legacy composite. Add kernel.scope-isolation and the cross-scope claims to the memory profile. Implement the named-instance routing in the plan companion so two scopes share one isolated substrate in a single process; the current runner tracks one instance per process in tools/conformance/harness/multi-trace.ts. Give Rust a test-only shared-substrate construction seam if needed. Remove every legacy assertion designation from the profile controls after replacing it with a valid canonical designation. The legacy-only designations are in spec/conformance/kernel/negative-controls.json. While reworking per-process instance tracking, key the harness server-clock verification (guidelines 5.10 rule 11) by process epoch as well as by selection, so a timed thread creation after a restart needs its own bracketed observation. Fix the pre-existing tsc errors at tools/conformance/harness/test/durable-control-mutants.test.ts lines 497 and 503. Register new tools/ tests in the matching verify lane (guidelines 5.10 rule 12)."
    acceptance:
      mode: contract_test
      evidence: "Each control has a profile-scoped designated assertion and activation; TypeScript produces the expected kill and Rust passes the positive canonical checks without loading a legacy plan. Two named instances use different scopes on the same isolated substrate; unknown and duplicate names fail. The memory inventory rejects an omitted scope capability or cross-scope claim. Own-scope checks and the cross-scope miss are independently observable, and no control designation references a legacy assertion. A server-clock selection whose post-restart timed thread creation has no bracketed observation in the new epoch fails as unverified, while kernel-clock-skew-syscall.json keeps its verdict. tsc --project tools/tsconfig.json reports no error in durable-control-mutants.test.ts."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: done
    replaces:
      - "EPIC-DP#follow-up:6d0ed19ed986"
      - "EPIC-DP#follow-up:4410843dc7cf"
