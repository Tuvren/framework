    description: "bun run check runs nx affected lint only, and no Nx project lints tools/conformance, so EPIC-DP's 19 Biome findings in harness and certification code passed every milestone check and failed only bun run verify. Add the root workspace lint that bun run lint runs to the inner loop, so findings under tools/ fail bun run check. Land this before the other DQ tickets, which change tools/ heavily, so their milestone checks include it."
