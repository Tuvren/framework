      expected: "Exit 0 with the operator-provided PostgreSQL service; canonical TypeScript and Rust inventories and the retained legacy selections validate."
    stop_conditions:
      - "STOP if a passing result requires suppressing a required claim or treating an absent check as a pass."
    description: "Check the complete, unfiltered TypeScript and Rust positive memory-profile runs against the canonical packet and retained codec obligations. Refresh the compatibility evidence affected by the packet selection; do not delete the legacy packet while any adapter uses it."
    acceptance:
      mode: contract_test
      evidence: "TypeScript and Rust report no legacy packet, plan, designation, or input digest, while the three unmigrated adapters still select the legacy packet. Missing canonical assertions and accidental filtered certification fail. The aggregate verifierAuthority excludes all legacy packet, catalog, plan, and legacy-only fixture paths for adapters that do not select the packet and includes them for adapters that do; global file validation does not add unselected files to a run digest. Assert that mutating a legacy-only input changes only selecting adapters' aggregate digest. Rust provides a positive run, without requiring a Rust control kill before DS."
    flows: ["flow-authority-packet-driven-conformance", "flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
decisions:
  - id: OD-27
    question: "Moving the six legacy plans and two fixture-set sources out of the canonical kernel authority packet removes referenced conformance plans and declared authoritative sources, which guidelines §2.1 classes as a major packet change. While the packet is still 0.x, does a major change bump it to 1.0.0 or bump the minor version?"
    blocks: [KRT-DQ003]
    options:
      - name: Bump to 1.0.0 as guidelines §2.1 states
        pros:
          - "Follows the binding Stage 3 record literally; no silent deviation."
          - "Consumers that select by packet see an unambiguous breaking signal."
        cons:
          - "Declares the first stable version of a packet that EPIC-DJ and the remaining certification epics will keep changing."
      - name: Bump the minor version while the packet is 0.x
        pros:
          - "Matches semver's 0.x convention and the packet's history (0.10.0 to 0.16.0 were all minor bumps)."
          - "Leaves 1.0.0 for when the kernel catalog stabilises."
        cons:
          - "Contradicts guidelines §2.1 as written until Stage 3 adds a 0.x clause."
    recommendation: Bump to 1.0.0 as guidelines §2.1 states
    closure: ruling
    ruler: Owner
    status: proposed
    asked:
      date: 2026-11-18
      in: EPIC-DQ
    proposed_by: "EPIC-DQ @ bfb3c18"
    interim:
      assumption: "The canonical kernel packet tuvren.kernel.protocol goes from 0.16.0 to 1.0.0 in KRT-DQ003, and the canonical kernel operation catalog, which lost the 21 composites, goes from 0.4.0 to 1.0.0 by the same reading; the temporary legacy packet and its catalog keep their own versions."
      applied_by:
        - spec/kernel/authority-packet.json
        - spec/conformance/kernel/operations.json
        - KRT-DQ003
