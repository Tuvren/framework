    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if the packet changes expected observations, hides a required canonical claim, or requires a Go, Python, or Dart kernel migration to publish the testkit; report the evidence instead."
    description: "Implement the temporary legacy-packet contract in conformance-certification.md. Move the six legacy plans to tuvren.kernel.legacy, preserving IDs, assertions, fixtures, and observations, and move all 21 composite operations from the canonical catalog to spec/conformance/kernel/legacy-operations.json owned by the legacy packet. Keep lossless observation encoding and schema validation for Go, Python, and Dart. Delete TypeScript and Rust composite handlers in this ticket. Declare transitionalAdapters as the exact adapter-manifest paths for the three remaining lanes; portability-gate.ts requires exactly that declared set to reference a transitional packet, rejecting omitted and unexpected references. Ordinary packets keep boundary-wide coverage. Revise EXPECTED_PACKET_TOPOLOGY, the AL inventory JSON and Markdown companion, authority schemas and guardrails together. Fix generate-kernel-plans.ts's hard-coded packetId. Load and digest the selected legacy catalog and plans without inventing profiles or a control manifest for this report-only packet. Remove Go, Python, and Dart's tuvren.kernel.protocol certified entries with the stated reason that the temporary packet is unprofiled; keep their positive inventory and matrix implementations results until their canonical certification tickets restore kernel.memory. Add the changeset for removed public handlers if their package surface changes. The aggregate verifierAuthority excludes all legacy packet, catalog, plan, and legacy-only fixture paths for adapters that do not select the packet and includes them for adapters that do; global file validation does not add unselected files to a run digest. The legacy packet declares no certificationProfiles and therefore no undetectedRegisters; the packet schema requires the two together. Go, Python, and Dart produce no negative-control reports, so removing their certified entries leaves only their positive inventory and matrix implementations results. Register new tools/ tests in the matching verify lane (guidelines 5.10 rule 12)."
    acceptance:
      mode: contract_test
      evidence: "Go, Python, and Dart resolve the same legacy checks and observations, with refreshed packet-bound provenance, without kernel implementation migration. TypeScript and Rust load none of the legacy packet or its six plans in normal, certificate, control, compatibility, or generated-authority inputs. A claimed-profile certificate cannot rely on the legacy packet, and no language or adapter ID selects a plan. The 21 composites exist only in the legacy-owned catalog. Missing or extra transitional adapter references and stale topology inventories fail. All three legacy lanes retain lossless observation and schema rejection tests. TypeScript and Rust handlers are deleted. The aggregate verifierAuthority excludes all legacy packet, catalog, plan, and legacy-only fixture paths for adapters that do not select the packet and includes them for adapters that do; global file validation does not add unselected files to a run digest."
    flows: ["flow-authority-packet-driven-conformance", "flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: done
    deviations:
      - files:
          - tools/scripts/portability-gate.test.ts
          - tools/biome-coverage/bv.json
        justification: "The transitionalAdapters exact-set rule needed its own test beside tools/scripts/portability-gate.ts, and the workspace Biome gate requires every linted file to be listed in a tools/biome-coverage list. Neither path is in the epic's scope.paths; the wave lead ruled both in-envelope on 2026-11-18 because the wave has one lane, no other active epic owns them, and both only accompany the owned portability gate."
