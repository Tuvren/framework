  - id: KRT-DQ001
    title: "Catalogue kernel.codec and migrate the 68 codec assertions"
    type: Feature
    effort: 8
    depends_on: [KRT-DQ005]
    scope:
      in:
        - "spec/kernel/authority-packet.json"
        - "spec/conformance/kernel"
        - "typescript/kernel/protocol"
        - "typescript/kernel/conformance-adapter"
        - "rust/kernel"
        - "rust/kernel-conformance-adapter"
        - "tools/conformance/plan-compiler"
        - "tools/conformance/certification"
        - "tools/conformance/meta-conformance"
        - "reports/compatibility"
        - "tools/scripts/verify-kernel.ts"
        - "tools/scripts/verify.ts"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if a codec operation needs an adapter-computed verdict or an assertion has no authority-backed mapping; route the gap."
    description: "Apply OD-16 and the catalog companion: expose native encode, decode, opaque hash, and identity hash actions under kernel.codec and bind them in TypeScript and Rust. Add kernel.codec and its claims to the memory profile. Extend the memory claim inventory to include codec-only plans; tools/conformance/certification/profile.ts currently restricts its strict inventory to kernel.syscall plans. Migrate the 54 deterministic-hash and 14 canonical-rejection assertions from spec/conformance/kernel/plans/kernel-protocol-core.json and spec/conformance/kernel/plans/kernel-protocol-extended.json with a stable obligation map and committed expectations. Since EPIC-DP the memory register is packet-referenced and schema-validated, and every certificate lists it: a new codec claim with no designated detector needs a reason in spec/conformance/kernel/kernel-memory-undetected.json, and the register change alters verifier-authority digests, so refresh reports/compatibility in the same change. Register new tools/ tests in the matching verify lane (guidelines 5.10 rule 12)."
    acceptance:
      mode: contract_test
      evidence: "The map accounts for all 68 existing assertions, valid and noncanonical inputs are observed through codec operations, TypeScript and Rust run the canonical checks, and the accept-noncanonical-cbor mutant has a designated detecting assertion. The memory inventory fails if a codec claim or required kernel.codec capability is omitted."
    flows: ["flow-authority-packet-driven-conformance", "flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: done
  - id: KRT-DQ002
    title: "Move both legacy-only controls to observable plan assertions"
    type: Feature
    effort: 5
    depends_on: [KRT-DQ001]
    scope:
      in:
        - "spec/kernel/authority-packet.json"
        - "spec/conformance/kernel"
        - "typescript/kernel/conformance-adapter"
        - "typescript/kernel/testkit"
        - "rust/kernel"
