id: CA
name: Small TypeScript package lint ratchet
kind: tooling
capabilities: []
depends_on: [BQ, CS, BT]
scope:
  paths:
    - typescript/core
    - typescript/sdk
    - typescript/streaming
    - typescript/tools
    - typescript/testkit
    - typescript/telemetry
    - typescript/certification
    - typescript/certification-batteries-included
    - tools/run-nx.mjs
    - tools/biome-coverage/ca.json
    - ".changeset/toolchain-ca-small-package-lint.md"
  tech_spec_patchable: []
estimated_diff_lines: 14000
estimate_source: planned
tickets:
  - id: KRT-CA001
    title: Apply safe fixes and preserve types per directory
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in:
        - typescript/core
        - typescript/sdk
        - typescript/streaming
        - typescript/tools
        - typescript/testkit
        - typescript/telemetry
        - typescript/certification
        - typescript/certification-batteries-included
        - tools/run-nx.mjs
        - ".changeset/toolchain-ca-small-package-lint.md"
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Run safe --fix one project at a time and immediately typecheck that project. Repair the 19 measured autofix failure classes, including required undefined arguments and readonly array to Set rewrites. Complete core, SDK, streaming, tools, testkit, telemetry and certification without changing generated files. Do not switch lint targets yet. Add or update .changeset/toolchain-ca-small-package-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/core, @tuvren/mcp-client, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert each scoped project typechecks after each safe-fix batch, existing runtime assertions pass, and no signature or collection semantics change. Record changed files and the before/after diagnostic count per project. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-CA002
    title: Migrate live suppressions and delete dead ones
    type: Chore
    effort: 3
    depends_on: [KRT-CA001]
    scope:
      in:
        - typescript/core
        - typescript/sdk
        - typescript/streaming
        - typescript/tools
        - typescript/testkit
        - typescript/telemetry
        - typescript/certification
        - typescript/certification-batteries-included
        - tools/run-nx.mjs
        - ".changeset/toolchain-ca-small-package-lint.md"
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a proposed native suppression lacks a fresh equivalent diagnostic, changes the original reason, removes a needed Biome directive before native admission, or introduces a Biome directive; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Treat the measured 144-directive inventory as an identification baseline, not a quota. Re-run live retained-Biome and Oxlint diagnostics across the owned paths. For every baseline identity and any drift discovered at execution, record its original reason, equivalent native rule, retained-checker disposition, and native-admission disposition. While Biome owns a path, preserve each needed original Biome directive and its reason. Remove a directive before admission only after a behavior-preserving code fix proves that the retained Biome diagnostic no longer fires. Do not add Biome directives. Record a native counterpart only when the equivalent native rule actually fires and the original reason remains valid. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Do not create suppressions to reproduce the historical 82-live/62-dead classification. Provide the per-directive disposition ledger for CB aggregation. Keep tools/run-nx.mjs under this retained-checker rule through KRT-CA004 and until CB's whole-tools admission. Add or update .changeset/toolchain-ca-small-package-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/core, @tuvren/mcp-client, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert every baseline directive identity in the owned paths, plus any measured drift, has a ledger entry backed by live retained-Biome and Oxlint diagnostics. Each entry records the original reason, retained-checker disposition, and native-admission disposition. While Biome owns the path, prove each needed original directive remains and the full lint gate passes. Prove any early deletion follows a behavior-preserving code fix and a fresh retained-Biome run where the diagnostic no longer fires. Prove each planned native counterpart matches an actually firing equivalent rule and preserves the original reason. Add no Biome directive, manufacture no suppression to meet a historical count, and emit the ledger CB will aggregate. Prove tools/run-nx.mjs retains every needed original Biome directive and its coverage entry until CB's whole-tools admission. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-CA003
    title: Reorder definitions without initialization regressions
    type: Chore
    effort: 8
    depends_on: [KRT-CA002]
    scope:
      in:
        - typescript/core
        - typescript/sdk
        - typescript/streaming
        - typescript/tools
        - typescript/testkit
        - typescript/telemetry
        - typescript/certification
        - typescript/certification-batteries-included
        - tools/run-nx.mjs
        - ".changeset/toolchain-ca-small-package-lint.md"
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a runtime or conformance regression follows reordering; return the rule pair to the owner without overrides occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Convert func-style declarations and reorder no-use-before-define definitions in bounded reviewable module batches. Preserve exports, initialization order and observable execution. The merged kernel pilot is the prerequisite; apply its proven ordering method. Add or update .changeset/toolchain-ca-small-package-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/core, @tuvren/mcp-client, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert module initialization, cyclic imports and conformance outcomes match the pre-reorder baseline. Run scoped tests, repository typecheck and bun run conformance on the same implementation. Preserve error and event ordering, not just lint success. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
  - id: KRT-CA004
    title: Clear remaining rules and switch clean project targets
    type: Chore
    effort: 8
    depends_on: [KRT-CA003]
    scope:
      in:
        - typescript/core
        - typescript/sdk
        - typescript/streaming
        - typescript/tools
        - typescript/testkit
        - typescript/telemetry
        - typescript/certification
        - typescript/certification-batteries-included
        - tools/run-nx.mjs
        - tools/biome-coverage/ca.json
        - ".changeset/toolchain-ca-small-package-lint.md"
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a project isn't clean, type-aware lint skips a rule, an admitted package path loses a needed Biome directive before the same commit switches its lint target and coverage ownership, or tools/run-nx.mjs loses retained coverage before CB; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Clear remaining syntactic diagnostics, then run type-aware lint with the complete effective shipped preset unchanged. For every migrated Nx project, use the active default nx:run-commands target with the workspace root as cwd and the exact project-root command pair, in order: bunx --bun oxlint --type-aware PROJECT_ROOT, then bun tools/scripts/json-check.ts PROJECT_ROOT. Set all 12 newly admitted CA targets' top-level options.forwardAllArgs to the literal false so ordinary caller arguments cannot widen or alter their child commands. This guarantee covers ordinary caller arguments only, not an explicit executor override such as --forwardAllArgs=true. Source cleanup may proceed independently, but final admission waits for review-clean BT to merge and for the CA branch to rebase onto its shared classifier fix. Use bun tools/scripts/json-check.ts --json-only PROJECT_ROOT only for a JSON-only project whose fresh Git inventory, checked outside the cached Nx result, proves no code files. Reject alternate executors or configurations, partial, glob, or parent operands, extra options, forwarded, unknown, or no-op flags, empty selections, and duplicate checker ownership. Derive code coverage from Oxlint's actual --debug=files selection and JSON coverage from the native source-integrity selection; Oxfmt ignores affect formatting only. Where a project lint target declares inputs and thereby replaces target defaults, include the real native checker helper inputs explicitly. Use the established native helpers without adding dependencies or repository-owned lint policy. Ensure type-aware lint can read prerequisite declarations while ordinary typecheck remains source-only. Consume this epic's suppression-disposition ledger and rerun retained-Biome and Oxlint diagnostics on the admission commit. For each admitted package path, remove its legacy Biome directives in the same commit that switches its lint target and coverage ownership. The ledger permits earlier removal while Biome owns the path only after a behavior-preserving code fix and fresh retained-Biome proof that the diagnostic is gone. At native admission, remove a legacy Biome directive with no native counterpart when fresh native proof shows that no equivalent diagnostic fires, and record that disposition. If the equivalent native rule fires, keep only a justified measured native counterpart with the original reason or fix the actual native issue. Do not replace an API's bitmask operation with a handwritten flag algorithm to avoid lint. Remove each admitted package path from tools/biome-coverage/ca.json, leave every other list unchanged, and keep Biome responsible for every path not yet natively admitted. Keep tools/run-nx.mjs, its needed original Biome directives, and its ca.json coverage entry through this ticket for CB's whole-tools admission. Migrate the real package targets in this ticket. Add no lint policy or configuration override. Add or update .changeset/toolchain-ca-small-package-lint.md as a patch changeset with direct coverage for the affected public packages: @tuvren/core, @tuvren/mcp-client, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert the type-aware backend runs every installed, enabled, as-shipped type-aware rule with complete equality of rules, options, severities, environment, globals, plugins, settings, and categories and with no local override or project-resolution error. Treat 55 type-aware rules in the measured 474-rule installed preset, alongside 419 non-type-aware rules, as pinned historical evidence rather than a future quota. Assert all 12 admitted CA targets have top-level options.forwardAllArgs: false, the exact canonical command shape, and workspace cwd; actual --debug=files and native JSON selections are complete and nonempty, source-integrity coverage remains independent of formatter ignores, fresh JSON-only code absence is checked outside cached results, and explicit project inputs name the checker helpers when they override defaults. Prove final admission ran after review-clean BT merged and the branch rebased onto its shared classifier fix. For each admitted package path, reconcile the ledger against fresh diagnostics and record whether the legacy directive has a measured native counterpart. When no equivalent native diagnostic fires, record the no-counterpart disposition. When one fires, preserve the original reason for the justified native counterpart or prove the actual native issue is fixed. Prove the same commit removes legacy Biome directives and switches lint coverage. No admitted package path contains a biome-ignore comment after the commit. Scoped tests and the full lint gate pass; admitted package paths are absent from tools/biome-coverage/ca.json, while every remaining entry retains Biome lint coverage. Prove tools/run-nx.mjs keeps each needed original Biome directive and its ca.json coverage entry until CB's whole-tools admission. Assert no lint policy or configuration override was introduced and the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
