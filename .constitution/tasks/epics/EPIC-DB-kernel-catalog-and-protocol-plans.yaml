      expected: "Exit 0; the TypeScript kernel returns changedPaths in ascending UTF-8 byte order without the adapter sorting."
    stop_conditions:
      - "STOP if canonical ordering changes a committed hash or vector; do not improvise."
    description: "ADR-0080. Add the ordering sentence to docs/KrakenKernelSpecification.md and the kernel authority packet, make the TypeScript kernel return changedPaths without duplicates in ascending unsigned UTF-8 byte order, and remove the sort in typescript/kernel/conformance-adapter. Add a changeset for the affected public packages under ADR-0069."
    acceptance:
      mode: contract_test
      evidence: "Assert tree.diff output order for paths that differ in UTF-8 versus UTF-16 ordering, assert the adapter no longer sorts, and assert the changeset covers @tuvren/kernel-runtime and any other affected public package."
    flows: [flow-authority-packet-driven-conformance]
    certainty: settled
    deviations:
      - files:
