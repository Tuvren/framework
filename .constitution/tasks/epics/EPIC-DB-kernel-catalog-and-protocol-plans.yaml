tickets:
  - id: KRT-DB001
    title: Author the kernel operation catalog and identity recipes
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - spec/conformance/kernel/operations.json
        - spec/conformance/kernel/identity-recipes.json
        - spec/kernel/authority-packet.json
    verification:
      command: bun run check
      expected: "Exit 0; the kernel catalog and identity recipes validate and the packet references both."
    stop_conditions:
      - "STOP if a kernel syscall in docs/KrakenKernelSpecification.md has no public binding in the authority packet; report the gap as a specification finding; do not improvise."
    description: "ADR-0075 decision 3 and ADR-0078 decision 2. Write spec/conformance/kernel/operations.json with one syscall entry per kernel specification operation (store, schema, tree, node, branch, thread, staging, run, run-liveness, maintenance), control entries for setClock and armFault, canonical error codes taken from the current kernel plans, closed observation schemas, and the legacy composite operations marked deprecated. Write spec/conformance/kernel/identity-recipes.json for opaque objects, TurnNodes, TurnTrees, and schemas, pinned to the committed vectors. Reference both from spec/kernel/authority-packet.json."
    acceptance:
      mode: contract_test
      evidence: "Assert every non-deprecated kernel operation in the catalog has a binding reference that resolves in the authority packet, every identity recipe reproduces the committed vectors' digests, and every legacy composite operation used by a current plan is listed as deprecated."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    deviations:
      - files:
          - tools/schemas/authority-packet.schema.json
        justification: "The packet schema is closed, so the identityRecipes reference could not be added to spec/kernel/authority-packet.json without declaring it there."
      - files:
          - typescript/kernel/protocol/test/kernel-certification-authority.test.ts
          - typescript/kernel/protocol/project.json
        justification: "The catalog and recipe contract test is the ticket's acceptance evidence; it lives in the protocol package that owns the reference encoder, and its Nx inputs cover every authority file it reads."
      - files:
          - tools/scripts/conformance/certification-schemas.ts
          - tools/scripts/conformance/certification-schemas.test.ts
        justification: "Review found the strict observation dialect accepted patternProperties; non-deprecated catalog entries now reject it."
      - files:
          - spec/conformance/kernel/fixtures/kernel-protocol-turn-tree.json
          - spec/conformance/kernel/fixtures/kernel-protocol-turn-tree.bytes.json
          - tools/conformance/harness/test/kernel-integrity.test.ts
        justification: "Review found the TurnTree recipe had no committed vector; one was computed with the TypeScript reference encoder and pinned in both the recipe test and the runner verifier test."
    status: done
  - id: KRT-DB002
    title: Encode observations losslessly and verify kernel content integrity in the runner
    type: Feature
    effort: 8
    depends_on: [KRT-DB001]
    scope:
      in:
        - tools/conformance/harness
        - tools/conformance/meta-conformance
        - spec/conformance/kernel/fixtures
        - spec/kernel
        - typescript/kernel/conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; the new fixtures use $bytes, legacy lanes are unchanged, the runner rejects observations violating the encoding, and digest, canonicalCbor, identity, and referenceWalk assertions pass on the committed vectors and fail on byte flips."
    stop_conditions:
      - "STOP if the runner's encoder disagrees with a committed vector; record it as a verification or specification finding and do not regenerate the vector; do not improvise."
    description: "ADR-0078. Validate every observation against tools/schemas/conformance-observation-encoding.schema.json and the operation's observation schema before assertions. Add $bytes copies of the kernel fixtures for the new syscall plans; legacy fixtures stay unchanged for adapters that have not migrated. Add the digest, canonicalCbor, identity, and referenceWalk assertion kinds using a verifier encoder pinned to committed vectors and identity recipes, independent of the production encoder import path. Record shapes are the catalog's closed observation schemas; no CDDL-to-JSON-Schema generator exists, so ADR-0078 decision 5 is reported as physical drift for a spec-patch milestone rather than built here. Add the TypeScript adapter encoding helpers."
    acceptance:
      mode: contract_test
      evidence: "Assert each integrity assertion passes on every committed vector and fails on a flipped byte, a reordered map key, a dropped optional field, and an altered reference; assert an observation with a duplicate key, a fractional integer field, or an undeclared field is an adapter_protocol failure."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - tools/conformance/plan-compiler/certification-rules.ts
          - tools/conformance/plan-compiler/index.ts
          - tools/conformance/plan-compiler/certification-rules.test.ts
        justification: "The compiler's observation-path, no-echo, decisive-assertion, and new integrity-observation rules must cover the four integrity assertion kinds."
      - files:
          - tools/schemas/conformance-plan.schema.json
        justification: "The plan schema declares the digest, canonicalCbor, identity, and referenceWalk kinds the pinned contract lists, plus their reference fields."
      - files:
          - tools/scripts/authority-guardrails/authority-guardrails.ts
          - tools/scripts/verify.ts
        justification: "The decisive-assertion guardrail and the durable tooling test inventory must know the new kinds and contract suites."
    status: done
  - id: KRT-DB003
    title: Make tree.diff changedPaths canonical in authority and the TypeScript kernel
    type: Feature
    effort: 3
    depends_on: [KRT-DB001]
    scope:
      in:
        - docs/KrakenKernelSpecification.md
