          - .constitution/reports/epic-ad-normative-docs-claim-inventory.json
          - .constitution/reports/epic-ad-typescript-freeze-gate-report.md
          - .constitution/reports/epic-af-conformance-gap-plan.json
          - .constitution/reports/epic-af-conformance-gap-plan.md
        justification: "Generated docs-to-authority freeze and gap-plan reports, regenerated by bun run docs:authority-freeze and bun run docs:af-gap-plan after the specification edit; the check gate fails while they are stale."
    status: done
  - id: KRT-DB004
    title: Rewrite the protocol-core and protocol-extended plans as syscall traces
    type: Feature
    effort: 8
    depends_on: [KRT-DB002, KRT-DB003]
    scope:
      in:
        - spec/conformance/kernel/plans
        - spec/conformance/kernel/negative-controls.json
        - typescript/kernel/conformance-adapter
        - typescript/kernel/testkit
        - typescript/kernel/runtime
        - ".changeset/certification-db-kernel-protocol.md"
    verification:
      command: bun run verify:kernel
      expected: "Exit 0; the rewritten protocol plans pass on the TypeScript memory kernel, the compiler enforces the certification rules on them, and the designated mutants for these claims are killed."
    stop_conditions:
      - "STOP if an obligation in the old plans has no catalogued operation to express it; record a specification finding instead of adding a composite operation; do not improvise."
    description: "ADR-0075. Write syscall versions of kernel-protocol-core and kernel-protocol-extended as new plan files with new planIds, gated by a kernel.syscall capability and listed in the authority packet beside the legacy plans, which stay unchanged until every kernel adapter has migrated. The new plans are traces over catalogued syscalls with claimIds, explicit arguments, and captures, and ship an old-to-new obligation map in the pull request. Replace canonical-rejection, thread-list, recovery-state, edge-validation, and cross-thread-rejection composites with direct observations judged by the runner. Add syscall bindings to the TypeScript kernel adapter and claim kernel.syscall, remove normalizeLogicalErrorCode, and align the TypeScript kernel's emitted error codes with the three canonical plan codes (turn_node_thread_mismatch, run_lease_owner_mismatch, run_lease_token_mismatch) as an implementation finding with a changeset; the adapter's unbacked turn_head_lateral_move mapping is a specification finding settled in authority before any code changes (ADR-0075 decision 2). Update the negative-control designations to the new claims. Remove unit tests made redundant or self-asserting by the migration, listing each with its reason in the obligation map. Record every failure in this ticket's certification-triage.yaml."
    acceptance:
      mode: contract_test
      evidence: "Assert the rewritten plans pass on the TypeScript memory kernel with compiler rules enforcing, every old obligation maps to a claimId or an explicit removal reason, the designated mutants for these claims are killed with activation proof, and no adapter code path compares, sorts, or normalizes for these operations."
    flows: [flow-authority-packet-driven-conformance, flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - spec/kernel/authority-packet.json
        justification: "The syscall plans are registered in the kernel packet beside the legacy plans, as the ticket describes."
      - files:
          - tools/conformance/plan-compiler/certification-assessment.ts
          - tools/conformance/plan-compiler/certification-rules.ts
          - tools/conformance/plan-compiler/validate-plans.ts
          - tools/conformance/plan-compiler/index.ts
          - tools/schemas/conformance-plan.schema.json
        justification: "Enforcing the certification rules on the new plans needs the certificationRules plan field, enforcement for kernel.syscall plans, catalog-based operation admission, and the catalogued-error exemption for adapterError observations."
      - files:
          - tools/conformance/harness/run.ts
          - tools/conformance/harness/test/run.test.ts
        justification: "Native errors with uncatalogued codes or on unasserted trace steps fail the check as implementation."
      - files:
          - reports/compatibility
        justification: "Generated compatibility evidence refreshed because verify:kernel checks its freshness after the plans were registered."
      - files:
          - typescript/runtime/src/lib/runtime-core-response.ts
          - typescript/runtime/test/runtime-core.stale-step-recovery.test.ts
          - python/kernel/src/tuvren_kernel/errors.py
        justification: "Review found @tuvren/runtime still detected lease fences by the old kernel_runtime codes; it and its fake kernel follow the canonical codes, and a Python docstring naming the old code was corrected."
      - files:
          - tools/scripts/lib/biome-lint-partition.test.ts
        justification: "The lint partition test pinned file counts that the new adapter modules outgrew; it now compares exact inventories."
    status: done
  - id: KRT-DB005
    title: Cross-validate kernel vectors and identity recipes with the Rust encoder
    type: Feature
    effort: 5
    depends_on: [KRT-DB002]
    scope:
      in:
        - rust/kernel
        - spec/conformance/kernel/fixtures
        - spec/conformance/kernel/identity-recipes.json
    verification:
      command: bun run check
      expected: "Exit 0; the workspace cargo test gate runs because Rust sources changed, and the Rust test reproduces every committed kernel vector and identity recipe digest byte for byte."
    stop_conditions:
      - "STOP if the Rust encoder disagrees with a committed vector; record it as a specification or implementation finding with both encodings and do not change the vector; do not improvise."
    description: "ADR-0078 decision 4. Before any identity recipe is promoted into a certificate, a Rust test in rust/kernel recomputes canonical CBOR and digests for every committed vector and identity recipe, so the runner's verifier and the TypeScript production encoder are cross-checked by an independent implementation."
    acceptance:
      mode: contract_test
      evidence: "Assert the Rust test reproduces every committed vector and recipe digest and fails on a deliberately altered vector."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - typescript/kernel/protocol/test/kernel-certification-authority.test.ts
          - tools/conformance/harness/test/kernel-integrity.test.ts
        justification: "Review found the committed vectors lacked nested byte strings, integer widths, and projection drops; the four new fixture pairs are recomputed by the recipe and verifier tests, whose pinned inventories were updated."
    status: done
decisions:
  - id: OD-16
    question: "How do kernel certification plans express the deterministic codec obligations (arbitrary-record encoding and identity hashing, CBOR decoding, canonical rejection) that no catalogued syscall reaches?"
    blocks: [KRT-DJ001]
    options:
      - name: Catalogue codec operations under a kernel.codec capability
        pros:
          - "Every kernel implementation already exposes a deterministic codec; catalogued encode, decode, and hash operations let the runner judge canonical rejection and record identity directly across languages."
          - "The legacy plans and the accept-noncanonical-cbor mutant can retire with no lost obligation."
        cons:
          - "Adds a codec surface to the operation catalog that the kernel specification's syscall section does not name; it needs a Stage 3 record."
      - name: Retire codec obligations from kernel certification
        pros:
          - "Runner integrity assertions over syscall-produced records plus the Rust cross-validation already check encoding and identity for every record a kernel persists."
        cons:
          - "Canonical rejection of noncanonical input is no longer certified anywhere; it falls back to package-local tests per language."
    recommendation: Catalogue codec operations under a kernel.codec capability
    closure: ruling
    ruler: "Owner, after the EPIC-DB merge"
    status: proposed
    asked:
      date: 2026-10-23
      in: EPIC-DB
    proposed_by: EPIC-DB @ 6ebd60c
    interim:
      assumption: "The 68 codec assertions stay on the legacy kernel-protocol-core and kernel-protocol-extended plans and the accept-noncanonical-cbor mutant keeps its legacy designation; KRT-DJ001 must not delete them before this closes."
      applied_by:
        - spec/conformance/kernel/plans/kernel-protocol-core.json
        - spec/conformance/kernel/plans/kernel-protocol-extended.json
        - spec/conformance/kernel/negative-controls.json
        - KRT-DB004
