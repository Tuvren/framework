        - spec
        - tools
        - reports/compatibility/project.json
        - oxlint.config.ts
        - oxfmt.config.ts
        - tools/biome-coverage
        - ".changeset/toolchain-cb-biome-retirement.md"
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if an unmigrated project or unexplained suppression remains occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Dynamically discover every active retained Biome target at execution and require an exact native replacement; the current 42-target inventory (33 TypeScript, eight spec, one reports/compatibility target) is repository evidence, not a retirement quota. Aggregate the BQ-CA per-directory suppression dispositions, reconcile the identities of all 144 baseline directives plus measured drift, and prove the current tree contains no biome-ignore directive without manufacturing suppressions. After BU, BV, and BW are native-clean, atomically admit the whole tools root so its actual code and JSON selections own tools/scripts/lib, the BV gate files, tools/scripts/conformance, tools/conformance, tools/generators, and tools/run-nx.mjs without overlapping targets; then retire their retained lists. Convert all eight spec targets and reports/compatibility/project.json to the exact active-default nx:run-commands JSON-only command bun tools/scripts/json-check.ts --json-only PROJECT_ROOT with the workspace root as cwd, and stop mixed targets from borrowing tooling files. For every mixed target, require the exact ordered commands bunx --bun oxlint --type-aware PROJECT_ROOT and bun tools/scripts/json-check.ts PROJECT_ROOT with the workspace root as cwd. Reject alternate executors or configurations, partial, glob, or parent operands, extra options, forwarded, unknown, or no-op flags, empty selections, and duplicate checker ownership. Use the established native helpers without adding dependencies or repository-owned lint policy. Add or update .changeset/toolchain-cb-biome-retirement.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory, @tuvren/backend-postgres, @tuvren/backend-shared, @tuvren/backend-sqlite, @tuvren/core, @tuvren/kernel-grpc-client, @tuvren/kernel-protocol, @tuvren/kernel-runtime, @tuvren/mcp-client, @tuvren/provider-api, @tuvren/provider-bridge-ai-sdk, @tuvren/runner-react, @tuvren/runtime, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert every live retained target discovered at execution has one exact native replacement, while the current 42-target split is evidence only. Reconcile every identity in the 144-directive baseline plus measured drift against the BQ-CA disposition artifacts and prove zero biome-ignore directives remain. For code, derive complete nonempty coverage from Oxlint's actual --debug=files selection; for JSON, derive it from the native source-integrity selection independently of Oxfmt ignores. Prove JSON-only code absence from fresh Git inventory outside cached targets. Where project inputs override lint defaults, require explicit inputs for the real checker helpers. Assert the type-aware backend preserves every installed, enabled, as-shipped rule, option, severity, environment, global, plugin, setting, and category with no override; 55 type-aware rules in the measured 474-rule preset and 419 non-type-aware rules remain historical evidence only. Confirm the whole-tools target has sole ownership, all eight spec targets and the report target use the exact JSON-only shape, generated and constitution protections remain as ruled, and the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: planned
