    description: "ADR-0070 and SPK-KRT-OD006. Remove biome.jsonc, @biomejs/biome and ultracite-biome together, along with the temporary selective Biome runner, coverage lists and retired Nx lint input. Preserve the already-independent permanent JSON source policy: JSON_SOURCE_INTEGRITY_EXCLUSIONS remains the native owner of the 44 protected patterns with explicit reasons and no runtime import of Biome configuration. Keep source-integrity exclusions distinct from Oxfmt formatting ignores. Retain a permanent native admission and coverage gate after deleting tools/scripts/biome-lint.ts and the temporary lists; it dynamically inspects active targets, exact command shapes, Oxlint's actual file selection, native JSON selection, protected exceptions, partial or empty selections, duplicate ownership, unsupported or no-op flags, and fresh-cache JSON-only code additions. Replace root lint and format scripts and every residual caller with direct native tooling, update docs/guides/add-a-driver.md to show the canonical mixed native Nx target, and remove tools/run-nx.mjs from retained ownership only after KRT-CB001's whole-tools admission. Enable --report-unused-disable-directives and --type-aware across the completed gate. Add or update .changeset/toolchain-cb-biome-retirement.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory, @tuvren/backend-postgres, @tuvren/backend-shared, @tuvren/backend-sqlite, @tuvren/core, @tuvren/kernel-grpc-client, @tuvren/kernel-protocol, @tuvren/kernel-runtime, @tuvren/mcp-client, @tuvren/provider-api, @tuvren/provider-bridge-ai-sdk, @tuvren/runner-react, @tuvren/runtime, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert no executable Biome reference remains, the unchanged shipped preset is used, root lint and format succeed, second generation is clean, and unused directives fail the gate. Assert @biomejs/biome and ultracite-biome are removed together from the manifest and lockfile, with no temporary coverage runner or list left behind. Prove the permanent native admission gate survives and fails closed on target-shape drift, actual code or JSON coverage gaps, protected-exception drift, partial or empty selections, duplicate ownership, unsupported or no-op flags, and a code file added to a cached JSON-only scope. Assert the 44-pattern native JSON source policy remains independent of Biome configuration and distinct from formatter ignores, the contributor guide uses the canonical ordered mixed target, and the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
