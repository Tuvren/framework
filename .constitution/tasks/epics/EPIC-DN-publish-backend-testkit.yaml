  - id: KRT-DN001
    title: Rename the kernel testkit to @tuvren/backend-testkit and make it publishable
    type: Chore
    effort: 3
    depends_on: []
    scope:
      in:
        - typescript/kernel/testkit
        - typescript/kernel/backends/memory
        - typescript/kernel/backends/sqlite
        - typescript/kernel/backends/postgres
        - typescript/kernel/backends/shared
        - typescript/kernel/certification
        - typescript/kernel/conformance-adapter
        - typescript/runtime/package.json
        - typescript/runtime/test/durable-reads.scope-isolation.test.ts
        - typescript/runtime/tsconfig.typecheck.json
        - typescript/runners/react/tsconfig.typecheck.json
        - typescript/sdk/tsconfig.typecheck.json
        - typescript/providers/certification/tsconfig.typecheck.json
        - typescript/providers/bridge-ai-sdk/tsconfig.typecheck.json
        - tsconfig.base.json
        - tools/scripts/portability-check.ts
        - tools/scripts/typecheck-source-aliases.test.ts
        - docs/guides/add-a-kernel-backend.md
        - ".changeset/conformance-handle-barriers.md"
        - ".changeset/kernel-dn-publish-backend-testkit.md"
