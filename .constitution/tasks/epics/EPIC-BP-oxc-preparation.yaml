      evidence: "Assert all intended files resolve through project references, the measured 2423 then 354 project-resolution errors are eliminated, and type-aware diagnostics are counted from resolved types. Repository typecheck remains source-only; type-aware lint receives declaration prerequisites where required. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
    deviations:
