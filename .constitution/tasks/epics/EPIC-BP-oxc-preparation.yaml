      command: bun run codegen
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if parsed JSON changes or any constitution evidence digest changes occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Apply one mechanical oxfmt pass and re-emit outputs through the changed generators, including compatibility-report outputs not previously exercised end to end. This ticket is alone in one mechanical commit, exempt from the diff budget and excluded from this epic estimated_diff_lines. Never format .constitution or SHA-pinned evidence. In this mechanical commit, switch the root format command and import organization to oxfmt; the preceding lint-only Biome gate must accept the result. Add the patch changeset in a separate commit of this same pull request, outside the exempt reformat commit. Add or update .changeset/toolchain-bp-oxc-preparation.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory, @tuvren/backend-postgres, @tuvren/backend-shared, @tuvren/backend-sqlite, @tuvren/core, @tuvren/kernel-grpc-client, @tuvren/kernel-protocol, @tuvren/kernel-runtime, @tuvren/mcp-client, @tuvren/provider-api, @tuvren/provider-bridge-ai-sdk, @tuvren/runner-react, @tuvren/runtime, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: invariant
      evidence: "Invariant: parsed generated artifacts and runtime behavior are unchanged; a second generator and formatter pass produces no diff. Checker: bun run codegen plus oxfmt check. Preserve all constitution evidence digests. Root lint accepts the regenerated oxfmt layout, and the exempt mechanical commit contains no changeset or semantic cleanup. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
    deviations:
