decisions:
  - id: OD-08
    question: Should Oxlint load the shipped Ultracite preset by verbatim root
      spread after its extends loader drops rule options and environment?
    blocks:
      - KRT-BP001
      - .constitution/tech-spec/adrs/ADR-0070-oxc-replaces-biome-for-typescript-lint-and-format.md
    options:
      - name: Adopt verbatim root spread
        pros:
          - Preserves the complete shipped preset including rule option tuples
            and environment without policy overrides.
          - The full effective-config comparison and retained Biome checks pass.
        cons:
          - ADR-0070's physical extends wording requires a Stage 3 alignment
            pass.
      - name: Retain extends and defer OXC preparation
        pros:
          - Keeps the recorded physical spelling unchanged.
        cons:
          - Drops nine shipped rule option tuples and changes environment under
            the installed Oxlint loader.
          - Cannot satisfy the approved as-shipped preset contract and blocks
            the remaining BP chain.
    recommendation: Adopt verbatim root spread
    closure: ruling
    ruler: Repository owner after EPIC-BP merge
    waiting_on: Repository owner ruling after merge; independent M3 fix review and
      full effective-config evidence are complete.
    interim:
      assumption: Verbatim root spreading semantically extends the unchanged shipped
        preset and satisfies ADR-0070's binding policy goal; stale
        loader-specific wording is routed to Stage 3 without editing undeclared
        authority during execution.
      applied_by:
        - KRT-BP001
        - oxlint.config.ts
        - tools/scripts/oxc-preparation.test.ts
    status: proposed
    asked:
      date: 2026-10-01
      in: EPIC-BP
    proposed_by: EPIC-BP

