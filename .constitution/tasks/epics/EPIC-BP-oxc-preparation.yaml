        - typescript/telemetry/semconv/src/lib/generated
        - ".changeset/toolchain-bp-oxc-preparation.md"
    verification:
      command: bun run codegen
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if regeneration changes authority values or requires weakening the kernel-plan semantic guard occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Swap the four formatter callers and seven spec artifact targets to oxfmt. Extend kernel-plan regeneration so its master guard does not prevent the approved formatter regeneration. Preserve semantic guardrails. Keep a matched JSON path in telemetry formatting so generated-helper ignores do not cause exit 2. Stage outputs for the separate mechanical ticket. Add or update .changeset/toolchain-bp-oxc-preparation.md as a patch changeset with direct coverage for the affected public packages: @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert generator commands use oxfmt, no formatter caller uses Biome, every target still declares its artifact inputs, and regeneration preserves parsed authority. Re-running bun run codegen must be clean after the mechanical output commit. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
    deviations:
      - files: [tools/scripts/generator-oxfmt.test.ts, tools/biome-coverage/bv.json]
        justification: "Focused acceptance tests verify native formatter callers, artifact inputs, promoted-check preservation and parsed-value guards; the coverage list keeps the new test in the retained lint gate."
      - files: [reports/compatibility/project.json]
        justification: "The evidence-refresh target actually invokes the changed compatibility formatter, so it requires the root package and Oxfmt configuration inputs; codegen and check remain check-only."
  - id: KRT-BP004
    title: Land one mechanical format and regeneration commit
    type: Chore
    effort: 3
    depends_on: [KRT-BP003]
    scope:
      in:
        - tools
        - typescript
        - spec
        - reports/compatibility
        - tests
