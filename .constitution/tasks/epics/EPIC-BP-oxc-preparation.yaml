id: BP
name: "OXC configuration and formatter preparation; mechanical reformat exempt"
kind: tooling
capabilities: []
depends_on: [BO]
scope:
  paths:
    - package.json
    - bun.lock
    - ".github/dependabot.yml"
    - devenv.nix
    - oxlint.config.ts
    - oxfmt.config.ts
    - tools
    - typescript
    - spec
    - reports/compatibility
    - tests
    - tsconfig.base.json
    - tsconfig.json
    - biome.jsonc
    - ".constitution/tech-spec/stack.yaml"
    - ".changeset/toolchain-bp-oxc-preparation.md"
  tech_spec_patchable: [".constitution/tech-spec/stack.yaml"]
estimated_diff_lines: 5000
estimate_source: planned
tickets:
  - id: KRT-BP007
    title: Pin the retained Biome preset through an npm alias
    type: Chore
    effort: 5
    depends_on: []
    scope:
      in: [package.json, bun.lock, biome.jsonc]
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if alias resolution fails or normalized Biome lint diagnostics differ from the baseline; do not proceed to the OXC install or ratchet."
    description: "ADR-0070 and the OD-006 review amendment. Before upgrading un-aliased ultracite, install ultracite-biome pinned to npm:ultracite@7.4.2 with Bun and retarget biome.jsonc extends to ultracite-biome/biome/core. Compare normalized Biome lint diagnostics before and after on the same source tree and identical coverage. Preserve the exact rule set, severities and diagnostics before proceeding. Assumption: The unmeasured alias transition preserves the retained Biome lint output."
    acceptance:
      mode: contract_test
      evidence: "Assert the manifest and lockfile pin ultracite-biome to npm:ultracite@7.4.2, biome.jsonc extends the alias export, and normalized before/after Biome lint output is identical. Prove this before changing un-aliased ultracite."
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [tools/scripts/biome-alias.test.ts]
        justification: "Approved acceptance test verifies the retained alias against immutable pre-transition preset and probe diagnostics; it survives the unaliased Ultracite upgrade."
  - id: KRT-BP002
    title: Remove the formatter parse blocker
    type: Chore
    effort: 2
    depends_on: []
    scope:
      in: [tools/scripts/epic-af-conformance-gap-plan.ts]
    verification:
      command: "bun run docs:af-gap-plan:check"
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: ADR-0070 and SPK-KRT-OD006. Fix TS1354 at the measured readonly Array declaration around line 497. Preserve the generated gap-plan behavior.
    acceptance:
      mode: contract_test
      evidence: "Assert the script parses, its gap-plan freshness check succeeds, and both retained Biome and OXC can inspect it without grammar failure."
    flows: []
    certainty: settled
    status: done
    deviations:
      - files: [tools/scripts/oxc-preparation.test.ts]
        justification: "Approved compiler, freshness and retained-Biome acceptance tests; OXC inspection completes in M3 after installation, as the approved plan specifies."
  - id: KRT-BP001
    title: Install OXC and load unchanged config presets
    type: Chore
    effort: 5
    depends_on: [KRT-BP007, KRT-BP002]
    scope:
      in:
        - package.json
        - bun.lock
        - ".github/dependabot.yml"
        - devenv.nix
        - oxlint.config.ts
        - oxfmt.config.ts
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if latest ultracite requires an OXC rule override or the retained aliased Biome diagnostics change; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Install oxlint, oxfmt and oxlint-tsgolint with ultracite latest as a config-only dependency. Run binaries directly. Repeat preset ignorePatterns because extends does not inherit them, and add .constitution/**. Exclude Markdown, YAML and TOML from oxfmt. Remove the temporary ultracite hold with the manual bump. Keep Biome lint on the separately pinned ultracite-biome preset; the OXC ultracite upgrade must not change retained Biome diagnostics. Assumption: The installed OXC pins and latest ultracite exports preserve the measured configuration behavior."
    acceptance:
      mode: contract_test
      evidence: "Assert both configs load under Bun, the preset rule set has no local overrides, type-aware backend is installed, .constitution files are untouched, and only TypeScript and JSON are formatted. Biome lint remains a working gate before any directory switches."
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [tools/scripts/oxc-preparation.test.ts]
        justification: "Approved installation/configuration tests also complete OXC inspection for BP002; the adjacent stack-only S1 patch aligns installed pin evidence before the pair is reviewed."
  - id: KRT-BP008
    title: Make the root Biome gate lint-only with selective coverage
    type: Chore
    effort: 5
    depends_on: [KRT-BP001]
    scope:
      in:
        - package.json
        - biome.jsonc
        - tools/scripts/biome-lint.ts
        - tools/biome-coverage
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if a retained lint path loses coverage, an empty list expands to the repository, or formatting/import-organization diagnostics remain in the Biome gate; do not proceed to the reformat."
    description: "ADR-0070 and the OD-006 review amendment. Replace root biome check . with biome lint over an explicit list of not-yet-migrated files and directories. Disable Biome formatter and assist actions in biome.jsonc. Preserve the root surface gate and run OXC for migrated targets. Implement a Bun runner reading separate tools/biome-coverage/<epic-id-lowercase>.json lists for BQ through CA plus a residual.json list for root/configuration and other remaining coverage. Initialize every list from the full retained lint inventory; neither omission nor duplicate coverage is allowed. Empty lists skip Biome rather than invoking it without paths. Each directory epic removes only its migrated entries from its own list in the lint-target switch, permitting disjoint parallel edits. Keep the alias pinned. Assumption: Selective lint coverage and mixed OXC/Biome routing preserve complete lint coverage throughout the ratchet."
    acceptance:
      mode: contract_test
      evidence: "Assert every former root lint path belongs to a directory coverage list or residual.json. The root gate invokes biome lint only on remaining entries with formatter and assists off, preserves the surface gate, and includes switched OXC targets. Removing one directory entry leaves all other lists intact; an empty list does not run Biome. After the mechanical oxfmt commit, root lint must pass without rejecting formatting or import organization."
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [tools/scripts/biome-lint.test.ts, nx.json]
        justification: "Approved behavioral tests and narrow Oxlint cache input support the mixed lint runner; filesystem parity and migration-aware checks now fail closed and preserve remaining-only Biome lint."
      - files: [tools/scripts/lib/biome-inventory.ts, tools/scripts/lib/biome-inventory.test.ts]
        justification: "The verified inventory derives from Git and owned Biome config with Bun native APIs, avoiding whole-root lint and failing closed on discovery errors; parity and migration tests address the independent P1 findings."
      - files: [tools/scripts/lib/biome-lint-partition.test.ts]
        justification: "A focused native-inventory partition test covers real BQ switch metadata, counting retained and OXC-excluded files together without exceeding the runner test module size limit."
  - id: KRT-BP003
    title: Make generators produce oxfmt-clean artifacts
    type: Chore
    effort: 5
    depends_on: [KRT-BP008, KRT-BP002]
    scope:
      in:
        - tools/scripts/conformance/format-generated-json.ts
        - tools/scripts/conformance/generate-kernel-plans.ts
        - tools/scripts/telemetry-codegen.ts
        - tools/scripts/api-freeze-gate.ts
        - tools/scripts/compatibility-report.ts
        - spec
        - typescript/telemetry/semconv/src/lib/generated
        - ".changeset/toolchain-bp-oxc-preparation.md"
    verification:
      command: bun run codegen
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if regeneration changes authority values or requires weakening the kernel-plan semantic guard occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Swap the four formatter callers and seven spec artifact targets to oxfmt. Extend kernel-plan regeneration so its master guard does not prevent the approved formatter regeneration. Preserve semantic guardrails. Keep a matched JSON path in telemetry formatting so generated-helper ignores do not cause exit 2. Stage outputs for the separate mechanical ticket. Add or update .changeset/toolchain-bp-oxc-preparation.md as a patch changeset with direct coverage for the affected public packages: @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert generator commands use oxfmt, no formatter caller uses Biome, every target still declares its artifact inputs, and regeneration preserves parsed authority. Re-running bun run codegen must be clean after the mechanical output commit. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: done
    deviations:
      - files: [tools/scripts/generator-oxfmt.test.ts, tools/biome-coverage/bv.json]
        justification: "Focused acceptance tests verify native formatter callers, artifact inputs, promoted-check preservation and parsed-value guards; the coverage list keeps the new test in the retained lint gate."
      - files: [reports/compatibility/project.json]
        justification: "The evidence-refresh target actually invokes the changed compatibility formatter, so it requires the root package and Oxfmt configuration inputs; codegen and check remain check-only."
  - id: KRT-BP004
    title: Land one mechanical format and regeneration commit
    type: Chore
    effort: 3
    depends_on: [KRT-BP003]
    scope:
      in:
        - tools
        - typescript
        - spec
        - reports/compatibility
        - tests
        - package.json
        - tsconfig.base.json
        - tsconfig.json
        - biome.jsonc
        - oxlint.config.ts
        - oxfmt.config.ts
        - ".changeset/toolchain-bp-oxc-preparation.md"
    verification:
      command: bun run codegen
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if parsed JSON changes or any constitution evidence digest changes occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Apply one mechanical oxfmt pass and re-emit outputs through the changed generators, including compatibility-report outputs not previously exercised end to end. This ticket is alone in one mechanical commit, exempt from the diff budget and excluded from this epic estimated_diff_lines. Never format .constitution or SHA-pinned evidence. In this mechanical commit, switch the root format command and import organization to oxfmt; the preceding lint-only Biome gate must accept the result. Add the patch changeset in a separate commit of this same pull request, outside the exempt reformat commit. Add or update .changeset/toolchain-bp-oxc-preparation.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory, @tuvren/backend-postgres, @tuvren/backend-shared, @tuvren/backend-sqlite, @tuvren/core, @tuvren/kernel-grpc-client, @tuvren/kernel-protocol, @tuvren/kernel-runtime, @tuvren/mcp-client, @tuvren/provider-api, @tuvren/provider-bridge-ai-sdk, @tuvren/runner-react, @tuvren/runtime, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: invariant
      evidence: "Invariant: parsed generated artifacts and runtime behavior are unchanged; a second generator and formatter pass produces no diff. Checker: bun run codegen plus oxfmt check. Preserve all constitution evidence digests. Root lint accepts the regenerated oxfmt layout, and the exempt mechanical commit contains no changeset or semantic cleanup. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: in_progress
    deviations:
      - files: [.git-blame-ignore-revs]
        justification: "Approved post-merge exception records the exact merged mechanical SHA after patch-id mapping; release changeset coverage remains separate in M7."
  - id: KRT-BP005
    title: Expose full type-aware project coverage
    type: Chore
    effort: 5
    depends_on: [KRT-BP004]
    scope:
      in: [typescript, tools, ".changeset/toolchain-bp-oxc-preparation.md"]
    verification:
      command: bun run typecheck
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if project discovery requires changing public package resolution or generated declarations leak into source occurs; do not improvise."
    description: "ADR-0070 and SPK-KRT-OD006. Add tsconfig.typecheck.json references to the 25 package tsconfigs, the three missing certification-wrapper tsconfigs, and typecheck configs for all three conformance adapters. Cover tests, benches and smoke files. Re-measure the adapter diagnostics after resolution noise disappears. Add or update .changeset/toolchain-bp-oxc-preparation.md as a patch changeset with direct coverage for the affected public packages: @tuvren/backend-memory, @tuvren/backend-postgres, @tuvren/backend-shared, @tuvren/backend-sqlite, @tuvren/core, @tuvren/kernel-grpc-client, @tuvren/kernel-protocol, @tuvren/kernel-runtime, @tuvren/mcp-client, @tuvren/provider-api, @tuvren/provider-bridge-ai-sdk, @tuvren/runner-react, @tuvren/runtime, @tuvren/sdk, @tuvren/stream-agui, @tuvren/stream-core, @tuvren/stream-sse, @tuvren/telemetry-otel, @tuvren/telemetry-semconv. Private packages require no changeset. Include formatting, configuration, generated outputs and BUILD-file edits in this coverage."
    acceptance:
      mode: contract_test
      evidence: "Assert all intended files resolve through project references, the measured 2423 then 354 project-resolution errors are eliminated, and type-aware diagnostics are counted from resolved types. Repository typecheck remains source-only; type-aware lint receives declaration prerequisites where required. Assert the pull request has direct patch changeset coverage for every affected public package under ADR-0069 and tools/scripts/changeset-check.ts; fixed-group propagation alone is insufficient."
    flows: []
    certainty: settled
    status: planned
  - id: KRT-BP006
    title: Record installed OXC pins in a spec-only patch
    type: Chore
    effort: 3
    depends_on: [KRT-BP005]
    scope:
      in: [".constitution/tech-spec/stack.yaml"]
    verification:
      command: bun run lint
      expected: "Exit 0; the scoped acceptance assertions pass and unaffected lanes retain their baseline results."
    stop_conditions:
      - "STOP if the change requires a rule override, an undeclared input, or a change to runtime authority occurs; do not improvise."
    description: ADR-0070 and SPK-KRT-OD006. Record the installed OXC and ultracite pins with lockfile evidence in a separate spec-only commit. Keep Biome declared as the active lint gate until the directory ratchet completes. Retain the pinned ultracite-biome alias record alongside Biome until CB retires both.
    acceptance:
      mode: invariant
      evidence: "Invariant: stack records match the installed manifests and lockfile, and Biome retirement is still conditional on all directory gates. Checker: bun run lint and constitution pin validation."
    flows: []
    certainty: settled
    status: planned

decisions:
  - id: OD-08
    question: Should Oxlint load the shipped Ultracite preset by verbatim root
      spread after its extends loader drops rule options and environment?
    blocks:
      - KRT-BP001
      - .constitution/tech-spec/adrs/ADR-0070-oxc-replaces-biome-for-typescript-lint-and-format.md
    options:
      - name: Adopt verbatim root spread
        pros:
          - Preserves the complete shipped preset including rule option tuples
            and environment without policy overrides.
          - The full effective-config comparison and retained Biome checks pass.
        cons:
          - ADR-0070's physical extends wording requires a Stage 3 alignment
            pass.
      - name: Retain extends and defer OXC preparation
        pros:
          - Keeps the recorded physical spelling unchanged.
        cons:
          - Drops nine shipped rule option tuples and changes environment under
            the installed Oxlint loader.
          - Cannot satisfy the approved as-shipped preset contract and blocks
            the remaining BP chain.
    recommendation: Adopt verbatim root spread
    closure: ruling
    ruler: Repository owner after EPIC-BP merge
    waiting_on: Repository owner ruling after merge; independent M3 fix review and
      full effective-config evidence are complete.
    interim:
      assumption: Verbatim root spreading semantically extends the unchanged shipped
        preset and satisfies ADR-0070's binding policy goal; stale
        loader-specific wording is routed to Stage 3 without editing undeclared
        authority during execution.
      applied_by:
        - KRT-BP001
        - oxlint.config.ts
        - tools/scripts/oxc-preparation.test.ts
    status: proposed
    asked:
      date: 2026-10-01
      in: EPIC-BP
    proposed_by: EPIC-BP
