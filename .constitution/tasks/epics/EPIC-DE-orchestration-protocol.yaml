id: DE
name: Operation handles, barrier-proven writer races, and kernel.memory certification
kind: product
capabilities: [CAP-035, CAP-037, CAP-038]
depends_on: [DD]
priority: 6
scope:
  paths:
    - tools/conformance/harness
    - tools/conformance/adapter-protocol
    - tools/conformance/meta-conformance
    - spec/conformance/kernel
    - typescript/kernel/conformance-adapter
    - typescript/kernel/testkit
    - rust/kernel
    - rust/kernel-conformance-adapter
    - spec/kernel/authority-packet.json
    - tools/conformance/plan-compiler
    - tools/conformance/certification
    - reports/compatibility/evidence/certification-harness.kernel-typescript-certification.json
    - reports/compatibility/evidence/certification-harness.kernel-rust-certification.json
  tech_spec_patchable:
    - .constitution/tech-spec/contracts/conformance-adapter-protocol.meta.yaml
estimated_diff_lines: 8000
estimate_source: planned
tickets:
  - id: KRT-DE001
    title: Run operations through handles on a concurrent stdio host
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - tools/conformance/harness
        - tools/conformance/adapter-protocol
        - typescript/kernel/conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; startOperation, awaitOperation, and cancelOperation work against the TypeScript kernel adapter and the host answers requests while operations run."
    stop_conditions:
      - "STOP if concurrency in the host changes the result of any existing serial check; do not improvise."
    description: "ADR-0077 decision 1. Make the reference TypeScript stdio host process requests concurrently with one response per id, add operation handles to the runner and the TypeScript kernel adapter, and keep blocking dispatch for unmigrated plans."
    acceptance:
      mode: contract_test
      evidence: "Assert two started operations progress independently, an inspectState request is answered while an operation is blocked, and existing serial plans keep their results."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
  - id: KRT-DE003
    title: Certify racing writers with entry receipts and barriers
    type: Feature
    effort: 5
    depends_on: [KRT-DE001]
    scope:
      in:
        - spec/conformance/kernel/plans
        - spec/conformance/kernel/negative-controls.json
        - typescript/kernel/testkit
        - typescript/kernel/conformance-adapter
        - tools/conformance/harness
    verification:
      command: bun run verify:kernel
      expected: "Exit 0; the concurrent-writer check passes on the TypeScript memory kernel only when both contenders reached the native seam before release, in both orderings, and the stale-head mutant is killed."
    stop_conditions:
      - "STOP if the barrier seam must sit inside an exclusive lock to hold both contenders; record the design gap; do not improvise."
    description: "ADR-0077 decision 5. Add a reviewed barrier seam in the testkit's persistence path that emits implementation-entry receipts and holds contenders until released. Write a syscall version of the concurrent-writer checks, beside the unchanged legacy plan, that establishes a common head, start both contenders, wait for both receipts, release, and assert one success, one typed lateral conflict, and the head equal to the winner, in both orderings. Remove the adapter's race composite and derived booleans."
    acceptance:
      mode: contract_test
      evidence: "Assert the check fails when contenders run sequentially (no second receipt before release), passes on the TypeScript memory kernel in both orderings, and kills the stale-head mutant."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    status: planned
  - id: KRT-DE005
    title: Bring the Rust kernel adapter to protocol 0.2 and the writer race
    type: Feature
    effort: 5
    depends_on: [KRT-DE003]
    scope:
      in:
        - rust/kernel
        - rust/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; the Rust adapter serves operation handles concurrently and the concurrent-writer check passes or is triaged against the Rust kernel."
    stop_conditions:
      - "STOP if the Rust kernel cannot run two writers concurrently in one process; record the implementation finding; do not improvise."
    description: "ADR-0077. Make the Rust adapter host concurrent, bind startOperation, awaitOperation, and cancelOperation, add a test-only barrier seam in the Rust in-memory persistence path, and run the concurrent-writer checks. Triage every failure."
    acceptance:
      mode: contract_test
      evidence: "Assert the Rust adapter answers requests while operations run, both contenders reach the seam before release, and each failure has a triage entry."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
  - id: KRT-DE006
    title: Certify the TypeScript and Rust memory kernels under kernel.memory
    type: Feature
    effort: 5
    depends_on: [KRT-DE003, KRT-DE005]
    scope:
      in:
        - spec/conformance/kernel/profiles.json
        - spec/kernel/authority-packet.json
        - tools/conformance/certification
        - tools/conformance/harness
        - tools/conformance/plan-compiler
        - tools/conformance/meta-conformance
        - typescript/kernel/conformance-adapter
        - rust/kernel-conformance-adapter
        - reports/compatibility/evidence/certification-harness.kernel-typescript-certification.json
        - reports/compatibility/evidence/certification-harness.kernel-rust-certification.json
    verification:
      command: bun run verify:kernel
      expected: "Exit 0; the kernel.memory profile with its full claim set (including the barrier-proven writer race) is enforcing, the negative-control gate is enforcing for it, and the TypeScript and Rust memory kernels produce complete certificate bundles or triaged red checks."
    stop_conditions:
      - "STOP if any kernel.memory claim has no designated detecting control and no recorded reason; do not improvise."
    description: "ADR-0079 decision 4 and ADR-0081. Write spec/conformance/kernel/profiles.json with kernel.memory over the syscall plans, make compiler rules and the negative-control gate enforcing for them, claim the profile in the TypeScript memory and Rust adapter manifests, and emit both certificate bundles with digests and the matching control run. Publish the TypeScript and Rust disagreement report in this ticket's evidence."
    acceptance:
      mode: contract_test
      evidence: "Assert a claimed profile with a non-applicable required check fails, both certificates validate against tools/schemas/certification-evidence.schema.json with control runs matching every verifier digest, every kernel.memory claim has a detecting control or a recorded reason, and the disagreement report is captured."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
