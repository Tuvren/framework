id: CG
name: Bazel-native Python workspace
kind: tooling
capabilities: []
depends_on: [CC]
scope:
  paths:
    - python/kernel/BUILD.bazel
    - python/kernel-conformance-adapter/BUILD.bazel
    - python/kernel-certification/BUILD.bazel
    - tools/bazel/python.bzl
