tickets:
  - id: KRT-DT001
    title: "Certify SQLite and PostgreSQL on kernel.memory"
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - "spec/conformance/kernel"
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "tools/conformance/meta-conformance"
        - "typescript/kernel/certification-sqlite"
        - "typescript/kernel/certification-postgres"
        - "tools/conformance/certification"
        - "reports/compatibility"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if SQLite cannot provide kernel.barrier through the testkit seam or a required core rule cannot run; triage the finding without weakening the profile."
    description: "Make adapter-sqlite.json and adapter-postgres.json claim kernel.memory in addition to their durable profiles. Run every core rule and profile-tagged control over each backend itself. Add the SQLite testkit transaction barrier construction and capability declaration required by kernel.barrier; prove both writer-entry receipts before release, retaining the actual SQLite transaction behavior. Never borrow reference-memory or another backend kills. Findings are expected and use the normal V/I/S/E triage with replay evidence. Subsequent DR detectors must run against these claimed backends too."
    acceptance:
      mode: contract_test
      evidence: "SQLite and PostgreSQL each execute the complete kernel.memory inventory and their own applicable controls, including protocol, edge-validation, lineage, codec, scopes, and concurrency. SQLite proves kernel.barrier activation and both arrival orderings through its testkit seam. Certificates link matching backend identity and control runs; every discovered failure has a triage entry and cannot count as a pass. Missing required capabilities or controls withhold the affected certificate."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: planned
