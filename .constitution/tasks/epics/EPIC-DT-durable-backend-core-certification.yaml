id: DT
name: "Certify durable backends on core rules"
kind: product
capabilities: [CAP-035, CAP-037, CAP-038]
depends_on: [DQ]
priority: 4
scope:
  paths:
    - "spec/conformance/kernel"
    - "typescript/kernel/backends"
    - "typescript/kernel/runtime"
    - "typescript/kernel/testkit"
    - "typescript/kernel/conformance-adapter"
    - "tools/conformance/meta-conformance"
    - "tools/conformance/harness/test"
    - "reports/compatibility"
    - "typescript/kernel/certification-sqlite"
    - "typescript/kernel/certification-postgres"
    - "tools/conformance/certification"
  tech_spec_patchable: []
estimated_diff_lines: 3500
estimate_source: planned
# Estimate: 5 points at about 711 diff lines per point, rounded to 3,500 lines; includes checked-in generated evidence because diff_exclusions excludes lockfiles and snapshots, not generated evidence.
tickets:
  - id: KRT-DT001
    title: "Certify SQLite and PostgreSQL on kernel.memory"
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - "spec/conformance/kernel"
        - "typescript/kernel/backends"
        - "typescript/kernel/runtime"
        - "typescript/kernel/testkit"
        - "typescript/kernel/conformance-adapter"
        - "tools/conformance/meta-conformance"
        - "typescript/kernel/certification-sqlite"
        - "typescript/kernel/certification-postgres"
        - "tools/conformance/certification"
        - "reports/compatibility"
    verification:
      command: "bun run conformance"
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if SQLite cannot provide kernel.barrier through the testkit seam or a required core rule cannot run; fix the finding without weakening the profile."
      - "STOP and create a new ticket for an implementation finding too large for this ticket; keep DT open until that prerequisite lands and the affected certificate passes. Do not silently defer it or close DT with a withheld certificate."
    description: "Make adapter-sqlite.json and adapter-postgres.json claim kernel.memory in addition to their durable profiles. Run the full positive core inventory and the profile-tagged controls available after DQ over each backend itself; DR adds later detectors. Declare SQLite kernel.barrier and prove the existing testkit barrier constructed in typescript/kernel/conformance-adapter/src/host-syscalls.ts; prove both writer-entry receipts before release, retaining the actual SQLite transaction behavior. Never borrow reference-memory or another backend kills. Own findings using normal V/I/S/E triage with replay evidence, and fix implementation findings in the backend or runtime. Subsequent DR detectors must run against these claimed backends too."
    acceptance:
      mode: contract_test
      evidence: "SQLite and PostgreSQL each execute the complete kernel.memory inventory and their own applicable controls that exist after DQ, including protocol, edge-validation, lineage, codec, scopes, and concurrency positive checks; later DR detectors are outside this acceptance. SQLite proves kernel.barrier activation and both arrival orderings through its testkit seam. Certificates link matching backend identity and control runs; every discovered failure has a triage entry and cannot count as a pass. Implementation findings are fixed, and both affected certificates pass at close; no certificate remains withheld."
    flows: ["flow-multi-implementation-conformance-compatibility"]
    certainty: assumed
    status: done
closeout:
  tickets_completed: [KRT-DT001]
  tickets_deferred: []
  points_completed: 5
  spec_patches: []
  changelog_entries:
    - directory: tasks
      type: added
      text: "EPIC-DT certified the TypeScript SQLite and PostgreSQL backends on kernel.memory. Both durable manifests claim the profile after their durable profiles, SQLite declares kernel.barrier and proves both concurrent-writer orderings through the testkit seam, and each backend kills all 13 kernel.memory controls in its own enforcing control run. The lease-takeover control's listing corruption moved to the backend transaction seam so it is observable on shared-lease-clock backends, and the negative-control runner gained an --adapter selector."
  candidate_terms: []
  routed_upstream:
    - stage: tech-spec
      item: "conformance-certification.md and guidelines 5.10/5.11 describe the negative-control runner's selection by port and profile only; record the repeatable --adapter selector added in e0b4f4d (restricts a run to configs whose control adapter manifest matches, rejects unknown adapters and empty selections) and that certificate linking stays per profile and adapter, so a filtered report cannot certify an unselected backend."
    - stage: tech-spec
      item: "Record the mutant-seam rule learned from kernel.lease-takeover-before-expiry: a control that corrupts a clock-dependent result must inject below any backend clock clamp (the backend transaction seam), because shared-lease-clock backends replace the caller's clock in the kernel facade."
  follow_ups:
    - "The kernel.memory certificates for SQLite and PostgreSQL list the same 91 undetected claims as the memory backend (shared register); EPIC-DR's detectors must run against all three claimed backends."
    - "The kernel-seam preemptExpired half of kernel.lease-takeover-before-expiry has no effect on shared-lease-clock backends because the retry is clamped to the transaction clock; the listing seam carries the kill there. Moving the preemption corruption below the clamp is unplanned."
    - "The certificate and negative-control contract phase of bun run verify:kernel takes about 19 minutes on the development host with four kernel.memory configs; bundle-contract.test.ts and durable-bundle-contract.test.ts carry 1,200 s and 1,500 s timeouts with roughly 2x headroom, and EPIC-DR's added detectors will lengthen it. A shared control report between the two tests would remove the remaining overlap."
    - "tools/scripts/verification-lifecycle.test.ts fails when bun run verify runs with VERIFY_SERIAL=1, because the test's child verification inherits the variable and it asserts parallel steps; the test should clear the variable for its child."
    - "Several tooling acceptance tests (biome coverage partition, oxc configuration contract, testkit source-only self aliases) rely on bun's default 5 s timeout and fail under host CPU load; they passed on an unloaded rerun."
    - "tools/scripts/verify-kernel.ts and tools/scripts/verify.ts were edited for test registration only; tools/scripts is outside EPIC-DT's scope paths and no epic scope lists the verify lane registries."
  code_decisions:
    - summary: "A durable backend that also claims kernel.memory lists it last in its manifest profiles array, so the first claimed profile stays the durable one that bundle-contract.test.ts reads."
      kind: convention
      paths:
        - typescript/kernel/conformance-adapter/adapter-sqlite.json
        - typescript/kernel/conformance-adapter/adapter-postgres.json
      commit: 5c71a65
    - summary: "Mutants that corrupt a clock-dependent listing decorate the backend transaction (decorateTransactions) rather than the kernel facade, so the corruption survives a shared-lease-clock clamp."
      kind: pattern
      paths:
        - typescript/kernel/testkit/src/lib/kernel-mutants-protocol.ts
      commit: 5c71a65
    - summary: "negative-controls.ts selects configs through the exported selectControlConfigs, with a repeatable --adapter option matched against each config's control adapter manifest path."
      kind: contract_shape
      paths:
        - tools/conformance/meta-conformance/negative-controls.ts
      commit: e0b4f4d
  settled: []
