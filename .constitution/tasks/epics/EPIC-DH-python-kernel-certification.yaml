id: DH
name: Certify the Python kernel on the kernel catalog
kind: product
capabilities: [CAP-035, CAP-036, CAP-037, CAP-038]
depends_on: [DG]
priority: 11
scope:
  paths:
    - python/kernel
    - python/kernel-conformance-adapter
    - python/kernel-certification
    - reports/compatibility/compatibility-matrix.json
    - reports/compatibility/evidence/certification-harness.kernel-python-certification.json
    - "tools/conformance/meta-conformance/negative-control-config.ts"
    - "tools/conformance/certification/provenance.ts"
    - "tools/conformance/certification/certified-projects.json"
    - "spec/kernel/legacy/authority-packet.json"
  tech_spec_patchable: []
estimated_diff_lines: 7000
estimate_source: planned
tickets:
  - id: KRT-DH001
    title: Bind the Python kernel to the protocol syscalls with lossless encoding
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - python/kernel
        - python/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; the rewritten protocol plans pass or are triaged against the Python kernel adapter, which encodes observations per the encoding profile."
    stop_conditions:
      - "STOP if a protocol syscall has no public Python kernel API; record it as an implementation finding; do not improvise."
      - "STOP before implementation and replan the certification-control estimates against DS actuals; five points versus DS fifteen is unmeasured."
    description: "ADR-0075, ADR-0078, ADR-0080, and OD-16. Add the Python observation encoding helpers, add canonical protocol syscall bindings that forward native results and errors unchanged, bind the canonical kernel.codec operations, exclude sorting from canonical bindings, and make the Python kernel return canonical changedPaths order. Triage every failure in this ticket's certification-triage.yaml. Retain all composite handlers while this adapter selects the legacy packet; bind canonical operations alongside them. Deduplicate plan selection by packet and plan ID when both scope-isolation capabilities select plans."
    acceptance:
      mode: contract_test
      evidence: "Assert the canonical protocol and kernel.codec plans pass or have triage entries, all 68 migrated codec obligations are selected, observations validate against the encoding profile, and canonical bindings perform no comparison, sorting, or normalization. Legacy handlers remain unchanged until KRT-DH004 removes them with the legacy packet reference."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
  - id: KRT-DH002
    title: Re-express the Python fault seam and clocks and bind the memory-profile families
    type: Feature
    effort: 5
    depends_on: [KRT-DH001]
    scope:
      in:
        - python/kernel
        - python/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; isolation, reclamation, liveness, and in-process recovery plans pass or are triaged against the Python kernel with runner-owned clocks and armed faults."
    stop_conditions:
      - "STOP if canonical recovery bindings require an adapter-inserted reconcile call; record a specification or implementation finding; do not improvise."
    description: "ADR-0076. Re-express the existing Python fault-injecting backend at the storage-boundary points with throw mode and activation tokens, inject backend and worker clocks through setClock, and add canonical scope, reclamation, liveness, and in-process recovery syscall bindings. Canonical bindings perform no reconciliation or expected-value derivation; retain legacy handlers until KRT-DH004 removes them with the legacy packet reference. Any observable partial checkpoint state between separate durable writes is an implementation finding against the all-or-nothing invariant. Retain all composite handlers while this adapter selects the legacy packet; bind canonical operations alongside them. Deduplicate plan selection by packet and plan ID when both scope-isolation capabilities select plans."
    acceptance:
      mode: contract_test
      evidence: "Assert armed faults produce activation evidence, canonical bindings derive no expected head and perform no reconciliation, and every failure has a triage entry. Legacy handlers remain until KRT-DH004 removes them with the legacy packet reference."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    status: planned
  - id: KRT-DH003
    title: Serve protocol 0.2 concurrently and run the writer race in Python
    type: Feature
    effort: 3
    depends_on: [KRT-DH002]
    scope:
      in:
        - python/kernel
        - python/kernel-conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; the Python adapter serves operation handles concurrently and the concurrent-writer check passes or is triaged with both entry receipts before release."
    stop_conditions:
      - "STOP if the Python kernel cannot run two writers concurrently; record the implementation finding; do not improvise."
    description: "ADR-0077. Make the Python adapter host concurrent, bind the operation handle methods, add a test-only barrier seam in the in-memory persistence path, and run the concurrent-writer checks. The current sequential race is replaced, not kept."
    acceptance:
      mode: contract_test
      evidence: "Assert both contenders reach the seam before release in both orderings and each failure has a triage entry."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
  - id: KRT-DH004
    title: Certify the Python kernel under kernel.memory
    type: Feature
    effort: 5
    depends_on: [KRT-DH003]
    scope:
      in:
        - python/kernel
        - python/kernel-conformance-adapter
        - python/kernel-certification
        - reports/compatibility/compatibility-matrix.json
        - reports/compatibility/evidence/certification-harness.kernel-python-certification.json
        - "tools/conformance/meta-conformance/negative-control-config.ts"
        - "tools/conformance/certification/provenance.ts"
        - "tools/conformance/certification/certified-projects.json"
        - "spec/kernel/legacy/authority-packet.json"
    verification:
      command: bun run conformance
      expected: "Exit 0; the Python kernel claims kernel.memory with every required check applicable, and its certificate validates or its red checks are triaged."
    stop_conditions:
      - "STOP if certifying requires weakening a plan; record the finding instead; do not improvise."
      - "STOP and replan this ticket if reproducing the profile controls exceeds its five-point budget; do not claim certification with missing controls."
    description: "ADR-0081 and ADR-0084. Once all canonical bindings are complete, drop the legacy packet and claim kernel.memory. Reproduce the profile-tagged controls over the Python implementation, launch the built executable directly, and emit its implementation-matched certificate bundle. Fix small local implementation findings and file the rest with replay commands. Classify every finding in this ticket's certification-triage.yaml. Delete this adapter's composite handlers in the same ticket that removes its legacy packet reference and transitionalAdapters entry. Update shared negative-control configuration, packet-bound provenance and certified-projects.json to claim kernel.memory; the prior tuvren.kernel.protocol entry was withheld because the legacy packet has no profile."
    acceptance:
      mode: contract_test
      evidence: "Assert the kernel.memory run is complete without the legacy packet, every profile-tagged control is killed against Python with matching identity and unmutated reruns, the certificate lists remaining undetected claims, and each failure has a triage entry and, for implementation findings, an issue with a replay command. No handler is removed while selected by a retained legacy plan; the packet reference, transitional adapter entry and all composite handlers retire together. Both scope-isolation plan selections are deduplicated."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: planned
