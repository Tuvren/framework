tickets:
  - id: KRT-CR001
    title: Characterize the branch head a cold crash leaves behind
    type: Spike
    effort: 2
    depends_on: []
    scope:
      in:
        - .constitution/spikes/SPK-KRT-CR001.md
      out:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Unchanged from the base: the spike commits only its report, so the authority gate and the affected typecheck, test, and lint targets report the same result as before the ticket."
    stop_conditions:
      - "STOP if any official kernel's preemptExpired leaves the stale run's staged assistant message neither committed nor present in uncommittedStagedResults; don't improvise."
    description: "Research only; no code or test is committed. Pin down the durable state recovery actually inherits after a process dies mid-iterate, before any behavior is built on it. Confirm from the TypeScript kernel and the shared kernel conformance plan whether stale-running preemption reactively checkpoints the dead run's staged work, so the assistant tool-call message and any already-staged tool-result messages land in committed history with no manifest or runtime-status update, or whether some kernel returns them in uncommittedStagedResults instead. Record which shapes the runtime must handle, which tool calls count as fulfilled, and how the two inconsistent tool-result task id formats (main path versus approval-resume path) affect matching. Throwaway experiments are allowed but are not committed; KRT-CR002 commits the characterization test. Assumption: the runtime must handle both the committed-dangling-calls shape and the uncommitted-staged shape, since framework spec 4.9 names both."
    acceptance:
      mode: contract_test
      evidence: "SPK-KRT-CR001 states, with file and line references, the head shape after preemption for each official kernel the conformance plan covers, whether uncommittedStagedResults can be non-empty on the preemptExpired path, the matching rule from callId to fulfilled result, and the crash reproduction KRT-CR002 turns into its characterization test."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    spike: SPK-KRT-CR001
    certainty: assumed
    status: done
  - id: KRT-CR002
    title: Derive the unfinished tool calls of an interrupted iteration
    type: Feature
    effort: 5
    depends_on: [KRT-CR001]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime typecheck, lint, and tests pass, including the characterization test and new unit tests for the recovery plan over every head shape the spike recorded."
    stop_conditions:
      - "STOP if deriving fulfilled calls requires reading provider stream state or anything not durable; don't improvise."
      - "STOP if decoding a recovered assistant message requires a kernel protocol change; don't improvise."
    description: "When stale-run recovery classifies a preempted iterate step, read the recovered state (the committed branch head and, when present, RecoveryState staged results decoded through the payload codec seam) and build a recovery plan for the interrupted iteration: the original assistant message with its tool-call parts and callIds, the callIds that already have a committed or staged result, and the callIds still missing. A recovered iteration with no assistant tool-call message keeps today's behavior and re-invokes the model, as framework spec 4.9 allows for a crash during the model stream. An interrupted assistant message that cannot be read, including an erased payload, fails recovery explicitly with the existing exported TuvrenRecoveryError (typescript/core/src/lib/tuvren-error.ts) carrying the stable code runtime_recovery_interrupted_iteration_unreadable, rather than silently re-inferring; KRT-CR005 documents the code in the 4.9 amendment. Unfulfilled calls are derived only from committed or recovered staged state."
    acceptance:
      mode: contract_test
      evidence: "A characterization test in typescript/runtime/test reproduces the crash the spike recorded (an assistant message with tool calls and some of their results staged, then the process dies and the lease expires) and asserts the recovered head shape the plan is built from; its assertion that the model is re-invoked with fresh callIds is the one KRT-CR003 flips. Unit tests over constructed recovered states assert the plan for each shape: committed assistant message with partial committed results, staged-but-uncommitted results, no assistant message, a completed batch, and an unreadable or erased assistant message (fails with TuvrenRecoveryError, code runtime_recovery_interrupted_iteration_unreadable, naming the turn and stale run). Completed callIds are matched regardless of which tool-result task id format staged them."
    flows: [flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: done
  - id: KRT-CR003
    title: Continue the interrupted batch instead of re-invoking the model
    type: Feature
    effort: 8
    depends_on: [KRT-CR002]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime tests pass, including the cold-crash test the issue's acceptance names and the flipped characterization test."
    stop_conditions:
      - "STOP if resuming the batch requires the ReAct runner to change how it mints callIds; don't improvise."
      - "STOP if the resumed batch cannot be checkpointed without staging a second copy of the original assistant message; don't improvise."
    description: "When the recovery plan has missing calls, the replacement iterate run re-enters the tool-batch phase with the original assistant message instead of calling the runner: it dispatches every missing call exactly once, nonRetryable calls included, with its original callId, through the normal policy, approval, and execution-class path, so each dispatch presents the same (turnId, callId) idempotency key as the dead attempt and the external system deduplicates, per flow-preemption-idempotent-side-effect (ruling R1 for issue 156; no synthesized error result is written). Calls that already have results are not re-dispatched. The iteration's manifest and runtime status are recomputed over the recovered and new results, the iteration checkpoints, and the loop continues normally, including pausing for approval when a resumed call needs it. Existing recovery behavior for other stale steps is unchanged. This closes ADR-0065 open obligation 1."
    acceptance:
      mode: gherkin
      supplementary: [live_probe]
      recipe: reference-host-headless-sqlite
      # Expectations are stated over readBranchMessages because the preemption checkpoint already committed part of the iteration.
      evidence: "Given a leased run that staged an assistant message with three tool calls, one of them nonRetryable, and the results of two of the retryable ones before the process died, When a fresh runtime recovers the expired run on the same branch with the same signal, Then the runner is not invoked for that iteration, the two completed calls are not dispatched again, the nonRetryable call is dispatched once with its original callId, the ToolExecutionContext idempotencyKey it receives equals deriveIdempotencyKey(turnId, callId) for the original attempt, and readBranchMessages returns, in order, the original assistant message, the two already-committed tool results, and then the newly dispatched result, with no second assistant message for that iteration. Given the same crash after all results were staged, Then recovery dispatches nothing and the loop proceeds to the next model call. The reference-host-headless-sqlite recipe still logs 'headless sqlite scenario passed', proving uninterrupted turns are unaffected."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    certainty: assumed
    status: done
    deviations:
      - files:
          - .constitution/reports/epic-af-conformance-gap-plan.json
          - .constitution/reports/epic-af-conformance-gap-plan.md
        justification: "The wave lead's validated M7 amendment authorized the owner generator to refresh exactly these two derived reports after the approved ADR patch made the mandatory AF freshness gate stale. No report or generator source was edited manually."
  - id: KRT-CR005
    title: Certify interrupted-batch recovery and amend the recovery protocol
    type: Feature
    effort: 8
    depends_on: [KRT-CR003]
    scope:
      in:
        - typescript/conformance-adapter/src/framework-adapter-recovery-scenarios.ts
        - spec/conformance/engine/plans/runtime-api-lifecycle-extended.json
        - spec/conformance/engine/scenarios/runtime-api-scenarios.json
        - spec/core/authority-packet.json
        - reports/compatibility
        - docs/KrakenFrameworkSpecification.md
        - .constitution/reports/epic-ad-normative-docs-claim-inventory.json
        - .constitution/reports/epic-ad-docs-to-authority-coverage-matrix.json
        - .constitution/reports/epic-ad-docs-to-authority-freeze-gate-summary.md
        - .constitution/reports/epic-ad-framework-deferred-surface-decisions.md
        - .constitution/reports/epic-ad-kernel-backend-provider-local-surface-decisions.md
        - .constitution/reports/epic-ad-typescript-freeze-gate-report.md
        - .constitution/reports/epic-ad-docs-to-authority-freeze-gate-closure-inventory.md
        - .changeset/runtime-cr-cold-recovery-tool-batch-resume.md
    verification:
      command: bun run conformance
      expected: "The new stale-recovery checks pass for the TypeScript framework lane with structured evidence and no status fail; bun run docs:authority-freeze:check accepts the amended 4.9 text with the regenerated .constitution/reports/epic-ad-* outputs committed, and bun run changeset:check passes."
    stop_conditions:
      - "STOP if the adapter would need to decide pass or fail, receive a check id, or replay fixtures to produce the evidence; don't improvise."
      - "STOP if the freeze gate requires a new authority packet entry rather than citing the extended plan; don't improvise."
    description: "Add stale-recovery scenarios to the run-liveness conformance plan so the behavior is certified by the shared harness rather than only by runtime tests: an interrupted batch resumes every missing call, nonRetryable included, with its original callId, and the idempotency key each resumed call presents equals the original attempt's. Adding checks bumps the plan's planVersion by one minor (0.2.0 to 0.3.0) and updates the pinned planVersion for tuvren.framework.runtime-api.lifecycle-extended in spec/core/authority-packet.json, which owns the plan. The adapter only drives the scenario and returns implementation-emitted events and durable state; the plan's assertions grade them. Refresh compatibility evidence the new checks change. Amend framework spec 4.9 to describe the reactive-checkpoint head shape stale-running preemption leaves, the resume-only-missing rule, same-key re-dispatch of every missing call (nonRetryable included, deduplicated by the external system per ruling R1), and the runtime_recovery_interrupted_iteration_unreadable failure, citing the new checks; regenerate the docs freeze gate outputs with bun run docs:authority-freeze. Add a PATCH changeset for the affected public packages per ADR-0069 decision 3 (additive change during 0.x)."
    acceptance:
      mode: contract_test
      evidence: "New checks under runtime-lifecycle-ext.stale-recovery in spec/conformance/engine/plans/runtime-api-lifecycle-extended.json assert: no runner invocation for the recovered iteration, the set of dispatched callIds equals the missing set (all missing calls, nonRetryable included), and each resumed call's idempotency key equals the original attempt's. The plan's planVersion is 0.3.0 and spec/core/authority-packet.json pins the same version. Every evidence entry is produced by the TypeScript framework adapter and graded by tools/conformance/harness/run.ts. The amended 4.9 names the head shape, both rules, and the error code; the changeset requests a patch bump."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    certainty: assumed
    status: done
  - id: KRT-CR006
    title: Prove the idempotency key survives a real approval pause and resume
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "The new behavioral test passes and the existing idempotency-identity unit tests stay green."
    stop_conditions:
      - "STOP if the test shows handle.turnId is not carried through approval resume; report it as a defect, don't improvise a fix inside this ticket."
    description: "Close ADR-0065 open obligation 2: drive a real approval pause and resolveApproval resume through the runtime, which serves the call from a new Run, and assert that the idempotency key the approved call receives at dispatch equals the key derived from the original turnId and callId. This pins the turnId-threading assumption ADR-0065 rests on, which the unit tests do not exercise. Assumption: the resumed Run is served with the paused turn's turnId; no behavioral test has exercised that yet, so the ticket is assumed and estimated one step up."
    acceptance:
      mode: contract_test
      evidence: "A test in typescript/runtime/test executes a turn whose tool call requires approval, observes the pause and the callId, resolves the approval, and asserts the ToolExecutionContext idempotencyKey at dispatch equals deriveIdempotencyKey(turnId, callId) for the original turn, while the runId differs from the paused run's."
    flows: [flow-tool-approval-pause-resume]
    certainty: assumed
    status: done
