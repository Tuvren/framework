id: CR
name: Resume an interrupted tool batch on cold recovery with original call identity
kind: out_of_band
source: "github#156"
priority: 1
capabilities: [CAP-005, CAP-014, CAP-068, CAP-016]
depends_on: []
scope:
  paths:
    - typescript/runtime/src/lib
    - typescript/runtime/test
    - typescript/conformance-adapter/src/framework-adapter-recovery-scenarios.ts
    - spec/conformance/engine/plans/runtime-api-lifecycle-extended.json
