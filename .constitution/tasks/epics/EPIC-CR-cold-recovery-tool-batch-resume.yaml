tickets:
  - id: KRT-CR001
    title: Characterize the branch head a cold crash leaves behind
    type: Spike
    effort: 2
    depends_on: []
    scope:
      in:
        - .constitution/spikes/SPK-KRT-CR001.md
        - typescript/runtime/test
      out:
        - typescript/runtime/src/lib
    verification:
      command: bun run conformance
      expected: "The existing kernel and framework recovery lanes stay green; the spike's characterization test documents the observed head state without changing runtime behavior."
    stop_conditions:
      - "STOP if any official kernel's preemptExpired leaves the stale run's staged assistant message neither committed nor present in uncommittedStagedResults; don't improvise."
    description: "Pin down the durable state recovery actually inherits after a process dies mid-iterate, before any behavior is built on it. Confirm from the TypeScript kernel and the shared kernel conformance plan whether stale-running preemption reactively checkpoints the dead run's staged work, so the assistant tool-call message and any already-staged tool-result messages land in committed history with no manifest or runtime-status update, or whether some kernel returns them in uncommittedStagedResults instead. Add a characterization test that reproduces a crash after the assistant message and some tool results were staged, and record which shapes the runtime must handle, which tool calls count as fulfilled, and how the two inconsistent tool-result task id formats (main path versus approval-resume path) affect matching. Assumption: the runtime must handle both the committed-dangling-calls shape and the uncommitted-staged shape, since framework spec 4.9 names both."
    acceptance:
      mode: contract_test
      evidence: "SPK-KRT-CR001 states, with file and line references, the head shape after preemption for each official kernel the conformance plan covers, whether uncommittedStagedResults can be non-empty on the preemptExpired path, and the matching rule from callId to fulfilled result. A characterization test in typescript/runtime/test reproduces the crash shape and asserts today's behavior (the model is re-invoked and mints fresh callIds) so the later tickets flip it deliberately."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    spike: SPK-KRT-CR001
    certainty: assumed
    status: planned
  - id: KRT-CR002
    title: Derive the unfinished tool calls of an interrupted iteration
    type: Feature
    effort: 5
    depends_on: [KRT-CR001]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime typecheck, lint, and tests pass, including new unit tests for the recovery plan over every head shape the spike recorded."
    stop_conditions:
      - "STOP if deriving fulfilled calls requires reading provider stream state or anything not durable; don't improvise."
      - "STOP if decoding a recovered assistant message requires a kernel protocol change; don't improvise."
    description: "When stale-run recovery classifies a preempted iterate step, read the recovered state (the committed branch head and, when present, RecoveryState staged results decoded through the payload codec seam) and build a recovery plan for the interrupted iteration: the original assistant message with its tool-call parts and callIds, the callIds that already have a committed or staged result, and the callIds still missing. A recovered iteration with no assistant tool-call message keeps today's behavior and re-invokes the model, as framework spec 4.9 allows for a crash during the model stream. An assistant message or result that cannot be decoded, including an erased payload, fails recovery explicitly with the existing TuvrenRecoveryError rather than silently re-inferring. Unfulfilled calls are derived only from committed or recovered staged state."
    acceptance:
      mode: contract_test
      evidence: "Unit tests over constructed recovered states assert the plan for each shape: committed assistant message with partial committed results, staged-but-uncommitted results, no assistant message, a completed batch, and an undecodable or erased assistant message (fails with TuvrenRecoveryError naming the turn and stale run). Completed callIds are matched regardless of which tool-result task id format staged them."
    flows: [flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: planned
  - id: KRT-CR003
    title: Continue the interrupted batch instead of re-invoking the model
    type: Feature
    effort: 8
    depends_on: [KRT-CR002]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime tests pass, including the cold-crash test the issue's acceptance names."
    stop_conditions:
      - "STOP if resuming the batch requires the ReAct runner to change how it mints callIds; don't improvise."
      - "STOP if the resumed batch cannot be checkpointed without staging a second copy of the original assistant message; don't improvise."
    description: "When the recovery plan has missing calls, the replacement iterate run re-enters the tool-batch phase with the original assistant message instead of calling the runner: it dispatches only the missing calls, with their original callIds, through the normal policy, approval, and execution-class path, so each dispatch presents the same (turnId, callId) idempotency key as the dead attempt. Calls that already have results are not re-dispatched. The iteration's manifest and runtime status are recomputed over the recovered and new results, the iteration checkpoints, and the loop continues normally, including pausing for approval when a resumed call needs it. Existing recovery behavior for other stale steps is unchanged. This closes ADR-0065 open obligation 1 for retryable calls."
    acceptance:
      mode: gherkin
      supplementary: [live_probe]
      recipe: reference-host-headless-sqlite
      evidence: "Given a leased run that staged an assistant message with three tool calls and the results of two of them before the process died, When a fresh runtime recovers the expired run on the same branch with the same signal, Then the runner is not invoked for that iteration, the two completed calls are not dispatched again, the third is dispatched once with its original callId, the ToolExecutionContext idempotencyKey it receives equals the key derived for the original attempt, and the committed iteration holds the original assistant message followed by exactly three tool results. Given the same crash after all results were staged, Then recovery dispatches nothing and the loop proceeds to the next model call. The reference-host-headless-sqlite recipe still logs 'headless sqlite scenario passed', proving uninterrupted turns are unaffected."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    certainty: assumed
    status: planned
  - id: KRT-CR004
    title: Abandon an interrupted non-retryable call with a synthesized error result
    type: Feature
    effort: 5
    depends_on: [KRT-CR003]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
        - docs/KrakenFrameworkSpecification.md
        - .changeset/runtime-cr-cold-recovery-tool-batch-resume.md
    verification:
      command: "bun run docs:authority-freeze:check"
      expected: "The docs-to-authority freeze gate accepts the amended recovery protocol text, and bun run check passes for the runtime."
    stop_conditions:
      - "STOP if the synthesized result cannot be distinguished from a tool-authored error without a new field on ToolResultPart; don't improvise."
    description: "Apply ADR-0052 section 2 on the cold path, as ruled for issue 156: a missing call whose capability is nonRetryable may have been in flight when the process died, so it is never re-dispatched. Recovery commits a synthesized error ToolResultPart for that callId with a stable, framework-defined error code and explanation (tool_interrupted_by_recovery), emits tool.result for it, records it on the recovery telemetry, and lets the loop continue so the model sees the call did not complete. Retryable missing calls keep the KRT-CR003 behavior. Amend framework spec 4.9 to describe the reactive-checkpoint head shape, the resume-only-missing rule, and the abandon rule, and add a changeset for the affected public packages."
    acceptance:
      mode: gherkin
      evidence: "Given a crash after an assistant message with one nonRetryable call and one retryable call, neither with a result, When the run is recovered, Then the retryable call is dispatched once with its original callId, the nonRetryable call is never dispatched, a tool.result event carries an error result for its callId with code tool_interrupted_by_recovery, that result is in the committed iteration, and the recovery telemetry records the abandoned callId. The amended spec 4.9 text names the same code and rule."
    flows: [flow-preemption-idempotent-side-effect]
    certainty: assumed
    status: planned
  - id: KRT-CR005
    title: Prove interrupted-batch recovery through shared conformance
    type: Feature
    effort: 5
    depends_on: [KRT-CR004]
    scope:
      in:
        - typescript/conformance-adapter/src/framework-adapter-recovery-scenarios.ts
        - spec/conformance/engine/plans/runtime-api-lifecycle-extended.json
        - spec/conformance/engine/scenarios/runtime-api-scenarios.json
        - reports/compatibility
    verification:
      command: bun run conformance
      expected: "The new stale-recovery checks pass for the TypeScript framework lane with structured evidence and no status fail."
    stop_conditions:
      - "STOP if the adapter would need to decide pass or fail, receive a check id, or replay fixtures to produce the evidence; don't improvise."
    description: "Add stale-recovery scenarios to the run-liveness conformance plan so the behavior is certified by the shared harness rather than only by runtime tests: an interrupted batch resumes only the missing calls with their original callIds, a nonRetryable missing call is abandoned with the synthesized error result, and the idempotency key a resumed call presents equals the original attempt's. The adapter only drives the scenario and returns implementation-emitted events and durable state; the plan's assertions grade them. Refresh compatibility evidence the new checks change."
    acceptance:
      mode: contract_test
      evidence: "New checks under runtime-lifecycle-ext.stale-recovery in spec/conformance/engine/plans/runtime-api-lifecycle-extended.json assert: no runner invocation for the recovered iteration, the set of dispatched callIds equals the missing set, the resumed call's idempotency key equals the original, and the abandoned call's committed result carries tool_interrupted_by_recovery. Every evidence entry is produced by the TypeScript framework adapter and graded by tools/conformance/harness/run.ts."
    flows: [flow-crash-mid-checkpoint-recovery, flow-preemption-idempotent-side-effect]
    certainty: assumed
    status: planned
  - id: KRT-CR006
    title: Prove the idempotency key survives a real approval pause and resume
    type: Feature
    effort: 3
    depends_on: []
    scope:
      in:
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "The new behavioral test passes and the existing idempotency-identity unit tests stay green."
    stop_conditions:
      - "STOP if the test shows handle.turnId is not carried through approval resume; report it as a defect, don't improvise a fix inside this ticket."
    description: "Close ADR-0065 open obligation 2: drive a real approval pause and resolveApproval resume through the runtime, which serves the call from a new Run, and assert that the idempotency key the approved call receives at dispatch equals the key derived from the original turnId and callId. This pins the turnId-threading assumption ADR-0065 rests on, which the unit tests do not exercise."
    acceptance:
      mode: contract_test
      evidence: "A test in typescript/runtime/test executes a turn whose tool call requires approval, observes the pause and the callId, resolves the approval, and asserts the ToolExecutionContext idempotencyKey at dispatch equals deriveIdempotencyKey(turnId, callId) for the original turn, while the runId differs from the paused run's."
    flows: [flow-tool-approval-pause-resume]
    certainty: settled
    status: planned
