tickets:
  - id: KRT-CS001
    title: Add an optional admission key to the user message and input signal contracts
    type: Feature
    effort: 8
    depends_on: []
    scope:
      in:
        - spec/core/typespec/main.tsp
        - spec/core/artifacts/json-schema
        - spec/host/typespec/main.tsp
        - spec/host/artifacts/json-schema
        - spec/host/session/typespec/main.tsp
        - spec/host/session/artifacts/json-schema
        - typescript/core/src/lib
        - typescript/core/test
        - typescript/runtime/src/lib
        - typescript/runtime/test
        - tools/scripts/api-freeze-gate.ts
        - tools/scripts/api-freeze-gate.test.ts
        - tools/scripts/__snapshots__/api-surface/api-surface-snapshot.json
        - spec/conformance/engine/fixtures/admission-keyless-user-message.json
    verification:
      command: bun run verify
      expected: "The full verification gate passes, including codegen freshness and execution of tools/scripts/api-freeze-gate.test.ts in the tooling-acceptance phase. Generated core, host, and session JSON Schema artifacts are fresh and carry the optional admissionKey on UserMessage and InputSignal. The gate test proves the five stable-signature findings are refused by default without a snapshot write; bun run api-freeze --minor records exactly those five reviewed InputSignal and TuvrenMessage findings as a 0.x MINOR snapshot update; and bun run api-freeze:check passes against the refreshed snapshot."
    stop_conditions:
      - "STOP if adding the field changes the encoded bytes or the message hash of a user message that carries no key; don't improvise."
      - "STOP if blocked stable drift can update the API snapshot without the explicit --minor approval, if the approval records anything other than a 0.x MINOR bump, or if the experimental consistency floor becomes overridable; don't improvise."
      - "STOP if keeping the core, host, and session copies of UserMessage and InputSignal in sync requires merging the contracts; don't improvise."
    description: "As ruled for issue 155 (R2), the user message record itself carries the key, so message and key are one staged kernel object. UserMessage gains an optional host-owned admissionKey in spec/core/typespec/main.tsp and its mirror in spec/host/typespec/main.tsp, with regenerated JSON Schema and the typescript/core message types; InputSignal gains the same optional field in the host contract and the session contract's InputSignal. The key is an opaque, non-empty string the framework never interprets, deduplicates, or derives from content. Signal normalization, which today discards every field except parts, preserves it into the user message it builds for executeTurn initial input and steer(). A keyless signal normalizes to a user message with no admissionKey property at all, so its encoding and hash are unchanged. Under ADR-0056's 0.x amendment, the exact-signature gate keeps these stable changes blocked by default and admits the complete reviewed finding set only through bun run api-freeze --minor, which records a MINOR snapshot update."
    acceptance:
      mode: contract_test
      evidence: "Assert the regenerated UserMessage and InputSignal JSON Schemas under spec/core/artifacts/json-schema, spec/host/artifacts/json-schema, and spec/host/session/artifacts/json-schema allow an optional non-empty string admissionKey and nothing else new; normalization carries the key from the signal onto the user message for executeTurn and steer() signals, rejects an empty or non-string key with the existing invalid-signal error, and returns a keyless user message whose payload-codec bytes and message hash equal a fixture captured before this change. Gate tests assert that stable-signature drift is blocked and cannot update the snapshot by default; bun run api-freeze --minor records exactly the five reviewed InputSignal and TuvrenMessage findings with bump minor; allowed public drift records PATCH; --major, unknown flags, --check --minor, and an unnecessary --minor fail; the experimental consistency floor remains non-overridable; canonical metadata cites ADR-0069 and --minor; and historical ledger rows remain unchanged. The refreshed snapshot contains only the five reviewed stable-signature findings, and bun run api-freeze:check then passes."
    flows: [flow-context-engineering-steering]
    certainty: assumed
    status: done
  - id: KRT-CS002
    title: Stage the keyed user message for initial input and steering
    type: Feature
    effort: 5
    depends_on: [KRT-CS001]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime tests pass, including the new staged-message persistence and orchestration steering tests."
    stop_conditions:
      - "STOP if carrying the key requires a kernel record, CDDL, or proto change; don't improvise."
      - "STOP if adding the field changes the encoded bytes or hash of a keyless user message; don't improvise."
    description: "The keyed user message is what incorporate_input stages for the initial input and what incorporate_steering stages for a steered input, so the key becomes durable exactly when the message does, under the normal completeStep checkpoint and under the reactive checkpoint preemptExpired performs. Hosts read committed keys back through the existing readBranchMessages durable read, because the messages carry the key; no read method, TurnSnapshot field, or event record changes. The key is kept with its signal on every path to staging: ExecutionHandle.steer(), the orchestration runtime's steer(), and signals the orchestration runtime queues in pendingSteering before the handle binds (typescript/runtime/src/lib/orchestration-runtime-node.ts), including across an approval resume."
    acceptance:
      mode: contract_test
      evidence: "Tests on memory and SQLite backends assert readBranchMessages returns the incorporated user message with the supplied admissionKey for the initial input and for a steered input; two steered inputs with equal parts and distinct keys yield two user messages carrying their own keys; an orchestration-runtime steer() on a bound handle and a signal queued in pendingSteering before the handle binds both land with their keys; a keyless input's stored message hash equals the hash produced before this change; a crash after the user message is staged and before completeStep, followed by preemptExpired, leaves the message and its key on the branch together; and a fault before staging leaves neither."
    flows: [flow-context-engineering-steering, flow-host-lists-threads-reads-state]
    certainty: assumed
    status: done
  - id: KRT-CS008
    title: Keep the admission key out of every provider request
    type: Feature
    effort: 3
    depends_on: [KRT-CS002]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
      out:
        - typescript/providers
        - typescript/runners
    verification:
      command: bun run check
      expected: "Runtime tests pass, including the provider-request exclusion test."
    stop_conditions:
      - "STOP if excluding the field requires changing a provider bridge or the ReAct runner; don't improvise."
      - "STOP if excluding the field changes the stored messages, message hashes, or context manifest the runtime commits; don't improvise."
    description: "As ruled for issue 155 (R2), provider mappers and request construction never send admissionKey to a model provider. The runtime removes the field from the message projection it assembles for the runner's model request, so neither the ReAct runner nor any provider bridge receives it; the stored messages keep the key. The AI SDK bridge already maps only parts, but the exclusion does not rely on that, and provider bridges stay with EPIC-BZ."
    acceptance:
      mode: contract_test
      evidence: "A test in typescript/runtime/test drives a turn with a keyed initial input and a keyed steer through the ReAct runner against a recording provider and asserts no message in any captured provider request carries admissionKey, while readBranchMessages still returns both keys."
    flows: [flow-context-engineering-steering]
    certainty: assumed
    status: done
  - id: KRT-CS004
    title: Match a recovered turn's input by admission key when one is present
    type: Feature
    effort: 3
    depends_on: [KRT-CS002]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime recovery tests pass, including the new key-aware signal matching cases."
    stop_conditions:
      - "STOP if key-aware matching changes the outcome of any existing recovery test that uses keyless signals; don't improvise."
      - "STOP if the recovered turn's initial input message cannot be told apart from later steered user messages using durable state; don't improvise."
    description: "Stale-run recovery decides whether a re-submitted executeTurn is the same input as the dead turn by deep-equal of message parts against the last user message. When both the re-submitted signal and the recovered turn's initial input message carry an admission key, recovery matches on the key instead. The comparison uses the turn's first user message, the one its incorporate_input step staged, never the last user message, which can be a steer. Two inputs with equal text and distinct keys stay distinct, and a re-submission with the original key resumes the original turn. When either side has no key, matching is unchanged."
    acceptance:
      mode: gherkin
      evidence: "Given a turn whose initial input committed with key A and a later steer committed with key C before the process died, When the host re-submits an equal-text input with key B, Then recovery treats it as a mismatch and starts a fresh turn; When it re-submits with key A, Then recovery resumes the original turn; When it re-submits with key C, Then recovery treats it as a mismatch because C belongs to a steer, not the turn's initial input. Given keyless signals, Then every existing case in runtime-core.recovery.test.ts and runtime-core-recovery-comparison.test.ts keeps its current outcome."
    flows: [flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: done
  - id: KRT-CS005
    title: Carry the admission key through the duplex session steer frame
    type: Feature
    effort: 3
    depends_on: [KRT-CS001]
    scope:
      in:
        - typescript/host/session/src/lib
        - typescript/host/session/test
        - typescript/host/session-client/src/lib
        - typescript/host/session-client/test
    verification:
      command: bun run check
      expected: "Session binding and session-client tests pass with the key carried end to end."
    stop_conditions:
      - "STOP if carrying the key needs a protocolVersion change on session frames; don't improvise."
    description: "As ruled for issue 155, a remote peer can supply an admission key on the SessionSteerFrame signal: the duplex session binding's signal validation and normalization preserve it into steer(), and the zero-dependency session-client mirrors the field on its local signal type and frame builder. Frames without a key behave exactly as today."
    acceptance:
      mode: contract_test
      evidence: "Binding tests assert a steer frame whose signal carries admissionKey reaches the held handle's steer() with the key intact, an invalid key is rejected with the existing rejection frame, and a keyless frame is routed unchanged; session-client tests assert the frame it emits carries the key when supplied and omits it otherwise."
    flows: [flow-duplex-session-inbound-routing]
    certainty: assumed
    status: done
  - id: KRT-CS006
    title: Certify committed-or-not classification across every crash point
    type: Feature
    effort: 5
    depends_on: [KRT-CS002, KRT-CS004, KRT-CS005, KRT-CS008]
    scope:
      in:
        - typescript/conformance-adapter/src/framework-adapter.ts
        - typescript/conformance-adapter/src/framework-adapter-admission-key.ts
        - typescript/conformance-adapter/src/framework-adapter-admission-key-session.ts
        - typescript/conformance-adapter/src/framework-adapter-recovery-scenarios.ts
        - typescript/conformance-adapter/src/framework-adapter-session.ts
        - spec/conformance/engine/plans/runtime-api-lifecycle-extended.json
        - spec/conformance/engine/plans/host-session.json
        - spec/conformance/engine/scenarios/runtime-api-scenarios.json
        - spec/core/authority-packet.json
        - spec/host/session/authority-packet.json
        - reports/compatibility
    verification:
      command: bun run conformance
      expected: "The new admission-key checks pass for the TypeScript framework lane with structured evidence and no status fail, and the authority packets pin the bumped plan versions."
    stop_conditions:
      - "STOP if a crash point cannot be produced without the adapter deciding pass or fail or receiving a check id; don't improvise."
    description: "Add the issue's acceptance matrix to shared conformance: steer inputs with equal text and distinct keys, stop the process at each point between steer() and the incorporating commit, restart cold, let stale-run preemption run, and classify every key from readBranchMessages. The crash points are: queued in memory and never staged (not committed), user message staged and completeStep not yet called (committed, because preemptExpired's reactive checkpoint commits the message and its key as one object), and committed before steering.incorporated is emitted (committed). Add a host-session check that a steer frame's key survives carriage into the committed user message. The dispatcher in typescript/conformance-adapter/src/framework-adapter.ts routes the new scenarios. Adding checks bumps each plan's planVersion by one minor: runtime-api-lifecycle-extended.json from the version EPIC-CR leaves (0.3.0) to 0.4.0, pinned in spec/core/authority-packet.json, and host-session.json from 0.3.0 to 0.4.0, pinned in spec/host/session/authority-packet.json. The adapter drives scenarios and returns durable state and implementation-emitted events; the plans grade them. Refresh compatibility evidence the new checks change."
    acceptance:
      mode: contract_test
      evidence: "New checks in spec/conformance/engine/plans/runtime-api-lifecycle-extended.json assert, for each crash point, that every supplied key is classified exactly once and unambiguously as committed or not committed from readBranchMessages, including the staged-before-completeStep point, that equal-text distinct-key inputs remain distinct, and that keyless inputs keep today's behavior; a new check in spec/conformance/engine/plans/host-session.json asserts the steer frame carries the key into the committed user message. Both plans and their packets carry the bumped planVersion. Evidence is graded only by tools/conformance/harness/run.ts."
    flows: [flow-context-engineering-steering, flow-duplex-session-inbound-routing, flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: done
