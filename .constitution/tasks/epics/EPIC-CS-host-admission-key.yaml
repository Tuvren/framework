tickets:
  - id: KRT-CS001
    title: Accept an optional admission key on every input signal
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - spec/host/typespec/main.tsp
        - spec/host/artifacts/json-schema
        - spec/host/session/typespec/main.tsp
        - spec/host/session/artifacts/json-schema
        - typescript/core/src/lib
        - typescript/core/test
        - typescript/runtime/src/lib
        - typescript/runtime/test
        - tools/scripts/__snapshots__/api-surface/api-surface-snapshot.json
    verification:
      command: bun run codegen
      expected: "Generated host and session JSON Schema artifacts are fresh and carry the optional admissionKey on InputSignal; bun run api-freeze:check accepts the additive change."
    stop_conditions:
      - "STOP if the API freeze gate classifies an optional InputSignal field as a breaking change to a stable export; don't improvise."
      - "STOP if keeping the two InputSignal TypeSpec models in sync requires merging the host and session contracts; don't improvise."
    description: "As ruled for issue 155, InputSignal gains an optional host-owned admissionKey: an opaque, non-empty string the framework never interprets, deduplicates, or derives from content. It is accepted by executeTurn's initial input and by steer(), declared in the host contract and mirrored in the session contract's InputSignal, and preserved by signal normalization, which today discards every field except parts. Inputs without a key normalize exactly as today."
    acceptance:
      mode: contract_test
      evidence: "Assert the regenerated InputSignal JSON Schema in spec/host/artifacts/json-schema and spec/host/session/artifacts/json-schema allows an optional non-empty string admissionKey and nothing else new; normalization keeps the key on executeTurn and steer() signals, rejects an empty or non-string key with the existing invalid-signal error, and returns a keyless signal byte-identical to today's; the api-surface snapshot shows only the additive optional field."
    flows: [flow-context-engineering-steering]
    certainty: assumed
    status: planned
  - id: KRT-CS002
    title: Commit the admission key with the input or steering checkpoint
    type: Feature
    effort: 5
    depends_on: [KRT-CS001]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime tests pass, including the new same-commit persistence tests."
    stop_conditions:
      - "STOP if carrying the key requires a kernel record, CDDL, or proto change; don't improvise."
      - "STOP if adding the field changes the encoded bytes of an input_received or steering_incorporated record that carries no key; don't improvise."
    description: "As ruled for issue 155, the framework records a signal's admissionKey in the framework-owned event record it already stores with the incorporating checkpoint (input_received for the initial input, steering_incorporated for a steered input), so the key and the incorporated message become durable in the same commit by construction and neither exists without the other. A keyless input writes the same record bytes as today. The in-memory steering queue keeps each key with its signal, including across an approval resume, so the key that lands is the key the host supplied."
    acceptance:
      mode: contract_test
      evidence: "Tests read the TurnNode event record after incorporation and assert it carries the supplied admissionKey for both the initial input and a steered input, that two steered inputs with equal parts and distinct keys produce two commits whose records carry their own keys, that a keyless input's event record hash equals the hash produced before this change, and that a fault before the checkpoint leaves neither the message nor the key on the branch."
    flows: [flow-context-engineering-steering]
    certainty: assumed
    status: planned
  - id: KRT-CS003
    title: Read committed admission keys back from turn history
    type: Feature
    effort: 5
    depends_on: [KRT-CS002]
    scope:
      in:
        - typescript/core/src/lib
        - typescript/core/test
        - typescript/runtime/src/lib
        - typescript/runtime/test
        - tools/scripts/__snapshots__/api-surface/api-surface-snapshot.json
    verification:
      command: "bun run api-freeze:check"
      expected: "The API freeze gate accepts TurnSnapshot's additive optional admissionKey, and bun run check passes."
    stop_conditions:
      - "STOP if surfacing the key requires a new TuvrenRuntime read method; don't improvise."
      - "STOP if reading the event record on every snapshot measurably regresses getTurnHistory beyond the existing durable-read tests' bounds; don't improvise."
    description: "As ruled for issue 155, TurnSnapshot gains an optional admissionKey, populated by getTurnState and getTurnHistory when the turn node's event record carries one and absent otherwise. A host reconciling after a cold restart walks getTurnHistory from the branch head back to the last turn node it reconciled and classifies every accepted input as committed (its key appears) or not committed (it does not), without comparing message text. No read method is added."
    acceptance:
      mode: contract_test
      evidence: "Durable-read tests on memory and SQLite backends assert getTurnState and getTurnHistory expose admissionKey on the snapshots of incorporating turn nodes and omit it elsewhere, that walking history after two equal-text steers with distinct keys yields both keys on distinct turn nodes, and that the api-surface snapshot shows only the additive optional TurnSnapshot field."
    flows: [flow-host-lists-threads-reads-state]
    certainty: assumed
    status: planned
  - id: KRT-CS004
    title: Match a recovered turn's input by admission key when one is present
    type: Feature
    effort: 3
    depends_on: [KRT-CS002]
    scope:
      in:
        - typescript/runtime/src/lib
        - typescript/runtime/test
    verification:
      command: bun run check
      expected: "Runtime recovery tests pass, including the new key-aware signal matching cases."
    stop_conditions:
      - "STOP if key-aware matching changes the outcome of any existing recovery test that uses keyless signals; don't improvise."
    description: "Stale-run recovery decides whether a re-submitted executeTurn is the same input as the dead turn by deep-equal of message parts. When both the re-submitted signal and the recovered turn's committed input carry an admission key, recovery matches on the key instead, so two inputs with equal text and distinct keys stay distinct and a re-submission with the original key resumes the original turn. When either side has no key, matching is unchanged."
    acceptance:
      mode: gherkin
      evidence: "Given a turn whose initial input committed with key A before the process died, When the host re-submits an equal-text input with key B, Then recovery treats it as a mismatch and starts a fresh turn; When it re-submits with key A, Then recovery resumes the original turn. Given keyless signals, Then every existing case in runtime-core.recovery.test.ts and runtime-core-recovery-comparison.test.ts keeps its current outcome."
    flows: [flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: planned
  - id: KRT-CS005
    title: Carry the admission key through the duplex session steer frame
    type: Feature
    effort: 3
    depends_on: [KRT-CS001]
    scope:
      in:
        - typescript/host/session/src/lib
        - typescript/host/session/test
        - typescript/host/session-client/src/lib
        - typescript/host/session-client/test
    verification:
      command: bun run check
      expected: "Session binding and session-client tests pass with the key carried end to end."
    stop_conditions:
      - "STOP if carrying the key needs a protocolVersion change on session frames; don't improvise."
    description: "As ruled for issue 155, a remote peer can supply an admission key on the SessionSteerFrame signal: the duplex session binding's signal validation and normalization preserve it into steer(), and the zero-dependency session-client mirrors the field on its local signal type and frame builder. Frames without a key behave exactly as today."
    acceptance:
      mode: contract_test
      evidence: "Binding tests assert a steer frame whose signal carries admissionKey reaches the held handle's steer() with the key intact, an invalid key is rejected with the existing rejection frame, and a keyless frame is routed unchanged; session-client tests assert the frame it emits carries the key when supplied and omits it otherwise."
    flows: [flow-duplex-session-inbound-routing]
    certainty: assumed
    status: planned
  - id: KRT-CS006
    title: Certify committed-or-not classification across every crash point
    type: Feature
    effort: 5
    depends_on: [KRT-CS003, KRT-CS004, KRT-CS005]
    scope:
      in:
        - typescript/conformance-adapter/src/framework-adapter-recovery-scenarios.ts
        - typescript/conformance-adapter/src/framework-adapter-session.ts
        - spec/conformance/engine/plans/runtime-api-lifecycle-extended.json
        - spec/conformance/engine/plans/host-session.json
        - spec/conformance/engine/scenarios/runtime-api-scenarios.json
        - reports/compatibility
    verification:
      command: bun run conformance
      expected: "The new admission-key checks pass for the TypeScript framework lane with structured evidence and no status fail."
    stop_conditions:
      - "STOP if a crash point cannot be produced without the adapter deciding pass or fail or receiving a check id; don't improvise."
    description: "Add the issue's acceptance matrix to shared conformance: steer inputs with equal text and distinct keys, stop the process at each point between steer() and the incorporating commit (queued in memory, staged before checkpoint, committed before steering.incorporated is emitted), restart cold, and classify every key from turn history. Add a host-session check that a steer frame's key survives carriage. The adapter drives scenarios and returns durable state and implementation-emitted events; the plans grade them. Refresh compatibility evidence the new checks change."
    acceptance:
      mode: contract_test
      evidence: "New checks in spec/conformance/engine/plans/runtime-api-lifecycle-extended.json assert, for each crash point, that every supplied key is classified exactly once as committed or not committed from getTurnHistory, that equal-text distinct-key inputs remain distinct, and that keyless inputs keep today's behavior; a new check in spec/conformance/engine/plans/host-session.json asserts the steer frame carries the key into the committed record. Evidence is graded only by tools/conformance/harness/run.ts."
    flows: [flow-context-engineering-steering, flow-duplex-session-inbound-routing, flow-crash-mid-checkpoint-recovery]
    certainty: assumed
    status: planned
  - id: KRT-CS007
    title: State the admission key rules in the framework specification
    type: Chore
    effort: 2
    depends_on: [KRT-CS006]
    scope:
      in:
        - docs/KrakenFrameworkSpecification.md
        - .changeset/runtime-cs-host-admission-key.md
    verification:
      command: "bun run docs:authority-freeze:check"
      expected: "The docs-to-authority freeze gate accepts the amended steering, recovery, and host control surface text, and bun run changeset:check passes."
    stop_conditions:
      - "STOP if the freeze gate requires a new authority packet entry rather than citing the extended plans; don't improvise."
    description: "Amend framework spec 4.4 (steering), 4.9 (recovery), and 7.1 (steer and executeTurn) to state that an input signal may carry an opaque host-owned admission key, that the framework persists it in the same commit that incorporates the input and exposes it on turn history, that it never deduplicates by key or content, and that recovery matches on the key when both sides carry one. Add a changeset for the affected publishable packages."
    acceptance:
      mode: contract_test
      evidence: "The amended sections name the field, the same-commit guarantee, the TurnSnapshot read path, the no-dedup rule, and the recovery matching rule, each citing the conformance checks from KRT-CS006; the changeset lists every publishable package whose public types changed, with a 0.x minor bump per ADR-0069."
    flows: [flow-context-engineering-steering]
    certainty: assumed
    status: planned
