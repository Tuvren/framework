          - tools/schemas/certification-evidence.schema.json
          - tools/scripts/compatibility-report.ts
          - tools/scripts/conformance.ts
          - tools/scripts/conformance/certification-schema-examples.ts
          - reports/compatibility/compatibility-matrix.schema.json
        justification: "OD-22 interim design D: one run finalizes per-profile certificate bundles with a shared run id, per-profile control runs and gates, profile-keyed compatibility certificate rows, a conformance lane that requires them, and a SQLite-PostgreSQL disagreement capture."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence."
    status: done
decisions:
  - id: OD-20
    question: "On a backend that advertises a shared backend clock, which clock stamps the kernel's non-lease durable timestamps (thread, branch, turn, run, node, staged-result, checkpoint createdAtMs and updatedAtMs)? The specification assigns only lease stamping to backend time (section 5.2, ADR-0050)."
    blocks: [KRT-DF003, KRT-DF004, KRT-DF005]
    options:
      - name: One transaction clock per durable store
        pros:
          - "Matches the run API's existing resolveTransactionClock (tx.now on shared-lease-clock backends); only the lineage API never adopted it."
          - "Reclamation compares updatedAtMs against backend-derived horizons, which stays in one domain; two workers with skewed clocks cannot reorder records."
          - "Memory and SQLite keep the injected clock; other language ports state the same rule through the capability flag."
        cons:
          - "A record created by a worker clock ahead of backend time rejects later updates until backend time passes it, the same residue ADR-0050 accepts for leases."
      - name: Worker time for every non-lease timestamp, clamped to stay ordered
        pros:
          - "One rule for every backend."
        cons:
          - "Clamping manufactures timestamps and hides regressions, and reclamation horizons become cross-domain under skew."
    recommendation: One transaction clock per durable store
    closure: ruling
    ruler: "Owner, after the EPIC-DF merge"
    status: proposed
    asked:
      date: 2026-10-28
      in: EPIC-DF
    proposed_by: EPIC-DF @ 5b25cd7
    interim:
      assumption: "Within a kernel transaction every kernel-stamped durable timestamp comes from one transaction clock: tx.now when the backend advertises shared-lease-clock, otherwise the injected kernel clock. updatedAtMs >= createdAtMs and non-regressing updatedAtMs stay strict; no clamping and no migration. Whether a backward-stepping backend clock should reject or clamp is left open."
      applied_by:
        - typescript/kernel/runtime
        - spec/conformance/kernel/plans/kernel-protocol-core-syscall.json
        - spec/conformance/kernel/operations.json
        - KRT-DF003
  - id: OD-21
    question: "At the intermediate checkpoint fault points (after-turn-node-write-before-head, after-head-move-before-staging-clear), must recovery roll back to the baseline, or must an implementation whose turn-node write or head move was separately durable roll forward (KrakenKernelSpecification section 5.5: a durably visible post-checkpoint TurnNode means the checkpoint committed)?"
    blocks: [KRT-DF004]
    options:
      - name: Assert rollback for single-transaction backends and route roll-forward ports when they arrive
        pros:
          - "Both TypeScript durable backends write the checkpoint in one transaction, so a kill inside it is a rollback; the assertion is exact for them."
          - "The conditional-coverage gate stays satisfiable, because no current backend could exercise a roll-forward branch."
        cons:
          - "A correct port with separately durable writes (ADR-0076 names Python) would fail these checks until the plan branches on observed durability."
      - name: Branch on observed durability now (node present means head references it; absent means head equals baseline)
        pros:
          - "States the section 5.5 invariant for every implementation."
        cons:
          - "The roll-forward branch is unexercised by any current backend, which the ADR-0079 fleet branch-coverage gate rejects."
    recommendation: Assert rollback for single-transaction backends and route roll-forward ports when they arrive
    closure: ruling
    ruler: "Owner, after the EPIC-DF merge"
    status: proposed
    asked:
      date: 2026-10-28
      in: EPIC-DF
    proposed_by: EPIC-DF @ 426f57d
    interim:
      assumption: "The crash-recovery syscall plan asserts rollback to baseline at the intermediate points; when a port with separately durable checkpoint writes is certified, the plan gains observed-durability branches exercised by that port."
      applied_by:
        - spec/conformance/kernel/plans/kernel-crash-recovery-durable-syscall.json
        - KRT-DF004
  - id: OD-22
    question: "How do conformance plans certify a two-process durable writer race, real server-clock skew, and several durable profiles per backend, when the pinned plan contract has no order-agnostic outcome selection, no per-step process routing, no server clock source, and one certificate per run?"
    blocks: [KRT-DF005]
    options:
      - name: Additive runner-owned shapes (collect step, process selector with spawn, setClock source server, per-profile bundles)
        pros:
          - "The winner is selected deterministically by the runner from grouped outcomes, so assertions stay unconditional and ADR-0079 gains no unexercisable branch; sequential contenders still cannot certify because collect participants must hold barrier receipts recorded before release."
          - "Adapters still grade nothing; other kernel languages implement the same additive protocol."
          - "kernel.shared-backend requires clock.backend-server, so a shared-backend claim cannot dodge the real-clock skew check; per-profile bundles keep ADR-0081's one certificate per implementation, backend, and profile."
        cons:
          - "collect is the first runner-synthesized observation; ADR-0077 decision 5 needs an amendment that release order does not fix the winner across processes."
      - name: Defer KRT-DF005 until a Stage 3 pass specifies the shapes
        pros:
          - "No new contract shape lands before review."
        cons:
          - "EPIC-DF would close without the shared-backend, persistent-reopen, and process-crash certificates it exists to produce."
    recommendation: Additive runner-owned shapes (collect step, process selector with spawn, setClock source server, per-profile bundles)
    closure: ruling
    ruler: "Owner, after the EPIC-DF merge"
    status: proposed
    asked:
      date: 2026-10-28
      in: EPIC-DF
    proposed_by: EPIC-DF @ 23af796
    interim:
      assumption: "The design recorded for KRT-DF005: collect (kernel.harness.collect control observation with outcomes and byKind), steps[].process with spawn (one instance per process, handle-owned routing for await/cancel/release/barrier/collect), setClock source server gated by clock.backend-server with relative skew assertions, and per-profile certificate bundles from one run linked to per-profile control gates."
      applied_by:
        - tools/schemas/conformance-plan.schema.json
        - tools/conformance/adapter-protocol
        - tools/conformance/plan-compiler
        - tools/conformance/harness
        - tools/conformance/certification
        - spec/conformance/kernel
        - typescript/kernel/testkit
        - typescript/kernel/backends/postgres
        - rust/kernel-conformance-adapter
        - KRT-DF005
  - id: OD-25
    question: "ADR-0076 decision 4 lists the first checkpoint fault point as 'before any checkpoint write', while ADR-0082 decision 8 says a before-commit fault fires inside the backend transaction callback before COMMIT. Where does the certified before-commit point hold?"
    blocks: [KRT-DF003, KRT-DF004]
    options:
      - name: Hold after all checkpoint writes and before COMMIT
        pros:
          - "A write that escaped the transaction is visible on recovery, and no write can happen after the hold and before COMMIT, so this subsumes the earlier position."
          - "Matches ADR-0082 and the before-commit name in the operation catalog."
        cons:
          - "ADR-0076 decision 4 needs an amendment."
      - name: Hold before any checkpoint write, as ADR-0076 states
        pros:
          - "No ADR change."
        cons:
          - "Nothing has been written at the hold, so a crash there tests almost nothing, and no point holds between the last write and COMMIT."
          - "Contradicts ADR-0082."
    recommendation: Hold after all checkpoint writes and before COMMIT
    closure: ruling
    ruler: "Owner, after the EPIC-DF merge"
    status: proposed
    asked:
      date: 2026-11-01
      in: EPIC-DF
    proposed_by: EPIC-DF @ 2962a85
    interim:
      assumption: "Under a checkpoint selector, before-commit holds in the beforeCommit callback of the armed transaction, after all checkpoint writes."
      applied_by:
        - typescript/kernel/testkit/src/lib/durable-fault-control.ts
        - spec/conformance/kernel/kernel-process-crash-undetected.json
        - KRT-DF003
        - KRT-DF004
closeout:
  tickets_completed: [KRT-DF001, KRT-DF002, KRT-DF003, KRT-DF004, KRT-DF005]
  tickets_deferred: []
  points_completed: 28
  spec_patches: []
  changelog_entries:
    - directory: tasks
      type: added
      text: "EPIC-DF certified the TypeScript SQLite and PostgreSQL kernels under the durable profiles: kernel.persistent-reopen and kernel.process-crash for both, and kernel.shared-backend for PostgreSQL, alongside the kernel.memory certificates for TypeScript and Rust. The harness owns storage per check, supervises adapter process groups with survivor checks, holds blocking fault seams with receipts, and observes backend capabilities. Certification found and fixed a PostgreSQL clock-domain mix (OD-20) and a controls plan that encoded the memory kernel's clock domain. One run produces per-profile certificate bundles linked to per-profile control runs, and committed compatibility rows keep only source-bound digests that any checkout can recheck."
  candidate_terms: []
  routed_upstream:
    - stage: tech-spec
      item: "OD-25: amend ADR-0076 decision 4 so the first checkpoint fault point holds after all checkpoint writes and before COMMIT, matching ADR-0082 decision 8."
    - stage: tech-spec
      item: "OD-20: every kernel-stamped durable timestamp in a transaction comes from one transaction clock (tx.now on shared-lease-clock backends, otherwise the injected clock); record it against ADR-0050 and KrakenKernelSpecification section 5.2, and rule whether a backward-stepping backend clock rejects or clamps."
    - stage: tech-spec
      item: "OD-21: the crash-recovery plan asserts rollback at the intermediate checkpoint fault points; record that a port with separately durable checkpoint writes adds observed-durability branches exercised by that port (KrakenKernelSpecification section 5.5, ADR-0076)."
    - stage: tech-spec
      item: "OD-22: add the collect step (kernel.harness.collect, outcomes and byKind), steps[].process with spawn and handle-owned routing, setClock source server gated by clock.backend-server, and per-profile certificate bundles to the pinned plan and protocol sections of conformance-certification.md; amend ADR-0077 decision 5 so release order does not fix the winner across processes."
    - stage: tech-spec
      item: "The adapter protocol leaves the createInstance clock members, the processExit evidence field shape, and capture.default unspecified; specify them in conformance-certification.md."
    - stage: tech-spec
      item: "The collect closed schema rejects arbitrary native error details, and the commit-outcome-unknown error is omitted from the durable plans; decide whether collect admits catalogued details and whether commit-outcome-unknown needs an observed branch."
    - stage: tech-spec
      item: "The per-profile undetected registers (kernel-memory, kernel-persistent-reopen, kernel-process-crash, kernel-shared-backend under spec/conformance/kernel/) have no schema or authority-packet reference; specify one shape for all four."
    - stage: tech-spec
      item: "Lease expiry inclusivity (expiresAtMs equal to now) is undecided in the specification; the clock-skew plan avoids the boundary."
    - stage: tech-spec
      item: "The tuvren.kernel.protocol suite-level certified entries were removed for SQLite and PostgreSQL in favour of profile certificates; record that compatibility rows are keyed by profile and carry source-bound digests only, with implementation, harness, and control-run identity kept in the run-scoped ADR-0081 bundles."
  follow_ups:
    - "The legacy SQLite restart-recovery path in typescript/kernel/conformance-adapter still spawns kernel child processes for the unchanged legacy close-reopen plan; EPIC-DJ removes it with that plan."
    - "kernel.syscall.shared_writer.race has no detecting control: the PostgreSQL stale-head mutant activates in one writer process while the shared collect still observes one result and one error; design a cross-process mutant before kernel.shared-backend claims it as detected."
    - "kernel.syscall.clock_skew.expired has no designated negative control in the shared-backend profile."
    - "Three of the four kernel.process-crash claims (before_commit, after_turn_node_write_before_head, after_head_move_before_staging_clear) have no detecting control; only after_commit_before_ack does. A defective backend that commits checkpoint writes outside the transaction needs an autocommit SPI bridge or another storage mutation seam."
    - "Four of the six kernel.persistent-reopen claims (committed_state, checkpoint_lineage, recovery_head, completed_step) have no detecting control."
    - "Nothing observes that setClock source server really reads PostgreSQL: an adapter serving an injected backend clock under that source would pass. Compare against a clock the harness reads from the database it provisioned."
    - "assertProfileClaimInventory is one-way: a durable claim removed from a profile leaves its check outside the profile with no failure, unlike the strict memory inventory."
    - "The Rust certification executable is built outside the Nx cache so the certificate digests what ran; Cargo incremental builds keep it cheap, but a content-addressed Nx output would restore caching."
    - "Rust has no durable backend, so the durable profiles certify the TypeScript backends only."
