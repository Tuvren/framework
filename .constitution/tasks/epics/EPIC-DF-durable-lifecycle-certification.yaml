      - files:
          - typescript/kernel/runtime
          - .changeset/durable-transaction-clock.md
        justification: "Arming the fault capability exposed the PostgreSQL clock-domain defect; the OD-20 interim fix lives in the kernel runtime's transaction bodies and needs a changeset for @tuvren/kernel-runtime."
      - files: [typescript/kernel/protocol/src/lib/kernel-types.ts]
        justification: "Doc comments on the transaction clock and the grace-horizon clock state the OD-20 interim contract next to the types backends implement."
      - files:
