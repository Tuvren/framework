          - tools/conformance/meta-conformance/negative-controls.ts
        justification: "The controls checks asserted the memory kernel's clock domain for every backend; selecting the expectation from the observed BackendCapability descriptor needed a catalogued observation, a kernel.memory claim, bindings in every adapter that runs the plan including Rust, and fleet branch provenance for conditional coverage."
      - files:
          - tools/scripts/verify.ts
          - tools/scripts/verify-kernel.ts
        justification: "Real-adapter fault and certificate suites must be registered after the build phase."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence."
      - files: [reports/compatibility/project.json, tools/scripts/oxc-preparation.test.ts]
        justification: "PR review round 1: the compatibility check no longer needs the Rust build and waits for the authority generators it digests; a fixture excluded under an ignored TMPDIR was corrected."
    status: done
  - id: KRT-DF004
    title: Certify process-crash recovery on SQLite and PostgreSQL
    type: Feature
    effort: 5
    depends_on: [KRT-DF003]
    scope:
      in:
        - spec/conformance/kernel/plans
        - spec/conformance/kernel/negative-controls.json
        - tools/conformance/harness
        - typescript/kernel/testkit
    verification:
      command: bun run verify:kernel
      expected: "Exit 0; each crash check arms a point, receives the receipt, kills the process, respawns on the same storage, and passes recovery assertions; the incomplete-checkpoint mutant is killed."
    stop_conditions:
      - "STOP if a backend shows partial checkpoint state after a kill; record the implementation finding and keep the check red; do not improvise."
    description: "ADR-0076. Write a syscall version of crash-recovery-durable, beside the unchanged legacy plan, as process-crash traces: baseline checkpoint, arm with mode block, attempt, wait for the receipt, kill, respawn, reattach, recover through the public surface, and assert the all-or-nothing invariant with when-branches only for the uncertain-commit point. Add the durable mutant that exposes a new head with an incomplete checkpoint. Triage every failure."
    acceptance:
      mode: contract_test
      evidence: "Assert every supported point has a receipt followed by a forced death of the same epoch, recovery assertions pass or are triaged red, a missing receipt invalidates the run, and the incomplete-checkpoint mutant is killed."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    deviations:
      - files:
          - spec/kernel/authority-packet.json
          - spec/conformance/kernel/kernel-persistent-reopen-undetected.json
          - spec/conformance/kernel/kernel-process-crash-undetected.json
        justification: "The syscall crash-recovery plan must be registered in the kernel authority packet, and durable claims without a detecting control need recorded reasons."
      - files:
          - tools/schemas/conformance-plan.schema.json
          - tools/conformance/plan-compiler
        justification: "The pinned processExit assertion kind had no implementation; the plan schema and compiler must admit and validate it."
      - files:
          - typescript/kernel/conformance-adapter/src/host.ts
          - typescript/kernel/conformance-adapter/src/host-support.ts
          - typescript/kernel/conformance-adapter/adapter-sqlite-mutant.json
          - typescript/kernel/conformance-adapter/adapter-postgres-mutant.json
          - tools/conformance/meta-conformance
          - tools/conformance/certification/bundle-contract.test.ts
        justification: "Durable claims need durable negative controls: kernel mutants may now wrap the SQLite and PostgreSQL backends through non-certifying mutant manifests, and activation probes and profile-scoped control inventory must cover them without changing the strict kernel.memory inventory."
      - files:
          - tools/scripts/lib/conformance-contract.ts
          - tools/scripts/lib/conformance-contract.test.ts
          - tools/scripts/verify.ts
          - tools/scripts/verify-kernel.ts
          - .changeset/durable-crash-negative-control.md
        justification: "Checked-in evidence normalizes per-run process values, real-adapter crash suites run after the build phase, and the touched publishable packages need direct changesets."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence."
    status: done
  - id: KRT-DF005
    title: Certify the shared backend profile with two-process races and clock skew
    type: Feature
    effort: 5
    depends_on: [KRT-DF004]
    scope:
      in:
        - spec/conformance/kernel
        - tools/conformance/harness
        - typescript/kernel/conformance-adapter
        - typescript/kernel/testkit
        - tools/conformance/certification
        - reports/compatibility/evidence/certification-harness.kernel-typescript-sqlite-certification.json
        - reports/compatibility/evidence/certification-harness.kernel-typescript-postgres-certification.json
    verification:
      command: bun run verify:kernel
      expected: "Exit 0; two adapter processes race on one PostgreSQL storageRef with entry receipts, clock-skew preemption follows the backend clock, and the persistent-reopen, process-crash, and shared-backend profiles produce certificates."
    stop_conditions:
      - "STOP if PostgreSQL cannot provide a backend-authoritative clock observation; record a specification finding; do not improvise."
    description: "ADR-0076 and ADR-0077. Run the concurrent-writer check from two processes on one PostgreSQL storageRef, write a syscall version of clock-skew preemption with setClock on the worker domain against the backend clock, add the worker-clock expiry mutant, write the kernel.persistent-reopen, kernel.process-crash, and kernel.shared-backend profiles, claim them for SQLite and PostgreSQL as applicable, and emit their certificates."
    acceptance:
      mode: contract_test
      evidence: "Assert the two-process race needs both receipts before release, the worker-clock mutant is killed, and SQLite and PostgreSQL certificates validate with matching control runs."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - tools/schemas/conformance-plan.schema.json
          - tools/conformance/adapter-protocol
          - tools/conformance/plan-compiler
          - spec/kernel/authority-packet.json
        justification: "OD-22 interim: the collect step, process routing with spawn and createInstance, and setClock source server are additive plan and protocol shapes that the plan schema, protocol schema, and compiler must admit and validate; the new syscall plans are registered in the kernel authority packet."
      - files:
          - typescript/kernel/backends/postgres
          - rust/kernel-conformance-adapter
          - typescript/kernel/protocol/test/kernel-certification-authority.test.ts
        justification: "The PostgreSQL backend serves the real server clock when no clock is injected; every adapter that runs the clock plans answers source server, including Rust with clock_source_unsupported; the kernel certification authority test recognizes the new control operations."
      - files:
          - tools/scripts/verify.ts
          - tools/scripts/verify-kernel.ts
          - tools/scripts/lib/conformance-contract.ts
          - .changeset
        justification: "Real-adapter two-process suites run after the build phase, checked-in evidence normalizes per-process values, and touched publishable packages need direct changesets."
      - files:
