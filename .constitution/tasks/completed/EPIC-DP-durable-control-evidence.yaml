      text: "EPIC-DP bound durable control evidence to certificates. The harness verifies a setClock source=server selection against the provisioned PostgreSQL clock, bracketing the plan's own thread creation. Profile claim inventories are checked in both directions with explicit ownership of shared checks. The four undetected registers have a pinned schema (tools/schemas/certification-undetected-register.schema.json), are referenced from the kernel packet's undetectedRegisters, and enter verifier-authority provenance. Every certificate and compatibility row lists undetectedClaims, [] for the durable rows. Control kills and report validity are evaluated per implementation with a post-mutant baseline and the observed conditional branch; Rust leaves the certified fleet until EPIC-DS while keeping its positive lane and 13/3/10 diagnostic."
  candidate_terms: []
