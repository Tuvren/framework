tickets:
  - id: KRT-DP001
    title: Verify the adapter server clock against the provisioned database
    type: Feature
    effort: 3
    depends_on: []
    scope:
      in:
        - tools/conformance/harness/storage-resource.ts
        - tools/conformance/harness/run.ts
        - tools/conformance/harness/test/server-clock-verification.test.ts
        - tools/scripts/verify-kernel.ts
        - tools/scripts/verify.ts
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0 with the operator-provided PostgreSQL service; real and deliberately wrong clock observations are distinguished."
    stop_conditions:
      - "STOP if the comparison needs the harness to start or stop PostgreSQL, or no meaningful clock bound can be measured; route the finding."
    description: "Compare the setClock source server observation with a clock read by the harness from the PostgreSQL database it provisioned. Bound the comparison with measured request timing instead of comparing adapter values to themselves. The existing resource manager is tools/conformance/harness/storage-resource.ts. Neither verify lane discovers harness tests: register the new test in the hand-maintained lists in tools/scripts/verify-kernel.ts and tools/scripts/verify.ts, as EPIC-DO had to for durable-control-mutants.test.ts. Do not schedule it concurrently with tools/conformance/harness/test/durable-instance.test.ts, which fails when another lane creates databases on the same PostgreSQL server."
    acceptance:
      mode: contract_test
      evidence: "A real PostgreSQL server-clock observation falls within the harness-measured interval, while an adapter returning an injected or shifted worker clock fails; the harness provisions and releases the same resource."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: done
    deviations:
      - files: [tools/conformance/harness/test/fixtures/server-clock-proxy.ts]
        justification: "The contract test needs an adapter whose backend clock is injected or shifted so the harness bound can be shown to reject it. The proxy is a test-local fixture beside server-clock-verification.test.ts, inside the harness test directory but outside the ticket's listed files; the wave plan's M1 assignment authorized test-local helpers there."
  - id: KRT-DP002
    title: Enforce the durable profile claim inventory in both directions
    type: Feature
    effort: 3
    depends_on: [KRT-DP001]
    scope:
      in:
        - tools/conformance/certification
        - tools/conformance/meta-conformance
        - tools/conformance/harness/test/durable-claims.test.ts
    verification:
      command: bun run verify
      expected: "Exit 0; tools/conformance/certification/profile.test.ts and tools/conformance/harness/test/durable-claims.test.ts pass, and both run only in this lane."
    stop_conditions:
      - "STOP if profile ownership cannot be determined without guessing or dropping an applicable claim; route the contract question."
    description: "Make assertProfileClaimInventory compare applicable plan claims and profile claimIds in both directions, with explicit ownership for shared checks. Its present one-way check is in tools/conformance/certification/profile.ts. tools/conformance/harness/test/durable-claims.test.ts already exercises the one-way direction for kernel.persistent-reopen. Since EPIC-DO it also asserts empty durable registers for the 13 durable claims and proves a gap by removing a claim's control designations (guidelines 5.10 rule 10). Keep it consistent with the two-way inventory."
    acceptance:
      mode: contract_test
      evidence: "Tests fail when a required plan claim is removed from a profile or when a profile names a missing claim, and accept the exact inventory for each durable profile."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: done
  - id: KRT-DP003
    title: Schema and reference the undetected registers
    type: Feature
    effort: 3
    depends_on: [KRT-DP002]
    scope:
      in:
        - tools/schemas
        - tools/scripts/conformance
        - tools/conformance/meta-conformance
        - tools/conformance/certification
        - spec/kernel/authority-packet.json
        - tools/conformance/harness/test/durable-claims.test.ts
        - reports/compatibility
    verification:
      command: bun run verify
      expected: "Exit 0; the register, claim-coverage, and durable-claims tests pass, and compatibility:check accepts the committed evidence at this ticket's commit."
    stop_conditions:
      - "STOP if the packet cannot represent the four profiles without inventing a second authority; route a contract change."
    description: "Create tools/schemas/certification-undetected-register.schema.json and reference each existing profile register from spec/kernel/authority-packet.json as ADR-0084 and the contract companion specify. Validate claim membership and stale detected entries, and include the selected register in verifier-authority digests. Since EPIC-DO the persistent-reopen, process-crash, and shared-backend registers are {}, and only kernel-memory-undetected.json has entries. tools/conformance/harness/test/durable-claims.test.ts reads the durable registers by path and asserts they stay empty; keep it passing when register resolution moves to the packet. The new schema and packet reference change verifier-authority digests, so refresh the committed compatibility evidence in this ticket rather than leaving intermediate commits stale as happened in EPIC-DO."
    acceptance:
      mode: contract_test
      evidence: "Valid empty and populated registers pass; malformed reasons, unknown claims, stale detected claims, missing profile references, and register digest drift fail. All four existing registers are resolved through the packet."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: done
  - id: KRT-DP004
    title: List undetected claims in every certificate
    type: Feature
    effort: 3
    depends_on: [KRT-DP003]
    scope:
      in:
        - tools/schemas
        - tools/scripts/conformance
        - tools/scripts/lib/conformance-contract.ts
        - tools/conformance/certification
        - tools/conformance/meta-conformance
        - reports/compatibility
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0 with the operator-provided PostgreSQL service; the certificate contract tests pass and compatibility:check accepts the regenerated certificates."
    stop_conditions:
      - STOP if a certificate can silently omit a profile gap or the evidence schema cannot represent its reason.
    description: "Extend the evidence schema and bundle assembly to include each profile register as claimId and reason entries, including an explicit empty list (ADR-0081 decision 3, ADR-0084 decision 6). The current certificate schema and link are tools/schemas/certification-evidence.schema.json and tools/conformance/certification/control-link.ts. Since EPIC-DO the three durable registers are {}, so every TypeScript SQLite and PostgreSQL certificate for kernel.persistent-reopen, kernel.process-crash, and kernel.shared-backend must carry an explicit empty undetectedClaims list. The kernel.memory certificates list the remaining memory entries. KRT-DO007 recorded that the committed bundles do not yet serialize the list; regenerate them in this ticket."
    acceptance:
      mode: contract_test
      evidence: "Round-trip certificates with empty and nonempty registers; reject omitted, altered, or unrelated claims and verify the register is covered by verifier-authority provenance. A certificate whose register is empty serializes undetectedClaims as an explicit empty list, and a certificate without the field fails schema validation. The committed SQLite and PostgreSQL durable-profile certificates in reports/compatibility carry undetectedClaims: [], and the committed kernel.memory certificates list every kernel-memory-undetected.json entry with its reason."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: done
  - id: KRT-DP005
    title: Require implementation-matched control evidence and a post-mutant baseline
    type: Feature
    effort: 3
    depends_on: [KRT-DP004]
    scope:
      in:
        - tools/conformance/certification
        - tools/conformance/meta-conformance
        - tools/schemas
        - tools/scripts/conformance
        - reports/compatibility
        - tools/scripts/compatibility-report.ts
    verification:
      command: bun run conformance
      expected: "Exit 0; the scoped conformance and negative-control assertions pass."
    stop_conditions:
      - "STOP if the same configuration cannot be identified, a failure can be misclassified as a kill, or the fleet cannot honestly withhold Rust while its reproductions are pending; route the issue."
    description: "Change tools/conformance/certification/control-link.ts so control kills and report validity are evaluated per implementation rather than unioned across fleet reports with reports.every(validReport). Preserve identity, adapter-manifest, profile, and configuration matching and require a post-mutant designated-check baseline. A host certificate requires only the conditional branch selected by the backend's observed capability; fleet-wide coverage of both branches remains release-CI evidence about the plans under ADR-0079 decision 4. Remove Rust from certified-projects.json's certified list until DS, retaining its inventory, positive conformance lane, and negative-control diagnostic. Remove its compatibility certificate row and keep the suite result in the matrix implementations section. Update bundle-contract.test.ts (the Rust adapter list and --require-certified assertions), certification-manifest.test.ts, compatibility-certificates.ts, tools/scripts/compatibility-report.ts, and tools/conformance/meta-conformance/rust-memory.test.ts. Require the in-process control statement only for published-testkit certificates. Out-of-tree hosts cannot declare tagged controls unsupported."
    acceptance:
      mode: contract_test
      evidence: "Mismatched identity, manifest, profile or authority, a substituted memory run, a missing rerun, and invalid or surviving required controls withhold certification. Test both directions: Rust cannot borrow TypeScript kills, and an invalid or unsupported Rust report cannot invalidate TypeScript's link. A host with either observed capability evaluates its selected conditional branch and certifies without evaluating the other; missing the selected branch fails. Rust has no certified entry or matrix certificate row, while its positive suite remains in implementations and its diagnostic retains the original subset of 13 controls, 3 kills, and 10 unsupported until DS; subsequent new mutants extend the inventory with explicit unsupported reasons. Matching published-testkit certificates disclose in-process control execution."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    status: done
