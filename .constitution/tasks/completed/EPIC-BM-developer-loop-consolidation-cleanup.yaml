  - id: KRT-BM007
    title: Workspace Manifest Hygiene
    type: Chore
    effort: 2
    depends_on: []
    category: Tech-Debt
    scope:
      in:
        - TODO
    verification:
      command: bun run nx run backend-sqlite:build
      expected: exit 0 for each command listed.
    description: "(a) Extract the shared tsc --project <tsconfig> && mkdir -p <dir>/migrations && cp migrations/*.sql <dir>/migrations/ pipeline out of backend-sqlite's build, bench, retention-dry-run, and test target command strings into one tools/scripts/ helper script parameterized by target output dir and tsconfig, per the repo rule to keep shared command logic in scripts rather than duplicating shell snippets across project.json files. (b) Confirm and, if needed, correct @tuvren/runner-react's placement in typescript/providers/bridge-ai-sdk/package.json (test-only usage belongs in devDependencies). (c) Align typescript/sdk/package.json's zod peer range with the exact-pin convention (4.4.3) used by sibling packages, or explicitly document why the SDK surface needs a caret range if that turns out to be intentional\n\nResolution Notes:\n(a) The duplicated compile+copy-migrations pipeline across backend-sqlite's `build`/`bench`/`bench-load-cost`/`retention-dry-run`/`test` targets now routes through `tools/scripts/compile-with-migrations.ts` (parameterized by `--tsconfig`, `--out`, optional `--clean`). `bench-load-cost` was included because it carried the identical inline pipeline the audit flagged on its four named siblings."
    acceptance:
      mode: gherkin
      evidence: |-
        Feature: Workspace manifests avoid duplicated pipelines and inconsistent pins

          Scenario: sqlite backend targets share one migrations-copy helper
            Given backend-sqlite's build, bench, retention-dry-run, and test targets
            When their project.json command strings are inspected
            Then the compile+copy-migrations logic is invoked via one shared script
            And each target still produces its migrations directory correctly

          Scenario: runner-react dependency placement matches its usage
            Given @tuvren/runner-react is used only by bridge-ai-sdk's tests
            When typescript/providers/bridge-ai-sdk/package.json is inspected
            Then @tuvren/runner-react appears under devDependencies, not dependencies
            And "bun run nx run providers-bridge-ai-sdk:build" still exits 0

          Scenario: zod peer range matches the workspace pin convention
            Given sibling packages pin "zod" to an exact version
            When typescript/sdk/package.json's zod peerDependency is inspected
            Then it either matches the exact-pin convention or documents why not
    flows: []
    certainty: assumed
    status: done
  - id: KRT-BM008
    title: Kraken-Alias Cleanup + Public-Surface Lint Guard
    type: Chore
    effort: 2
    depends_on: []
    category: Tech-Debt
    scope:
      in:
        - TODO
    verification:
      command: bun run nx run framework-runtime:typecheck
      expected: exit 0 for all three; the new lint guard, when temporarily pointed at a deliberately reintroduced Kraken* public export in a scratch/local test, fails loudly (confirmed during implementation, not shipped).
    description: Drop the local as Kraken* import aliases across typescript/runtime/src/ and its test helpers, using the underlying public names (RuntimeRunner, RuntimeRunnerFactory, RuntimeKernel, etc.) directly. Add an automated guard (lint rule or a small validation script wired into bun run lint or bun run codegen) that scans each package's public index.ts/entrypoint exports and fails if any exported symbol name contains Kraken, keeping the public-surface cleanliness the audit found today permanent rather than incidental
    acceptance:
      mode: gherkin
      evidence: |-
        Feature: Kraken-only naming stays internal and enforced

          Scenario: Runtime source no longer locally aliases public types to Kraken names
            Given typescript/runtime/src/lib/runner-registry.ts and its sibling files
            When their import statements are inspected
            Then no "as Kraken*" local alias remains for a publicly-named type
            And "bun run nx run framework-runtime:typecheck" still exits 0

          Scenario: The public-surface guard catches a reintroduced Kraken export
            Given a package's public index.ts is modified to export a Kraken*-named symbol
            When the lint guard runs
            Then it fails loudly, naming the offending package and export

          Scenario: The public-surface guard passes on the current, clean surface
            Given the current state of every package's public index.ts
            When the lint guard runs
            Then it exits 0, confirming no Kraken*-named symbol is publicly exported
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files:
          - package.json
          - tools/scripts/kraken-surface-gate.ts
        justification: ":** root `package.json` (lint script), in addition to the runtime sources/test helpers and the new `tools/scripts/kraken-surface-gate.ts`."
  - id: KRT-BM009
    title: Small-Findings Sweep
    type: Chore
    effort: 1
    depends_on: []
    category: Docs
    scope:
      in:
        - TODO
    verification:
      command: bun run lint
      expected: exit 0 for bun run lint; the services-up-then-verify-kernel sequence completes without a "connection refused"/"database not ready" failure.
    description: "(a) Add a doc comment on detachPromise (runtime-core-shared.ts:149) stating explicitly that callers/callees must route their own errors — this function intentionally swallows the promise's rejection to prevent an unhandled-rejection crash, and is not itself an error-handling mechanism. (b) Add the two-line Nix/direnv prerequisite step to README.md's Quickstart, ahead of today's step 1 (direnv allow), mirroring what ci.yml:119-134 does explicitly (install Nix, then install devenv) for a reader who has neither installed yet. (c) Verify whether docs/perf-benchmarks.md's only retired-name reference (framework-runtime-core, lines 51-55) is already adequately annotated as historical; if so, close this sub-item as already-resolved, otherwise fix whatever unannotated stale name is actually found. (d) Add a Postgres readiness wait (e.g. a bounded pg_isready-style poll) to tools/scripts/services-up.sh after devenv up -d succeeds, so the script itself does not return until the database is ready to accept connections, without violating the \"never embed in Nx targets/runners\" constraint already documented in the script's own header comment\n\nResolution Notes:\n(c) Closed as already-resolved per the ticket's STOP condition: `docs/perf-benchmarks.md`'s only retired-name reference (`framework-runtime-core`, lines 51-55) is already a deliberate, self-annotating historical footnote (\"left as originally recorded rather than fabricating a re-run\"); no unannotated stale name was found elsewhere in the file, so the passage was preserved as-is."
    acceptance:
      mode: gherkin
      evidence: |-
        Feature: Small documentation and readiness findings are resolved

          Scenario: detachPromise's contract is documented
            Given runtime-core-shared.ts's detachPromise function
            When its doc comment is read
            Then it states the callee must route its own errors
            And this documents existing behavior with no functional change

          Scenario: README quickstart includes the Nix/direnv prerequisite
            Given a reader with neither Nix nor direnv installed
            When they follow README.md's Quickstart from the top
            Then they are told how to install Nix and direnv before "direnv allow"
            And the steps mirror what ci.yml's setup steps perform

          Scenario: perf-benchmarks.md's retired-name reference is resolved or confirmed
            Given docs/perf-benchmarks.md's historical footnote on framework-runtime-core
            When the file is reviewed against the audit's "one retired package name" finding
            Then either the footnote is confirmed as already sufficient and closed as-is
            Or the actually-stale unannotated reference is corrected

          Scenario: services:up waits for Postgres readiness
            Given "bun run services:up" has just reported success
            When a Postgres-backed command runs immediately afterward
            Then the database accepts connections without a startup race
            And services-up.sh remains a manual, top-level-only convenience script
    flows: []
    certainty: assumed
    status: done
