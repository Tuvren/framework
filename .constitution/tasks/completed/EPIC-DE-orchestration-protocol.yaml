tickets:
  - id: KRT-DE001
    title: Run operations through handles on a concurrent stdio host
    type: Feature
    effort: 5
    depends_on: []
    scope:
      in:
        - tools/conformance/harness
        - tools/conformance/adapter-protocol
        - typescript/kernel/conformance-adapter
    verification:
      command: bun run conformance
      expected: "Exit 0; startOperation, awaitOperation, and cancelOperation work against the TypeScript kernel adapter and the host answers requests while operations run."
    stop_conditions:
      - "STOP if concurrency in the host changes the result of any existing serial check; do not improvise."
    description: "ADR-0077 decision 1. Make the reference TypeScript stdio host process requests concurrently with one response per id, add operation handles to the runner and the TypeScript kernel adapter, and keep blocking dispatch for unmigrated plans."
    acceptance:
      mode: contract_test
      evidence: "Assert two started operations progress independently, an inspectState request is answered while an operation is blocked, and existing serial plans keep their results."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - tools/conformance/plan-compiler/certification-rules.ts
          - tools/conformance/plan-compiler/handle-rules.ts
          - tools/conformance/plan-compiler/handle-steps.test.ts
          - tools/conformance/plan-compiler/index.ts
          - tools/schemas/conformance-plan.schema.json
        justification: "start, await, and cancel are new plan step kinds with handle captures; the plan compiler and plan schema must admit and validate them, including the review-required rules that start and cancel steps carry no assertions and cancellation follows an entry receipt."
      - files:
          - tools/scripts/conformance/certification-schema-examples.ts
          - tools/scripts/conformance/certification-schemas.test.ts
          - tools/scripts/verify.ts
        justification: "The certification schema examples and the verify gate's acceptance-suite registry enumerate protocol shapes and regression suites; both must include the handle runner and compiler suites."
      - files:
          - spec/conformance/kernel/plans/kernel-concurrent-writer-syscall.json
        justification: The M1 review fix pinned handle captures in the race plan that KRT-DE003 had introduced.
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence because verify:kernel and certification parity check its freshness."
    status: done
  - id: KRT-DE003
    title: Certify racing writers with entry receipts and barriers
    type: Feature
    effort: 5
    depends_on: [KRT-DE001]
    scope:
      in:
        - spec/conformance/kernel/plans
        - spec/conformance/kernel/negative-controls.json
        - typescript/kernel/testkit
        - typescript/kernel/conformance-adapter
        - tools/conformance/harness
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0; the concurrent-writer check passes on the TypeScript memory kernel only when both contenders reached the native seam before release, in both orderings, and the stale-head mutant is killed."
    stop_conditions:
      - "STOP if the barrier seam must sit inside an exclusive lock to hold both contenders; record the design gap; do not improvise."
    description: "ADR-0077 decision 5. Add a reviewed barrier seam in the testkit's persistence path that emits implementation-entry receipts and holds contenders until released. Write a syscall version of the concurrent-writer checks, beside the unchanged legacy plan, that establishes a common head, start both contenders, wait for both receipts, release, and assert one success, one typed lateral conflict, and the head equal to the winner, in both orderings. The syscall plan uses no race composite or derived booleans. Legacy composite handlers stay in place for the unchanged legacy plans until DJ retires them; syscall bindings are added beside them."
    acceptance:
      mode: contract_test
      evidence: "Assert the check fails when contenders run sequentially (no second receipt before release), passes on the TypeScript memory kernel in both orderings, and kills the stale-head mutant."
    flows: [flow-authority-packet-driven-conformance]
    certainty: assumed
    deviations:
      - files:
          - tools/conformance/plan-compiler/barrier-rules.ts
          - tools/conformance/plan-compiler/barrier-rules.test.ts
          - tools/conformance/plan-compiler/certification-rules.ts
          - tools/conformance/plan-compiler/index.ts
          - tools/schemas/conformance-plan.schema.json
        justification: "Barrier steps (arm, wait, release) are new plan step kinds; the plan compiler and plan schema must admit and validate them, or the syscall concurrent-writer plan cannot compile."
      - files:
          - spec/conformance/kernel/operations.json
          - spec/conformance/kernel/fixtures/concurrent-writer
          - spec/kernel/authority-packet.json
        justification: "The barrier control operations need catalog entries with closed observation schemas, the race needs its fixtures, and the new syscall plan must be registered in the kernel authority packet beside the unchanged legacy plan."
      - files:
          - tools/scripts/verify.ts
          - typescript/kernel/protocol/test/kernel-certification-authority.test.ts
        justification: "The verify gate and the kernel authority test enumerate registered certification plans and acceptance suites; both must include the new plan and its regression suites."
      - files:
          - tools/conformance/plan-compiler/control-input.ts
          - tools/conformance/adapter-protocol/index.ts
          - tools/conformance/adapter-protocol/protocol.md
          - tools/conformance/adapter-protocol/protocol.schema.json
          - tools/conformance/adapter-protocol/stdio-host.ts
        justification: "Review of the race found that runner-injected barrier participant names broke the pinned startOperation contract because catalogued input validation skipped handle steps; the fix validates start inputs in the compiler and gives the shared stdio host a typed adapter_method_not_implemented answer for 0.2.0 method families an adapter does not claim (OD-18)."
      - files:
          - tools/scripts/compatibility-report.ts
          - tools/scripts/lib/conformance-contract.test.ts
        justification: "The compatibility topology reader ignored the protocol-version exclusion the runner applies, so once Rust claimed kernel.barrier the freshness check and the certified run disagreed; both now share the runner's check selection."
      - files: [".changeset"]
        justification: "The private TypeScript testkit barrier API changed; the changeset records it for CI's changeset check."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence because verify:kernel and certification parity check its freshness."
    status: done
  - id: KRT-DE005
    title: Bring the Rust kernel adapter to protocol 0.2 and the writer race
    type: Feature
    effort: 5
    depends_on: [KRT-DE003]
    scope:
      in: [rust/kernel, rust/kernel-conformance-adapter]
    verification:
      command: bun run conformance
      expected: "Exit 0; the Rust adapter serves operation handles concurrently and the concurrent-writer check passes or is triaged against the Rust kernel."
    stop_conditions:
      - "STOP if the Rust kernel cannot run two writers concurrently in one process; record the implementation finding; do not improvise."
    description: "ADR-0077. Make the Rust adapter host concurrent, bind startOperation, awaitOperation, and cancelOperation, add a test-only barrier seam in the Rust in-memory persistence path, and run the concurrent-writer checks. Triage every failure."
    acceptance:
      mode: contract_test
      evidence: "Assert the Rust adapter answers requests while operations run, both contenders reach the seam before release, and each failure has a triage entry."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - spec/conformance/kernel/plans/kernel-concurrent-writer-syscall.json
          - spec/conformance/kernel/negative-controls.json
          - tools/conformance/plan-compiler/barrier-rules.ts
          - tools/conformance/plan-compiler/barrier-rules.test.ts
          - typescript/kernel/testkit/src/lib/kernel-barrier-control.ts
          - typescript/kernel/conformance-adapter/test/concurrent-writer-syscall.test.ts
          - typescript/kernel/conformance-adapter/test/operation-handles.test.ts
        justification: "Review of the Rust race showed both orderings were the same experiment because release discarded list order, and that a non-participant start under an armed barrier would hang. Fixing that required the shared plan's release order, a compiler rule, aligned cancellation outcomes in the TypeScript testkit, and removal of two dead designations and a self-asserting test."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence is refreshed with bun run compatibility:evidence because verify:kernel and certification parity check its freshness."
    status: done
  - id: KRT-DE006
    title: Certify the TypeScript and Rust memory kernels under kernel.memory
    type: Feature
    effort: 5
    depends_on: [KRT-DE003, KRT-DE005]
    scope:
      in:
        - spec/conformance/kernel/profiles.json
        - spec/kernel/authority-packet.json
        - tools/conformance/certification
        - tools/conformance/harness
        - tools/conformance/plan-compiler
        - tools/conformance/meta-conformance
        - typescript/kernel/conformance-adapter
        - rust/kernel-conformance-adapter
        - reports/compatibility/evidence/certification-harness.kernel-typescript-certification.json
        - reports/compatibility/evidence/certification-harness.kernel-rust-certification.json
    verification:
      command: "bun run verify:kernel"
      expected: "Exit 0; the kernel.memory profile with its full claim set (including the barrier-proven writer race) is enforcing, the negative-control gate is enforcing for it, and the TypeScript and Rust memory kernels produce complete certificate bundles or triaged red checks."
    stop_conditions:
      - "STOP if any kernel.memory claim has no designated detecting control and no recorded reason; do not improvise."
    description: "ADR-0079 decision 4 and ADR-0081. Write spec/conformance/kernel/profiles.json with kernel.memory over the syscall plans, make compiler rules and the negative-control gate enforcing for them, claim the profile in the TypeScript memory and Rust adapter manifests, and emit both certificate bundles with digests and the matching control run. Publish the TypeScript and Rust disagreement report in this ticket's evidence."
    acceptance:
      mode: contract_test
      evidence: "Assert a claimed profile with a non-applicable required check fails, both certificates validate against tools/schemas/certification-evidence.schema.json with control runs matching every verifier digest, every kernel.memory claim has a detecting control or a recorded reason, and the disagreement report is captured."
    flows: [flow-multi-implementation-conformance-compatibility]
    certainty: assumed
    deviations:
      - files:
          - spec/conformance/kernel/operations.json
          - spec/conformance/kernel/plans/kernel-protocol-extended.json
          - go/kernel-conformance-adapter
          - python/kernel-conformance-adapter
          - dart/kernel-conformance-adapter
        justification: "OD-19 interim: the legacy edge-validation composite moves to kernel.edge-validation.composite, and every adapter that binds it claims the new capability so no adapter loses legacy coverage; the catalog also carries the in-process barrier release-order semantics from the OD-17 interim."
      - files:
          - spec/conformance/kernel/negative-controls.json
          - spec/conformance/kernel/plans/kernel-concurrent-writer-syscall.json
          - spec/conformance/kernel/plans/kernel-restart-recovery-syscall.json
          - spec/conformance/kernel/plans/kernel-protocol-extended-syscall.json
          - spec/conformance/kernel/plans/kernel-protocol-core-syscall.json
          - spec/conformance/kernel/fixtures/kernel-protocol-turn-tree.bytes.json
          - tools/conformance/adapter-protocol/protocol.md
        justification: "The enforcing fleet branch-coverage gate showed 27 conditional assertions guarding outcomes the harness schedule fixes; they became unconditional assertions of the outcome the authority determines, designations followed, the turn-tree plan's map projection moved to the catalogued encoding, and disagreement triage added canonical turn-node identity validation."
      - files:
          - tools/scripts/conformance.ts
          - tools/scripts/compatibility-report.ts
          - tools/scripts/verify-kernel.ts
          - tools/scripts/verify.ts
          - rust/kernel-certification/project.json
        justification: "The conformance lane must honor the negative-control gate and require matching certificates, compatibility topology must recognize profile verification checks, the kernel and release gates must run the certificate contract and new acceptance suites, and the Rust certificate must digest a built executable that an Nx target produces."
      - files:
          - tools/schemas/conformance-operation-catalog.schema.json
          - tools/scripts/conformance/certification-schema-examples.ts
          - tools/scripts/conformance/certification-schemas.test.ts
        justification: "Review required the in-process barrier release-order guarantee to be machine-readable rather than protocol prose, so the operation catalog schema gains a closed barrierReleaseOrder contract, and the schema examples and their test pin it."
      - files: [reports/compatibility]
        justification: "Generated compatibility evidence for every kernel adapter is refreshed with bun run compatibility:evidence after the capability split and profile handshake changes."
    status: done
closeout:
  tickets_completed: [KRT-DE001, KRT-DE003, KRT-DE005, KRT-DE006]
  tickets_deferred: []
  points_completed: 20
  spec_patches: []
  changelog_entries:
    - directory: tasks
      type: added
      text: "EPIC-DE certified the TypeScript and Rust memory kernels under the enforcing kernel.memory profile. Adapter protocol 0.2.0 runs operations through handles on concurrent stdio hosts in both languages. A writer race is proven with transaction-entry barriers, list-ordered release, and the harness-independent stale-head mutant (kernel.accept-stale-head-update, which validates and commits in separate transactions). 27 schedule-fixed conditional assertions became unconditional authority outcomes, and the fleet branch-coverage and claim-coverage gates enforce. Complete certificate bundles are linked to a digest-matched control run. The TypeScript-Rust comparison shows no disagreement. Splitting edge-validation from its legacy composite let Rust claim it with no adapter losing coverage."
  candidate_terms: []
  routed_upstream:
    - stage: tech-spec
      item: "OD-17: the memory kernels apply the branch-head compare-and-set under a per-scope exclusive lock, so the writer race certifies overlapping transaction entry and, with list-ordered in-process release, an outcome equal to sequential writes in release order; rule whether that is the certified claim or whether kernel locking should change."
    - stage: tech-spec
      item: "OD-18: the pinned adapter protocol 0.2.0 section lists subscriptions, pull, and openInstance; record that the version admits the wire surface and capabilities plus storage kind bind each method family, and the additive ProtocolErrorCode adapter_method_not_implemented, in conformance-certification.md."
    - stage: tech-spec
      item: "OD-19: record kernel.edge-validation (observable syscall rejection) versus kernel.edge-validation.composite (legacy handler surface retiring in EPIC-DJ) in the conformance contract and the ADR-0081 consequences."
    - stage: tech-spec
      item: "The operation catalog gained a closed barrierReleaseOrder contract on kernel.barrier.release (in-process seams release to the serialization point in list order); add it to the pinned plan-extension and catalog sections of conformance-certification.md."
    - stage: tech-spec
      item: "Cancelling or destroying an operation held at a barrier returns an outer adapter_host_error in both languages, which the runner classifies as adapter_protocol, so no cancel-at-gate plan can pass; decide the protocol-level cancellation outcome before any plan uses cancel (ADR-0077 decision 6)."
    - stage: tech-spec
      item: "spec/conformance/kernel/kernel-memory-undetected.json is new cross-implementation authority (the kernel.memory claims allowed to lack a detecting control, with reasons) without a schema, an authority-packet or profile reference, or an entry in conformance-certification.md; specify it, and have tooling flag a reason that goes stale once a control detects its claim."
  follow_ups:
    - "Ten kernel mutants still have no Rust reproduction (including the stale-head race mutant), so the fleet kill of those claims rests on TypeScript alone; Rust certifies by pooled fleet controls under ADR-0079 decision 4."
    - "The three after-commit-before-ack claims are detected only by the fault-seam-never-fires instrumentation control; add a behavioral mutant."
    - "The conditional-branch coverage gate now has zero required assertions; it remains enforcing for future conditional assertions."
    - "kernel.accept-noncanonical-cbor and kernel.resolve-object-across-scopes are required kernel.memory controls (ADR-0079: every manifest mutant is killed for a migrated profile) but designate only legacy assertions; before EPIC-DJ retires those plans they need syscall designations (codec under OD-16) or the profile change ADR-0079 would require."
    - "Sanctioned comparison rules still live in tools/conformance/meta-conformance/observation-comparison.ts apart from the catalog-derived error-details rule; move the rest into per-operation catalog metadata."
    - The process-local node_modules digest cache does not detect an in-place change to a non-workspace dependency during one process.
    - "Tokio and Serde resolve to 1.53.1 and 1.0.229 in Cargo.lock while tech-spec guidelines name 1.52.1 and 1.0.228; run derive --write after merge."
  code_decisions:
    - summary: "Start steps capture opaque operation handles with handleCapture; start and cancel receipts never enter observations, assertions, or evidence; checks with handle steps require protocol 0.2.0 and are excluded with a reason for 0.1.0 manifests."
      kind: contract_shape
      paths:
        - tools/conformance/harness/operation-steps.ts
