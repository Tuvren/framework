      commit: 06c8309
    - summary: "ProtocolErrorCode adds operation_cancelled_before_entry, adapter_instance_busy, and adapter_method_not_implemented; destroy closes owned barriers and drains in-flight work with a 1000 ms deadline per stage; correlated malformed frames reject only their request."
      kind: contract_shape
      paths:
        - tools/conformance/adapter-protocol/protocol.schema.json
        - tools/conformance/adapter-protocol/stdio-host.ts
        - rust/kernel-conformance-adapter/src/host_stdio.rs
      commit: 8f5e4bb
    - summary: "Barriers hold every started operation entering their seam at transaction entry, emit receipts with the entering operation handle, and release named handles in list order to the serialization point; the compiler rejects non-participant starts while a barrier is armed."
      kind: pattern
      paths:
        - typescript/kernel/testkit/src/lib/kernel-barrier-control.ts
        - rust/kernel/src/testkit/barrier.rs
