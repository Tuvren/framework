        justification: "Three groups of out-of-scope touches, each necessary to satisfy the ticket's own Description/Gherkin without weakening screening semantics"
  - id: KRT-BK005
    title: Guardrail Gate Command Execution Hardening
    type: Security
    effort: 2
    depends_on: []
    category: Security
    scope:
      in: [tools/scripts/authority-guardrails/authority-guardrails.ts, spec/kernel/authority-packet.json]
    verification:
      command: bun run check
      expected: exit 0
    description: "runRegenerateCommand currently executes manifest-owned regenerateCommand strings via spawn(command, { shell: true }), validated only for non-emptiness, inside bun run check/verify on every contributor machine and in CI. A pull request editing a checked-in JSON manifest field can execute arbitrary shell with metacharacter interpretation. Replace shell-string execution with argv-array execution (parsing the manifest command into a program plus arguments, no shell interpretation) restricted to an allowlisted command-prefix set, preserving every legitimate multi-word regenerate command already declared in the repo's authority packets"
    acceptance:
      mode: gherkin
      evidence: TODO
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [tools/scripts/authority-packet/validate-authority-packets.ts, tools/scripts/lib/regenerate-command-argv.ts, tools/scripts/lib/regenerate-command-argv.test.ts]
        justification: "The new argv-parsing/allowlist logic needed a single shared home so authority-guardrails.ts's runtime execution and validate-authority-packets.ts's static declaration check enforce identical rules instead of two hand-maintained copies. Extracting it into tools/scripts/lib/regenerate-command-argv.ts and reusing it from validate-authority-packets.ts moves the allowlist guarantee into bun run check's fast static-validation lane (a bad regenerateCommand now fails at validation time, not only at execution time), which is a strictly stronger, lower-risk version of the ticket's intent. This deviation was pre-declared in the approved execution plan before implementation began"
  - id: KRT-BK006
    title: "Kernel Input Hardening: LIMIT Guard + Interop Resource Caps"
    type: Security
    effort: 2
    depends_on: []
    category: Security
    scope:
      in: [typescript/kernel/backends/sqlite/src/lib/sqlite-repositories-support.ts, rust/kernel-grpc-service/src/lib.rs]
    verification:
      command: "bun run verify:kernel"
      expected: exit 0
    description: "(a) sqlite-repositories-support.ts interpolates LIMIT ${fetchLimit} directly into a SQL string with no runtime numeric guard anywhere upstream in the call chain; add a Number.isSafeInteger (non-negative) runtime guard and switch to a parameterized LIMIT ? clause. (b) rust/kernel-grpc-service's serve_kernel_grpc registers the full kernel gRPC surface with no message-decode-size ceiling, no per-RPC timeout, and no concurrency limit, and node_walk_back has no recursion/iteration depth cap; add .max_decoding_message_size, .timeout, and .concurrency_limit_per_connection to the Server::builder() chain and a depth cap to node_walk_back, documenting the loopback-only default this seam relies on today. No proto or wire-format change"
    acceptance:
      mode: gherkin
      evidence: TODO
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [typescript/kernel/backends/sqlite/test/backend-sqlite.thread-list-limit-guard.test.ts (new), rust/kernel-grpc-service/tests/resource_caps.rs (new)]
        justification: "The ticket's declared Scope (In-Scope Files) names only the two source files (with line ranges) and does not list a test directory for either language, unlike some sibling tickets. Both fixes are behavior-bearing (Security category) and are only meaningfully provable with dedicated tests: the sqlite-side test asserts the Number.isSafeInteger/non-negative guard rejects before touching SQL and that pagination still works after parameterizing LIMIT ?; the Rust-side test spins up a real server via serve_kernel_grpc itself (rather than interop_smoke.rs's separate spawn_kernel_server helper, which has its own builder chain and would not exercise this change at all) to prove the 16 MiB decode-size ceiling is genuinely raised past tonic's unconfigured 4 MiB default. Both are new files in the conventional per-package test location for their language, following the same low-risk precedent already used across this epic"
