tickets:
  - id: KRT-BK001
    title: Extract the Shared Kernel-Backend Invariant Core
    type: Chore
    effort: 5
    depends_on: []
    category: Tech-Debt
    scope:
      in: [typescript/kernel/backends/postgres/src/lib/memory-backend-reclamation.ts, typescript/kernel/backends/memory/src/lib/memory-backend-reclamation.ts, typescript/kernel/backends/postgres/src/lib/memory-backend-record-utils.ts, typescript/kernel/backends/memory/src/lib/memory-backend-record-utils.ts, typescript/kernel/backends/postgres/src/lib/memory-backend-run-logic.ts, typescript/kernel/backends/memory/src/lib/memory-backend-run-logic.ts, typescript/kernel/backends/sqlite/src/lib/sqlite-reclamation.ts, typescript/kernel/backends/postgres/src/lib]
    verification:
      command: "bun run verify:kernel"
      expected: exit 0
    description: "Extract one shared internal module implementing the reclamation keep-closure (which state is reachable and must survive a reclaim pass), run-transition legality (which RunStatus transitions are valid and under what lease/fencing preconditions), and committed-state immutability checks, parameterized only by an error-code prefix per backend. All three backends (memory, postgres, sqlite) consume this module instead of hand-copying or re-implementing the logic. The extraction must be behavior-preserving: no backend's observable reclamation, transition-legality, or immutability behavior changes, only its source of truth for that behavior"
    acceptance:
      mode: gherkin
      evidence: TODO
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [bun.lock, tools/scripts/verify.ts, tsconfig.base.json, tsconfig.json, "each backend's package.json", "and each backend's tsconfig.dts.json/tsconfig.lib.json (plus memory's tsconfig.typecheck.json", "its only local paths override); additionally", typescript/kernel/backends/sqlite/src/lib/sqlite-run-invariants.ts.]
        justification: "The ticket's Scope explicitly authorized creating a new shared-core package (\"a new typescript/kernel/backends/core/ package if cross-package reuse requires it\"). A new Nx/Bun-workspace package cannot build, link, or typecheck without workspace-manifest wiring: bun.lock records the new package's install graph, tsconfig.base.json/tsconfig.json register its project reference, tools/scripts/verify.ts registers it in WORKSPACE_TEST_PROJECTS/WORKSPACE_BUILD_PROJECTS so bun run check's workspace-coverage gate doesn't fail on an unregistered project, and each consuming backend's package.json/tsconfig.dts.json/tsconfig.lib.json add the new @tuvren/backend-shared dependency edge. These are necessary, mechanical consequences of the pre-authorized new package, not scope creep — behavior of the extracted logic itself is unchanged (verified: bun run verify:kernel conformance counts identical pre/post at memory 64/68, sqlite 67/68, postgres 68/68)"
  - id: KRT-BK002
    title: "Reclamation Horizon: Leaseless-Run Expiry Path"
    type: Feature
    effort: 3
    depends_on: [KRT-BK001]
    category: Correctness
    scope:
      in: [typescript/kernel/backends/memory/src/lib/memory-backend-reclamation.ts, typescript/kernel/backends/memory/src/lib/memory-backend-record-utils.ts, typescript/kernel/runtime/src/lib/runtime-kernel-runs.ts, typescript/kernel/backends/sqlite/src/lib/sqlite-reclamation.ts, spec/kernel/authority-packet.json, spec/conformance/kernel/plans/kernel-reclamation.json]
    verification:
      command: "bun run verify:kernel"
      expected: exit 0
    description: "Today computeGraceHorizonMs pins the reclamation grace horizon to min(createdAtMs) over all active runs, and a run.create call with no executionOwnerId/fencingToken/leaseExpiresAtMs produces a leaseless running run that isExpiredLeasedRunningRun can never classify as expired — so a crashed owner of a leaseless run blocks reclamation of everything created after it, forever. Define and implement an explicit expiry rule for leaseless runs (either an administrative timeout/expiry path independent of lease fields, or a policy requiring leases on every abandonable run) inside the shared invariant core from KRT-BK001, and update the kernel authority packet and the reclamation conformance plan in the same change so the new rule is authoritative, not implicit"
    acceptance:
      mode: gherkin
      evidence: TODO
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [typescript/kernel/backends/memory/src/lib/memory-backend.ts, typescript/kernel/backends/sqlite/src/lib/sqlite-backend.ts, typescript/kernel/backends/postgres/src/lib/postgres-backend.ts, typescript/kernel/backends/postgres/src/lib/memory-backend-reclamation.ts, typescript/kernel/backends/shared/src/index.ts, typescript/kernel/backends/shared/src/lib/backend-invariant-record-utils.ts, typescript/kernel/backends/shared/test/backend-invariant-reclamation.leaseless-expiry.test.ts, typescript/kernel/conformance-adapter/src/host.ts, typescript/kernel/protocol/src/lib/kernel-types.ts]
        justification: "The leaseless-expiry rule needs a wall-clock reference (nowMs) inside reclaimBackendState, which the protocol layer already anticipated: ReclamationOptions.nowMs and the maintenance.reclaim() kernel-level wrapper already threaded a clock through to backend.reclaim() before this ticket, but all three backends' reclaim() methods silently discarded it. Wiring it up required each backend's reclaim() call site (memory-backend.ts, sqlite-backend.ts, postgres-backend.ts) to pass options?.nowMs ?? this.now() through to the shared core, plus postgres's own copy of the reclamation shim (memory-backend-reclamation.ts) to accept and forward it. Postgres is outside this ticket's required Gherkin proof (only memory and sqlite are asserted against), but leaving its already-injectable this.now() clock unconsumed while memory/sqlite consume theirs would silently break parity across the shared-core backends established in KRT-BK001 — postgres's own leaseless runs would simply never expire. The new isExpiredLeaselessRunningRun predicate and its LEASELESS_RUN_EXPIRY_MS default land in backend-invariant-record-utils.ts (the post-KRT-BK001 shared-core successor to the ticket-listed memory-backend-record-utils.ts, per the parenthetical already granted for the sibling reclamation file), with its own dedicated unit-test file; backend-shared/src/index.ts gained two new exports (isExpiredLeaselessRunningRun, LEASELESS_RUN_EXPIRY_MS) so both are consumable outside the package. kernel-types.ts's ReclamationOptions.nowMs JSDoc explicitly claimed \"the reference memory backend... does not consult nowMs\" — now false, so the comment was corrected (no interface shape change). host.ts gained two new probe blocks so the ticket's own Gherkin Scenario 3 (\"the leaseless-expiry check passes... bun run verify:kernel\") has a live conformance operation to assert against, per the plan's two new kernel-reclamation.json checks. Separately, typescript/kernel/runtime/src/lib/runtime-kernel-runs.ts (create, line ~273) was declared in-scope anticipating a possible lease-requirement policy change to the run-creation call shape; the team resolved the ticket's own STOP condition by choosing the administrative-timeout expiry path over requiring leases on every abandonable run, which needs no change to create()'s existing call shape — so this file carries zero diff by design, not by omission"
  - id: KRT-BK003
    title: Purge/Transact Serialization Race Fix
    type: Chore
    effort: 2
    depends_on: []
    category: Correctness
    scope:
      in: [typescript/kernel/backends/memory/src/lib/memory-backend-scope-store.ts, typescript/kernel/backends/memory/test/backend-memory.purge-scope.test.ts]
    verification:
      command: "bun run nx run backend-memory:test"
      expected: exit 0
    description: "dropScope deletes the per-scope queue entry (this.scopeQueues.delete(scope)) from inside the same call that also deletes committed state, without checking whether a later caller has already chained a new continuation onto that scope's queue. A caller arriving after the deletion chains onto a fresh Promise.resolve() instead of the true prior continuation, letting it run concurrently with a transaction still in flight — bypassing the single-writer-per-scope guarantee during tenant purge. Fix by not unconditionally deleting the queue entry while continuations may still be chained (a resolved sentinel value, or a conditional delete that only removes the map entry if it still holds the value this call installed), then add the purge-vs-concurrent-transact race regression test that does not exist today in backend-memory.purge-scope.test.ts"
    acceptance:
      mode: gherkin
      evidence: TODO
    flows: []
    certainty: assumed
    status: done
    deviations:
      - files: [typescript/kernel/backends/memory/test/backend-memory.scope-store-concurrency.test.ts (new file, not the Gherkin-named backend-memory.purge-scope.test.ts).]
        justification: "The new test targets MemoryScopeStore's internal runExclusive/dropScope serialization primitive directly (three racing actors sequenced via hand-rolled deferreds, no timers), a different concern than backend-memory.purge-scope.test.ts's existing black-box purgeScope() behavior tests. The substantive Gherkin criterion — a purge-vs-transact race test exists under bun run nx run backend-memory:test (actual Nx project name; the ticket's cited kernel-backend-memory does not exist) and asserts no concurrent window opens — is met in a differently-named file. Achieved a genuine red-then-green TDD cycle: the test failed against unmodified source with the exact predicted ordering violation (D-ran before B-done) before the fix was applied"
