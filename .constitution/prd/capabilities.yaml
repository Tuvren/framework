    group: "Data Lifecycle and Erasure"
    priority: P0
    statement: "The product must support erasure of sensitive payloads — provider, client, MCP, and tool results, plus any carried provider continuity artifacts — such that the payload becomes unrecoverable while the lineage hash structure stays intact, with the erasure authority (keys) held by the host rather than the runtime."
    rationale: "Immutable Merkle lineage cannot be edited to remove a subject's data without breaking history. Storing untrusted-edge payloads as host-key-encrypted references lets the runtime satisfy retention limits and right-to-erasure (for example tenant offboarding) without sacrificing lineage integrity or taking on key-management responsibility."
