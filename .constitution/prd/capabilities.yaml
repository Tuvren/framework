    group: "Durable Stateful Runtime Foundation"
    priority: P0
    statement: "The product must preserve agent execution as durable, inspectable state transitions rather than as only transient in-memory flow."
    rationale: "Long-running or interrupted agent work is only trustworthy if progress survives failures and can be audited."
