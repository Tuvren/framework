  - id: CAP-068
    legacy_id: CAP-P0-068
    group: "Execution Sovereignty Under Preemption"
    priority: P0
    statement: "The product must ensure that recovering a stale execution can never cause a non-idempotent side effect to occur twice: an in-flight side-effecting invocation under a lost execution lease must not be retried, a client-reported result must be treated as a proposal that becomes durable state only under valid execution authority, and side-effecting invocations must be able to carry an idempotency identity so an external system can deduplicate a retried effect."
    rationale: "When a worker is preempted (process pause, partition) and its work is recovered elsewhere, durable state is already protected by the runtime's ownership checks, but external side effects are not. Without explicit side-effect-once handling, a recovered turn can double-charge, double-send, or double-write to systems the runtime does not own."
    jobs: [JOB-10]
    certainty: assumed
    assumption: "Migrated verbatim from prd/capabilities.md, which carried no evidence reference; the capability statement has not been tied to a named acceptance artifact."
