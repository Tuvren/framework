    statement: "The product must treat session content and operational telemetry as two distinct data funnels that originate together at the runtime: the content funnel carries the durable state a session needs to be correct, continuable, and recoverable, while the telemetry funnel carries operational metadata about usage and behavior that no session depends on for correctness."
