  - id: CAP-039
    legacy_id: CAP-P0-039
    group: "Durable Stateful Runtime Foundation"
    priority: P0
    statement: "The product must support first-party enumeration of the threads owned by a runtime instance at the kernel-level structural boundary, with a backend-advertised capability bit so storage substrates that cannot enumerate efficiently can opt out and remain conformant."
    rationale: "A host application developer cannot build a serious operator-facing product (recent-threads pane, multi-thread debugger, replay UI) without listing the threads the runtime owns; the kernel already exposes branch enumeration inside a thread, and thread enumeration is the symmetric structural primitive that completes that picture without violating the mechanism-not-policy rule."
    jobs: [JOB-01, JOB-03]
    certainty: assumed
    assumption: "Migrated verbatim from prd/capabilities.md, which carried no evidence reference; the capability statement has not been tied to a named acceptance artifact."
