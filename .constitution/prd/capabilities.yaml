    group: "Capability Orchestration and Execution Classes"
    priority: P0
    statement: "The product must bind a capability to a specific execution class and endpoint based on provider, model, policy, endpoint availability, and product configuration, and must allow one logical capability to have multiple possible bindings."
    rationale: "The same logical capability (for example search or code execution) may be served provider-native, Tuvren-server, provider-mediated, or client-side; the runtime must select or allow the binding rather than hard-coding one execution owner."
    jobs: [JOB-09]
    certainty: assumed
