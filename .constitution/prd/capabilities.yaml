    group: "Model and Tool Interaction"
    priority: P0
    statement: "The product must offer a tool-authoring helper that accepts multiple schema authoring styles (Zod v3 and v4, Standard Schema-compliant schemas, and wrapped JSON Schema) without locking the host into one validator, while preserving strict TypeScript inference for the execute callback's input parameter and continuing to accept raw JSON Schema and the existing `CustomSchema` interop shape at the boundary contract."
    rationale: "A tool ecosystem that forces one validator narrows adoption, loses type inference whenever the host's chosen toolkit differs, and contradicts the product posture that ergonomics is a first-class outcome; the boundary contract must remain stable for portability, but the authoring helper is where the SDK earns its DX."
