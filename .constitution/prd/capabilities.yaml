    group: "Capability Orchestration and Execution Classes"
    priority: P0
    statement: "The product must apply policy at two distinct decision points — before a tool surface is exposed to a model, and before a capability is invoked — covering at least provider/model compatibility, user and organization permissions, approval requirements, data-residency restrictions, active-endpoint requirements, user-presence requirements, credential boundaries, idempotency and retry behavior, and risk classification."
    rationale: "Exposure and invocation are different trust decisions; conflating them hides whether a capability was withheld from the model or merely blocked at call time."
