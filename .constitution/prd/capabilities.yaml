  - id: CAP-056
    legacy_id: CAP-P0-056
    group: "Capability Orchestration and Execution Classes"
    priority: P0
    statement: "The product must separate the model-facing tool surface (what the model may see and call) from the underlying capability (the authority to perform an action), so that one capability can back multiple surfaces and one surface can resolve to different capabilities across providers and contexts."
    rationale: "A single `name + description + schema + execute` shape only describes a developer-defined function executed locally; it cannot honestly represent capabilities the provider executes, capabilities a provider invokes against a developer endpoint, or capabilities a client environment executes."
    jobs: [JOB-09]
    certainty: assumed
    assumption: "Migrated verbatim from prd/capabilities.md, which carried no evidence reference; the capability statement has not been tied to a named acceptance artifact."
  - id: CAP-057
    legacy_id: CAP-P0-057
    group: "Capability Orchestration and Execution Classes"
    priority: P0
    statement: "The product must recognize four execution classes — provider-native, provider-mediated developer-provided, Tuvren-server, and Tuvren-client — each with distinct ownership of execution, state, credentials, observability, and control, and must not model all of them as locally executed functions."
    rationale: "These classes differ in who executes, who owns state, who owns credentials, who sees intermediate steps, who can cancel, retry, or audit, who pays, where data is processed, and whether behavior is portable; collapsing them into one abstraction makes runtime behavior unsafe to reason about."
    jobs: [JOB-09]
    certainty: assumed
    assumption: "Migrated verbatim from prd/capabilities.md, which carried no evidence reference; the capability statement has not been tied to a named acceptance artifact."
  - id: CAP-058
    legacy_id: CAP-P0-058
    group: "Capability Orchestration and Execution Classes"
    priority: P0
    statement: "The product must resolve every model-visible tool call to a policy-checked capability invocation against a known execution class; provider-native invocations are the only case where the provider owns execution, and they must still be represented as known provider-native capabilities with explicit observation and control limits."
    rationale: "This invariant keeps the runtime honest: there is no untyped, unclassified tool call, and the runtime never silently assumes control it does not have."
    jobs: [JOB-09]
    certainty: assumed
    assumption: "Migrated verbatim from prd/capabilities.md, which carried no evidence reference; the capability statement has not been tied to a named acceptance artifact."
  - id: CAP-059
