  - id: OD-17
    question: "The memory kernels apply a branch-head compare-and-set under a per-scope exclusive lock, so a barrier seam at the compare-and-set would serialize the contenders. What does the syscall concurrent-writer check certify?"
    blocks: [KRT-DE003, KRT-DE005, KRT-DE006]
    options:
      - name: Certify transaction-entry overlap and prove sensitivity with the stale-head mutant
        pros:
          - "Both contenders are held at transaction entry and released together, so each reads the common base head before either commits; a kernel that validates and commits in separate transactions is caught, as the harness-independent stale-head mutant (kernel.accept-stale-head-update) shows."
          - "No product change to the kernels' locking; the barrier stays a test-only seam."
        cons:
          - "The check does not prove the compare-and-set itself runs concurrently; on today's memory kernels execution after release is equivalent to two serialized writes that both started from the base head."
      - name: Move the seam to the compare-and-set by changing kernel locking
        pros: [The check would prove overlap at the exact commit point.]
        cons:
          - "Requires a product change to the memory kernels' concurrency model, outside this epic's certification scope, and an architecture record."
    recommendation: Certify transaction-entry overlap and prove sensitivity with the stale-head mutant
    closure: ruling
    ruler: "Owner, after the EPIC-DE merge"
    status: proposed
    asked:
      date: 2026-10-27
      in: EPIC-DE
    proposed_by: EPIC-DE @ 79f9631
    interim:
      assumption: "The barrier seam sits at transaction entry; the concurrent-writer certificate claims overlapping transaction entry, not overlapping compare-and-set. In-process seams release participants to the serialization point in list order, so release order fixes the winner and the post-release outcome equals sequential writes in release order; what the race adds is two entry receipts before release, the head still at base between receipts and release, and the stale-head mutant's kill. Durable backends racing from two processes are outside this guarantee."
