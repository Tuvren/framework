decisions:
  - id: OD-01
    question: "Should Tuvren support merging two divergent Branch histories into one canonical history?"
    blocks:
      - "prd/capabilities.yaml#CAP-003"
      - architecture/flows/flow-tenant-offboarding-erasure.md
    options:
      - name: Defer canonical Branch merge
        pros:
          - Preserves separate histories without inventing a conflict or provenance model.
        cons: [Does not support durable convergence of independent lineage yet.]
      - name: Add canonical Branch merge
        pros: [Could serve a future workflow that requires durable convergence.]
        cons:
          - "The framework lacks an agreed conflict, provenance, durability, and runner-neutral merge model."
    recommendation: Defer canonical Branch merge
    closure: ruling
    ruler: "User, 2026-08-19 Realign interview"
    status: open
    asked:
      date: 2026-08-19
      in: ".constitution/reports/2026-08-19-interview-realign.md"
  - id: OD-02
    question: "Should parallel worker executions with an aggregation Step become the supported model for ephemeral multi-agent work?"
    blocks:
      - "prd/capabilities.yaml#CAP-026"
      - "prd/capabilities.yaml#CAP-027"
      - "prd/capabilities.yaml#CAP-028"
      - "prd/capabilities.yaml#CAP-029"
      - architecture/flows/flow-runner-handoff-child-orchestration.md
    options:
      - name: Defer generalized fan-out and aggregation
        pros:
          - Preserves proven handoff and worker behavior without generalizing it.
        cons: [Does not establish a supported parallel child-execution model.]
      - name: Support parallel fan-out and aggregation
        pros:
          - Could satisfy an adopter workflow or benchmark requiring durable aggregation.
        cons:
          - "Isolation, persistence, aggregation, cancellation, partial-failure, and parent-child semantics have not been established."
    recommendation: Defer generalized fan-out and aggregation
    closure: ruling
    ruler: "User, 2026-08-19 Realign interview"
    status: open
    asked:
      date: 2026-08-19
      in: ".constitution/reports/2026-08-19-interview-realign.md"
  - id: OD-03
    question: "Should Tuvren provide managed erasure for one subject inside a shared Scope, or limit its guarantee to Scope-level erasure?"
    blocks: [architecture/flows/flow-tenant-offboarding-erasure.md]
    options:
      - name: Guarantee Scope-level erasure
        pros:
          - Hosts can choose finer Scope granularity and compose identifiers to match their ownership model.
        cons:
          - Does not provide managed erasure for one subject inside an active shared Scope.
      - name: Provide managed intra-Scope subject erasure
        pros:
          - Could meet a concrete adopter need that Scope design cannot meet.
        cons:
          - "Tuvren has no subject identity, subject-to-record index, or per-subject lifecycle contract."
    recommendation: Guarantee Scope-level erasure
    closure: ruling
    ruler: "User, 2026-08-19 Realign interview"
    status: open
    asked:
      date: 2026-08-19
      in: ".constitution/reports/2026-08-19-interview-realign.md"
  - id: OD-04
    question: "Should the deferred Bun upgrade block the independent public release readiness work?"
    blocks: [KRT-BN002, KRT-BN003, KRT-BN004, KRT-BN005, KRT-BN006, KRT-BN007]
    options:
      - name: Continue independent release work on the retained toolchain
        pros:
          - "Preserves the working release gate while correcting publication closure, release discipline, and adopter guidance."
          - Keeps the Bun upgrade visibly deferred rather than claiming its unmet acceptance criteria passed.
        cons:
          - The release preparation runs on Bun 1.3.10 while the user-ruled Bun 1.4.2 target remains pending.
          - Requires later Stage 4 alignment of dependencies that were broader than the implementation prerequisites.
      - name: Defer all release work until Bun 1.4.2 is compatible
        pros:
          - Preserves a strict completion interpretation of the existing ticket dependency graph.
        cons:
          - Leaves independent publication and release-policy defects unresolved despite a working baseline toolchain.
    recommendation: Continue independent release work on the retained toolchain
    closure: ruling
    ruler: Repository owner after Epic BN merge
    waiting_on: Bun 1.4.2 regression evidence and retained-toolchain verification in .constitution/evidence/KRT-BN001/
    interim:
      assumption: "BN002 through BN007 require the reviewed working toolchain but no Bun 1.4-specific feature; execute them in their existing order after BN001's reviewed deferral."
      applied_by:
        - KRT-BN002
        - KRT-BN003
        - KRT-BN004
        - KRT-BN005
        - KRT-BN006
        - KRT-BN007
        - package.json
        - devenv.nix
    status: closed
    asked:
      date: 2026-09-29
      in: EPIC-BN
    proposed_by: EPIC-BN @ 4077137
    ruling:
      ref: ".constitution/reports/2026-09-29-interview-tech-spec.md"
      date: 2026-09-29
      summary: "Continue independent release work on the retained toolchain; the release shipped as 0.2.0 on it. The Bun 1.4 upgrade becomes the first of three toolchain epics."
      chosen: Continue independent release work on the retained toolchain
  - id: OD-05
    question: "How do TypeScript build, typecheck, and test actions resolve workspace packages and node_modules inside Bazel actions while keeping the cache sound?"
    blocks:
      - tech-spec/adrs/ADR-0013-workspace-orchestration-uses-devenv-and-nx.md
      - tech-spec/adrs/ADR-0017-native-toolchains-remain-authoritative-inside-each-impl.md
    options:
      - name: Staged node_modules from a bun install repository rule
        pros:
          - "Sandboxed actions with declared inputs, so the cache is sound."
          - "Workspace @tuvren/* entries can point at bazel-bin outputs."
        cons:
          - Effectively a small bun-flavored rules_js to build and maintain.
          - bun workspace symlink semantics must be reproduced.
      - name: In-tree actions with no-sandbox and a declared bun.lock and dist stamp
        pros: ["Closest to today's Nx behavior and least new machinery."]
        cons:
          - Undeclared in-tree dist and node_modules reads risk stale cache hits.
          - "Cache soundness rests on discipline, not enforcement."
      - name: "tsconfig path-to-source only, no dist between packages"
        pros: [No dist ordering between packages.]
        cons:
          - "Changes how packages resolve each other versus published exports; package exports point at dist."
    recommendation: Staged node_modules from a bun install repository rule
    closure: spike
    spike: SPK-KRT-OD005
    status: closed
    asked:
      date: 2026-09-29
      in: ".constitution/reports/2026-09-29-interview-tech-spec.md"
    ruling:
      ref: SPK-KRT-OD005
      date: 2026-09-29
      summary: "Staged node_modules built by a bun install repository rule, with workspace packages copied from bazel-bin. Build actions use the upstream dist edge; typecheck and test resolve upstream packages to source. It was the only option whose cache stayed sound under the in-workspace tampering probes. The external node_modules contents remain a trust boundary: only the repository-rule stamp is declared, and hiding a package there served a cached PASS despite failing real tests (measurement 4d). PATH is pinned and tools are called by explicit path."
      chosen: Staged node_modules from a bun install repository rule
  - id: OD-06
    question: "What does adopting the ultracite oxlint/core and oxfmt presets as shipped, without parity overrides, cost in violations and reformat size on this repository?"
    blocks: [tech-spec/adrs/ADR-0012-typescript-tooling-uses-biome-and-tsup.md]
    options:
      - name: Adopt the ultracite oxlint/core and oxfmt presets as shipped
        pros:
          - Strictness discourages workarounds in a heavily agent-driven repository.
          - No repository-local rule policy to maintain.
        cons:
          - "The preset sets several rule categories to error, so violation volume may be large."
          - oxfmt is beta.
      - name: Adopt the presets with repository overrides for Biome parity
        pros: [Smaller first migration.]
        cons:
          - Overrides are the kind of workaround the owner wants to avoid.
          - A repository-local policy to maintain.
    recommendation: Adopt the ultracite oxlint/core and oxfmt presets as shipped
    closure: spike
    spike: SPK-KRT-OD006
    status: closed
    asked:
      date: 2026-09-29
      in: ".constitution/reports/2026-09-29-interview-tech-spec.md"
    ruling:
      ref: SPK-KRT-OD006
      date: 2026-09-29
      summary: "Adopt ultracite oxlint/core and oxfmt as shipped with no rule overrides, including --type-aware. The reformat is about 1.3k lines; the lint cleanup far exceeds the diff budget and is split by directory with a pilot gate on the first directory for the func-style and no-use-before-define reordering."
      chosen: Adopt the ultracite oxlint/core and oxfmt presets as shipped
  - id: OD-07
    question: "Which Bazel-native ruleset arrangement for Rust, Go, Python, and Dart builds and tests our lockfiles on both a NixOS devenv machine and ubuntu CI, and which languages need a recorded native-wrapped exception?"
    blocks:
      - tech-spec/adrs/ADR-0013-workspace-orchestration-uses-devenv-and-nx.md
      - tech-spec/adrs/ADR-0017-native-toolchains-remain-authoritative-inside-each-impl.md
    options:
      - name: Bazel-native rules for every non-TypeScript language
        pros:
          - Uniform hermetic graph with no per-language exceptions.
          - Native lockfiles stay authoritative.
        cons:
          - Dart has only an early-stage single-maintainer ruleset.
          - Python uv.lock consumption is immature and go.work cross-module imports are fragile.
      - name: "Bazel-native rules where the spike proves them, native-wrapped actions as recorded exceptions elsewhere"
        pros:
          - Adopts hermetic rules only where evidence supports them.
          - Each exception is explicit and revisitable.
        cons: [Mixed execution model to document and maintain.]
      - name: Native-wrapped actions for all non-TypeScript languages
        pros: [Lowest migration risk.]
        cons:
          - Not Bazel-native as the owner intends.
          - Gives up hermetic Rust and Go that are already feasible.
    recommendation: "Bazel-native rules where the spike proves them, native-wrapped actions as recorded exceptions elsewhere"
    closure: spike
    spike: SPK-KRT-OD007
    status: closed
    asked:
      date: 2026-09-29
      in: ".constitution/reports/2026-09-29-interview-tech-spec.md"
    ruling:
      ref: SPK-KRT-OD007
      date: 2026-09-29
      summary: "Rust (rules_rust 0.74.0) and Go (rules_go 0.63.0 with gazelle) adopt Bazel-native rules with a hermetic C toolchain and pinned toolchains. Python (rules_python 2.3.4 over a requirements file exported from uv.lock) is PROVISIONAL: the spike demonstrates one target with 289 tests, not all three packages. The Python ticket must demonstrate all 298 tests (289 + 8 + 1) under both NixOS devenv and ubuntu CI conditions before adoption; aspect_rules_py is the fallback. Dart is the recorded native-wrapped exception until rules_dart consumes our pubspec.lock without a carried patch."
      chosen: "Bazel-native rules where the spike proves them, native-wrapped actions as recorded exceptions elsewhere"
