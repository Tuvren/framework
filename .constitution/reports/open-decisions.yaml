  - id: OD-24
    question: "After an iteration fails hard, how do the branch head and the turn head return to the stable head in one kernel transaction, so failed iteration work is never observable (ADR-0083 decision 4)? SPK-KRT-DM001 found that no existing syscall does both. The kernel specification is ambiguous about who moves the turn head during a checkpoint: docs/KrakenKernelSpecification.md line 435 says the Turn head advances as TurnNodes are created, line 439 says it is updated via turn.updateHead, and section 5.5 is silent. Both the TypeScript and Rust kernels move the turn head inside the checkpoint, all four TypeScript backends enforce that an active run stays aligned with the turn head, and no kernel conformance plan observes a turn head after a checkpoint."
    blocks: [KRT-DM003]
    options:
      - name: A compound kernel operation that completes the run as failed and rewinds both heads atomically (proposed name run.failAndRewind)
        pros:
          - "Atomic end to end, so concurrent durable reads never see the failed checkpoint and a crash cannot leave the heads split."
          - "Keeps the reactive-checkpoint and archival obligations inside the kernel's single transaction."
        cons:
          - "A new syscall needs the kernel authority packet, plans, interop proto, and every kernel implementation, plus crash and concurrency semantics defined in authority."
      - name: A compound rewind operation that moves both heads back to the stable head atomically after run.complete(failed)
        pros: ["A smaller operation, and the heads never split."]
        cons:
          - "The failed checkpoint is visible between run.complete(failed) and the rewind, which contradicts ADR-0083 decision 4; it is still a new syscall across every kernel."
      - name: "Change the kernels so checkpoints move only the branch head, then rewind only the branch head"
        pros: [No new syscall for the failure path.]
        cons:
          - "It changes both the Rust and TypeScript kernels, the active-run alignment rule in four TypeScript backends, and adds a separate turn.updateHead after every successful checkpoint; failed work is still visible between transactions."
    recommendation: A compound kernel operation that completes the run as failed and rewinds both heads atomically (proposed name run.failAndRewind)
    closure: ruling
    ruler: "Owner, through a Stage 3 ADR and kernel authority change"
    status: proposed
    asked:
      date: 2026-10-29
      in: EPIC-DM
    proposed_by: EPIC-DM @ b243e48
    interim:
      assumption: "KRT-DM003 is deferred, so the failure path keeps today's head behavior. KRT-DM002's checks are written against it, and the backend head mismatch from finalization appears only as a subsequent error. When the rewind lands, finalization stops failing. The two runtime-lifecycle-ext.tool-admission checks must then drop their subsequentErrors length and non-fatal-event assertions, or they go red."
      applied_by: [KRT-DM002]
  - id: OD-20
    question: "On a backend that advertises a shared backend clock, which clock stamps the kernel's non-lease durable timestamps (thread, branch, turn, run, node, staged-result, checkpoint createdAtMs and updatedAtMs)? The specification assigns only lease stamping to backend time (section 5.2, ADR-0050)."
