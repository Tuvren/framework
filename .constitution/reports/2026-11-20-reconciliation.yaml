    from: DT
  - stage: tech-spec
    item: "code decision (convention): A durable backend that also claims kernel.memory lists it after its durable profiles in the manifest profiles array. The order is a readability convention; certificate linking and the certified inventory do not depend on it. [typescript/kernel/conformance-adapter/adapter-sqlite.json, typescript/kernel/conformance-adapter/adapter-postgres.json] at 5c71a65"
    from: DT
  - stage: tech-spec
    item: "code decision (pattern): Mutants that corrupt a clock-dependent listing decorate the backend transaction (decorateTransactions) rather than the kernel facade, so the corruption survives a shared-lease-clock clamp. [typescript/kernel/testkit/src/lib/kernel-mutants-protocol.ts] at 5c71a65"
    from: DT
  - stage: tech-spec
    item: "code decision (pattern): A composed mutant calls activate only after the violating action succeeds, so a retry that a backend rejects does not count as activation. [typescript/kernel/testkit/src/lib/kernel-mutants-protocol.ts] at 47e9936"
