  - id: comparison-current-lateral-hashes
    class: V
    evidence: disagreement-summary.json
    owner: EPIC-DE lead
    resolution: "The root event hashes differ under the permitted bootstrap rule;
      descendants have different inputs. Both implementations pass identity
      assertions on the observed root and descendants, and identical records
      with different hashes remain disagreements."
    status: resolved
  - id: comparison-current-schema-error-details
    class: V
    evidence: disagreement-summary.json
    owner: EPIC-DE lead
    resolution: "Both kernels return the catalogued duplicate_schema_path code; the catalog defines no details shape, so the comparison treats details as non-normative when codes match and still reports a differing code as a disagreement. The interim Rust change that copied the TypeScript details shape was reverted (1f5df2a) because TypeScript behavior does not decide semantics."
    status: resolved
