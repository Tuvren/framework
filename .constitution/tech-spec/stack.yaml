compatibility_policy:
  pinning: Every dependency is pinned exactly. TypeScript packages carry exact versions in package.json and bun.lock; Rust crates are pinned by Cargo.lock against the rust-toolchain.toml channel; Dart packages are pinned by the committed pubspec.lock; Python packages by uv.lock; Go modules by go.work plus each module go.sum. Toolchains that are not language dependencies (Bun, buf, protobuf, Go, Python, Dart, PostgreSQL) are provisioned by devenv and pinned by the nixpkgs revision in devenv.lock. Versions named here are authoritative for the baseline implementation line and must match the repository manifests.
  lockfiles:
    - bun.lock
    - Cargo.lock
    - pubspec.lock
    - uv.lock
    - go.work
    - devenv.lock
    - MODULE.bazel.lock
  upgrade_boundaries: Public package APIs follow semantic versioning. A change to kernel record encoding, the hash algorithm, or durable identity rules is semver-major and needs an ADR. Semantic surface versions for the kernel protocol, framework contracts, event vocabulary, error vocabulary, conformance suites, and interop transport are tracked independently of npm package or crate versions. Adding a new implementation language, a new official backend, or a new interop transport needs an ADR before its pins enter this file; a routine patch or minor bump inside an already-approved dependency does not.
