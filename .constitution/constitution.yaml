schema_version: 1
acronym: KRT
archetype:
  primary: Library/SDK
  secondary:
    - CLI/Tooling
  confidence: high
  rationale: "vision.md names the target archetype as an embeddable stateful agent and workflow runtime kernel plus a runner-oriented framework/SDK: the product is consumed as a library by host applications and is never a hosted service. The reference host is a serious REPL CLI that proves the SDK, which makes CLI/Tooling a secondary archetype rather than the primary one."
surfaces:
  - .constitution/tech-spec/contracts/**
  - .constitution/tech-spec/data-models/**
  - spec/core/typespec/main.tsp
  - spec/core/artifacts/json-schema
  - spec/kernel/cddl/kernel-records.cddl
  - spec/kernel/authority-packet.json
  - spec/interop/proto/tuvren/kernel/interop/v1/kernel_services.proto
  - spec/interop/proto/tuvren/kernel/interop/v1/kernel_types.proto
  - spec/providers/typespec/main.tsp
  - spec/runners/typespec/main.tsp
  - spec/streaming/typespec/main.tsp
  - spec/streaming/artifacts/json-schema
  - spec/streaming/sse/typespec/main.tsp
  - spec/streaming/sse/artifacts/json-schema
  - spec/streaming/ws/typespec/main.tsp
  - spec/streaming/ws/artifacts/json-schema
  - spec/streaming/resume/typespec/main.tsp
  - spec/streaming/resume/artifacts/json-schema
  - spec/tools/typespec/main.tsp
  - spec/tools/mcp/authority-packet.json
  - spec/host/typespec/main.tsp
  - spec/host/session/typespec/main.tsp
  - spec/host/session/artifacts/json-schema
  - spec/telemetry/authority-packet.json
  - tools/schemas/authority-packet.schema.json
  - tools/schemas/conformance-plan.schema.json
  - typescript/kernel/backends/sqlite/migrations
  - typescript/kernel/backends/postgres/migrations
diff_exclusions:
  - "**/Cargo.lock"
  - "**/bun.lock"
  - "**/pubspec.lock"
  - "**/*.snap"
  - "**/go.sum"
  - "**/uv.lock"
  - "**/MODULE.bazel.lock"
  - "**/devenv.lock"
default_branch: master
exceptions:
  - rule: STR-002
    reason: Four generated gate artifacts (epic-ad-normative-docs-claim-inventory.json, epic-ad-docs-to-authority-coverage-matrix.json, epic-af-conformance-gap-plan.json, epic-al-portability-inventory.json) and their markdown companions are written and re-read from hard-coded .constitution/reports/ paths by tools/scripts/docs-authority-freeze-gate.ts, tools/scripts/epic-af-conformance-gap-plan.ts, and tools/scripts/portability-gate.ts, which bun run check and bun run verify both enforce. Relocating them outside .constitution/ is a code change those scripts own, not a documentation move; this exception holds until an epic repoints them.
