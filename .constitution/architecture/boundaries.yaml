  - id: BND-06
    legacy_id: Extension Runtime
    name: Extension Runtime
    kind: container
    type: Policy composition boundary
    responsibility: Host lifecycle hooks, around-model wrappers, around-tool wrappers, system prompt contributions, extension-owned state updates, and declared shared exports within bounded contracts.
    inputs:
      - Execution context
      - manifests
      - prompts
      - tool calls
      - model responses
      - tool results
      - iteration outcomes
    outputs:
      - Verdicts
      - state updates
      - custom events
      - prompt contributions
