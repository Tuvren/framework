boundaries:
  - id: BND-01
    legacy_id: Host Integration Boundary
    name: Host Integration Boundary
    kind: container
    type: External boundary adapter
    responsibility: "Expose Tuvren to embedding environments, initiate turns, await terminal execution results, consume event streams, list and read durable state through the host-facing Durable-Read Surface, surface status, deliver steering, route approvals, and trigger cancellation. The first product-depth proof host is a serious REPL CLI built against this same boundary rather than a privileged internal harness, with both an interactive operating mode and a headless stdin-driven mode. This boundary also owns the duplex session seam: the framework-defined wire vocabulary through which a remote session peer consumes the outbound stream and submits inbound control frames (client results, approval responses, steering, cancellation) that a session binding routes to the held execution handle and the Client Endpoint Boundary. A WebSocket carriage binding may implement this seam over a single bidirectional connection: it owns handshake, heartbeat, close-code vocabulary, and bounded outbound backpressure only, carrying the Event Stream Adapter Layer's resume cursor on its handshake and outbound event frames without owning cursor or replay semantics itself. Between the session binding and any carriage binding sits a session-lifecycle seam that keeps one session alive across a link that can drop: it holds the session's single outbound claim, owns the one sequencer and one replay window the Event Stream Adapter Layer's wiring rule requires, admits at most one live carriage at a time, replays the sequenced event stream from a cursor on reattach, re-presents client invocations still awaiting a result, and converts a lost link or an unresponsive peer into typed capability results rather than a hung invocation. Session identity — which live session a reconnecting peer is asking for — stays host application state alongside authentication and tenancy, never framework state."
    inputs:
      - User or system signals
      - approval responses
      - steering signals
      - cancellation requests
      - runtime events
      - durable-read queries (list threads, list branches, get state at TurnNode, walk turn history, read branch messages)
      - inbound session frames from remote session peers
      - carriage attach and detach transitions
    outputs:
      - Turn-start requests
      - control signals
      - terminal execution results
      - translated protocol events
      - host-visible execution status
      - durable-read responses
      - captured transcript artifacts
      - session frames (wrapped canonical events, client-invocation dispatches, session rejections)
    depends_on:
      - BND-03
      - BND-19
    trust_boundary: true
    certainty: assumed
    assumption: Migrated from architecture/containers.md; the boundary has not been tied to a named code path or conformance check.
  - id: BND-02
    legacy_id: Curated Host-Facing SDK Surface
    name: Curated Host-Facing SDK Surface
    kind: container
    type: Host-developer ergonomics boundary
    responsibility: "Compose the underlying runtime containers into one curated host-facing surface that a host developer consumes. This is a logical boundary, not a single physical artifact: it groups a Shared Primitive Container (subpath-exported primitives covering messages, tools, events, errors, execution, runner contracts, provider contracts, and extensions) and a Slim Convenience Container (re-exports the curated primitives and exposes the Batteries-Included Composition entrypoint that assembles kernel, backend, runner registry, and framework runtime from one factory call). Leaf integration containers (backends, stream adapters, runners, provider bridges, MCP Client Container, Schema Authoring Helper, Tool Source Container) peer-depend on the Shared Primitive Container so that one runtime instance always sees one primitive instance."
    inputs:
      - "Host-developer composition requests (which backend, which runner, which provider, which tools, and funnel routing — where the content funnel and the telemetry funnel each persist: split, unified, or mixed substrates)"
      - leaf integration container choices
      - primitive imports from subpaths
    outputs:
      - A wired-up Framework Shared Services instance the host can drive through the Host Integration Boundary; curated primitive exports consumable by hosts
      - extensions and downstream packages
    depends_on:
      - Shared Primitive Container
      - Slim Convenience Container
      - BND-03
      - BND-17
      - BND-18
      - BND-04
      - BND-07
      - BND-08
      - BND-09
      - BND-11
    certainty: assumed
    assumption: Migrated from architecture/containers.md; the boundary has not been tied to a named code path or conformance check.
  - id: BND-03
    legacy_id: Framework Shared Services
    name: Framework Shared Services
    kind: container
    type: Application service layer
    responsibility: "Own the stable framework contracts and shared runtime services above the kernel, including execution-handle lifecycle, turn/run orchestration shell, context manifest maintenance, event publication, extension coordination, runner selection, terminal-value resolution on every execution handle (the unified `awaitResult` surface), and the Durable-Read Surface. The Durable-Read Surface composes existing kernel structural primitives (`branch.list`, `node.get`, `node.walkBack`, `tree.resolve`, `tree.manifest`, `store.get`) and the new kernel `thread.list` primitive into host-facing operations: list threads owned by the runtime instance (with cursor-based pagination and optional filters), list branches inside a thread, read structured runtime state at any TurnNode, walk turn history of a branch as an async iterator with a cursor (newest-first), and read durable conversational messages on a branch without requiring the host to reconstruct messages from TurnTree references and the content-addressed object store by hand. Framework Shared Services also owns Execution Bound enforcement: it caps per-turn iterations, tool calls, and resource budget above runner discretion, and when a configured bound is reached it forces a safe terminal outcome (a typed bounded-execution result) rather than allowing an unbounded loop. It emits canonical runtime activity to the Telemetry & Observability Boundary in the same vocabulary it publishes to the Event Stream Adapter Layer."
    inputs:
      - Host commands
      - execution state from durable history
      - extension contributions
      - runner-emitted control outcomes
      - provider and tool gateway results
      - durable-read queries from hosts
      - execution-bound configuration
    outputs:
      - Runner invocation requests
      - kernel syscalls (read and write)
      - runtime status transitions
      - event publication
      - approval state
      - steering incorporation
      - host-visible execution handles with terminal-value resolution
      - host-facing durable-read responses
    depends_on:
      - BND-04
      - BND-05
      - BND-06
      - BND-16
      - BND-17
      - BND-19
    certainty: assumed
    assumption: Migrated from architecture/containers.md; the boundary has not been tied to a named code path or conformance check.
  - id: BND-04
    legacy_id: Runner Runtime
    name: Runner Runtime
    kind: container
    type: Execution strategy boundary
    responsibility: Implement one concrete execution model over shared framework primitives. The initial baseline is the ReAct Runner, which renders prompts, interprets provider responses, evaluates loop decisions, and determines when to continue, pause, hand off, fail, or end a turn.
    inputs:
      - Active context
      - runner configuration
      - provider responses
      - tool results
      - extension verdicts
      - steering state and framework-owned control constraints
    outputs:
      - Canonical assistant messages
      - tool batches
      - runtime resolutions
      - runner-specific state transitions and context-engineering or orchestration intents
    depends_on:
      - BND-07
      - BND-08
      - BND-06
      - BND-05
    certainty: assumed
    assumption: Migrated from architecture/containers.md; the boundary has not been tied to a named code path or conformance check.
  - id: BND-05
    legacy_id: Context Assembly and Engineering
    name: Context Assembly and Engineering
    kind: container
    type: Domain service layer
    responsibility: Build the active working context from durable history, maintain the context manifest, and execute explicit context reshaping actions such as reduction, compaction, substitution, or handoff context rewrites.
    inputs:
